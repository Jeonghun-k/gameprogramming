<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고로캣 v17</title>
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { background: #444; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
// 고로캣 v17 - 중간 보스 3종을 정훈 SVG로 교체 (슬라임 대왕 · 태양 수호자 · UFO 사령관)
// 네모(플레이어)를 WASD로 움직이면, 가장 가까운 외계인에게 빵가루 탄환이 자동으로 발사된다
// 외계인은 체력이 있어서 탄환을 여러 번 맞아야 쓰러진다
const canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");      // 타격 이펙트 때 잠깐 다른 캔버스로 바꿔 그리기 위해 let

const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);
window.addEventListener("blur", () => { for (let k in keys) keys[k] = false; });   // 창을 벗어나면 키 모두 뗌

// ===== 맵과 카메라 =====
// 맵(월드)은 화면(800x600)의 3x3배. 화면은 그대로, 카메라가 고로캣을 따라다님
const VIEW_W = 800, VIEW_H = 600;
const WORLD_W = VIEW_W * 3, WORLD_H = VIEW_H * 3;
let camera = { x: 0, y: 0 };   // 화면 왼쪽 위가 맵의 어디인지

// 카메라를 고로캣 중심으로 옮기되, 맵 끝에서는 멈춤
function updateCamera() {
  const M = 60;   // 맵 끝에서 벽 바깥이 살짝 보이도록 여유
  camera.x = Math.max(-M, Math.min(WORLD_W - VIEW_W + M, player.x - VIEW_W / 2));
  camera.y = Math.max(-M, Math.min(WORLD_H - VIEW_H + M, player.y - VIEW_H / 2));
}

// 지금 화면에 보이는 범위 안인지 (margin만큼 여유)
function onScreen(x, y, margin) {
  return x > camera.x - margin && x < camera.x + VIEW_W + margin &&
         y > camera.y - margin && y < camera.y + VIEW_H + margin;
}

// ===== 라운드별 맵 =====
// 1R 고로캣의 집 → 2R 우주선 아래 뒷마당(트랙터 빔) → 3R 우주선 내부 → 4R 우주선 조종실
// 맵마다 지나갈 수 없는 사물(장애물)이 있음. 배경은 라운드가 시작될 때 한 번만 큰 캔버스에 그려두고 매 프레임 복사

const MAP_INFO = [
  { name: "고로캣의 집" },
  { name: "외계인 우주선 아래" },
  { name: "우주선 내부" },
  { name: "우주선 조종실" }
];

let obstacles = [];                 // 지금 맵의 장애물 {x, y, w, h, kind}
const mapCanvas = document.createElement("canvas");
mapCanvas.width = WORLD_W; mapCanvas.height = WORLD_H;
const mctx = mapCanvas.getContext("2d");
let mapOverlay = null;              // 캐릭터보다 위에 그릴 것 (2라운드 우주선)

// 같은 맵은 항상 같은 모양이 되도록 고정된 난수
let seed = 1;
function srand(s) { seed = s; }
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function rr(c, x, y, w, h, r) {          // 둥근 사각형 경로
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function box(c, x, y, w, h, r, fill, stroke, lw) {
  rr(c, x, y, w, h, r); c.fillStyle = fill; c.fill();
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 3; c.stroke(); }
}
function shadow(c, x, y, w, h) {        // 사물 아래 그림자
  c.fillStyle = "rgba(0,0,0,0.25)";
  rr(c, x + 6, y + 10, w, h, 10); c.fill();
}

// ---------- 장애물 그리기 (종류별) ----------
function drawObstacle(c, o) {
  const { x, y, w, h } = o;
  if (["plant", "tree", "pillar", "tube", "chair", "holo", "rock"].includes(o.kind)) {   // 둥근 사물은 둥근 그림자
    c.fillStyle = "rgba(0,0,0,0.25)";
    c.beginPath(); c.ellipse(x + w / 2 + 6, y + h / 2 + 10, w * 0.45, h * 0.42, 0, 0, 7); c.fill();
  } else shadow(c, x, y, w, h);
  switch (o.kind) {
    // --- 1R 집 ---
    case "sofa":
      box(c, x, y, w, h, 16, "#c0563f", "#6e2a1f");
      box(c, x + 8, y + 8, w - 16, h * 0.35, 10, "#d7705a");                 // 등받이
      box(c, x + 6, y + h * 0.45, 22, h * 0.5, 10, "#a8452f");                // 팔걸이
      box(c, x + w - 28, y + h * 0.45, 22, h * 0.5, 10, "#a8452f");
      c.strokeStyle = "rgba(0,0,0,0.2)"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + w / 2, y + h * 0.48); c.lineTo(x + w / 2, y + h - 6); c.stroke();
      break;
    case "table":
      box(c, x, y, w, h, 10, "#a8743f", "#5c3a1a");
      c.strokeStyle = "rgba(255,255,255,0.12)"; c.lineWidth = 2;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(x + 8, y + h * i / 4); c.lineTo(x + w - 8, y + h * i / 4); c.stroke(); }
      c.fillStyle = "#f2efe6"; c.beginPath(); c.arc(x + w * 0.35, y + h * 0.45, 12, 0, 7); c.fill();   // 접시
      c.fillStyle = "#d9a14a"; c.beginPath(); c.arc(x + w * 0.35, y + h * 0.45, 7, 0, 7); c.fill();    // 고로케!
      c.fillStyle = "#f2efe6"; c.beginPath(); c.arc(x + w * 0.68, y + h * 0.55, 10, 0, 7); c.fill();
      break;
    case "shelf":
      box(c, x, y, w, h, 6, "#7a4e2a", "#3f2610");
      for (let i = 0; i < Math.floor(w / 18); i++) {
        const cols = ["#3c7dbf", "#c94c4c", "#e0b84a", "#5aa36b", "#8a5cc2"];
        c.fillStyle = cols[i % 5];
        c.fillRect(x + 8 + i * 18, y + 8, 12, h - 16);
      }
      break;
    case "bed":
      box(c, x, y, w, h, 14, "#e9e4f2", "#6c6488");
      box(c, x + 10, y + 10, w - 20, h * 0.22, 10, "#ffffff", "#b8b0cc", 2);   // 베개
      box(c, x + 6, y + h * 0.38, w - 12, h * 0.58, 12, "#7d9fd6", "#4c6aa0", 2); // 이불
      c.fillStyle = "rgba(255,255,255,0.35)";
      for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(x + 30 + i * (w - 60) / 3, y + h * 0.7, 6, 0, 7); c.fill(); }
      break;
    case "plant":
      c.fillStyle = "#b5653a"; c.beginPath(); c.arc(x + w / 2, y + h / 2, w * 0.36, 0, 7); c.fill();
      c.strokeStyle = "#6e3a1e"; c.lineWidth = 3; c.stroke();
      for (let i = 0; i < 7; i++) {
        const a = i * 0.9;
        c.fillStyle = i % 2 ? "#4f9a4a" : "#3d7f3a";
        c.beginPath(); c.ellipse(x + w / 2 + Math.cos(a) * w * 0.22, y + h / 2 + Math.sin(a) * h * 0.22, w * 0.24, w * 0.12, a, 0, 7); c.fill();
      }
      break;
    case "cattower":                      // 캣타워 (고양이 집이니까)
      box(c, x, y, w, h, 12, "#d8c3a0", "#7a6040");
      c.fillStyle = "#b89a6c";
      c.beginPath(); c.arc(x + w * 0.3, y + h * 0.3, w * 0.22, 0, 7); c.fill();
      c.beginPath(); c.arc(x + w * 0.7, y + h * 0.7, w * 0.22, 0, 7); c.fill();
      c.fillStyle = "#8f6a3c";
      c.beginPath(); c.arc(x + w * 0.3, y + h * 0.3, w * 0.1, 0, 7); c.fill();
      c.fillStyle = "#ff8fb0"; c.beginPath(); c.arc(x + w * 0.75, y + h * 0.25, 7, 0, 7); c.fill();  // 털실 공
      break;
    case "kitchen":
      box(c, x, y, w, h, 6, "#e7e2d6", "#7c766a");
      c.fillStyle = "#2c2c2c";
      for (let i = 0; i < 2; i++) { c.beginPath(); c.arc(x + 40 + i * 50, y + h / 2, 16, 0, 7); c.fill(); }   // 가스레인지
      c.strokeStyle = "#e06a2a"; c.lineWidth = 3;
      for (let i = 0; i < 2; i++) { c.beginPath(); c.arc(x + 40 + i * 50, y + h / 2, 9, 0, 7); c.stroke(); }
      box(c, x + w - 90, y + 10, 70, h - 20, 8, "#bcc8d2", "#7c8a96", 2);    // 싱크대
      break;
    case "fridge":
      box(c, x, y, w, h, 8, "#dfe9ef", "#7f8f99");
      c.strokeStyle = "#7f8f99"; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 4, y + h * 0.38); c.lineTo(x + w - 4, y + h * 0.38); c.stroke();
      c.fillStyle = "#9aa7b0"; c.fillRect(x + w - 14, y + 12, 5, 24); c.fillRect(x + w - 14, y + h * 0.45, 5, 30);
      break;
    case "tv":
      box(c, x, y, w, h, 6, "#5a3d26", "#2d1d10");
      box(c, x + 14, y + 6, w - 28, h - 12, 4, "#1c1f26", "#000", 2);
      c.fillStyle = "rgba(120,180,255,0.25)"; c.fillRect(x + 20, y + 10, (w - 40) * 0.4, h - 20);
      break;

    // --- 2R 뒷마당 ---
    case "tree":
      c.fillStyle = "#5b3a20"; c.beginPath(); c.arc(x + w / 2, y + h / 2, w * 0.18, 0, 7); c.fill();
      for (let i = 0; i < 6; i++) {
        const a = i * 1.05;
        c.fillStyle = i % 2 ? "#2f5d34" : "#27502c";
        c.beginPath(); c.arc(x + w / 2 + Math.cos(a) * w * 0.2, y + h / 2 + Math.sin(a) * h * 0.2, w * 0.32, 0, 7); c.fill();
      }
      c.fillStyle = "#3c7342"; c.beginPath(); c.arc(x + w * 0.42, y + h * 0.4, w * 0.25, 0, 7); c.fill();
      break;
    case "rock":
      c.fillStyle = "#6f7378"; c.strokeStyle = "#3e4146"; c.lineWidth = 3;
      c.beginPath();
      c.moveTo(x + w * 0.15, y + h * 0.8); c.lineTo(x + w * 0.05, y + h * 0.4); c.lineTo(x + w * 0.35, y + h * 0.08);
      c.lineTo(x + w * 0.75, y + h * 0.12); c.lineTo(x + w * 0.97, y + h * 0.5); c.lineTo(x + w * 0.8, y + h * 0.92); c.closePath();
      c.fill(); c.stroke();
      c.fillStyle = "rgba(255,255,255,0.15)"; c.beginPath(); c.ellipse(x + w * 0.4, y + h * 0.3, w * 0.18, h * 0.08, -0.4, 0, 7); c.fill();
      break;
    case "fence":
      for (let px = x; px < x + w - 4; px += 22) box(c, px, y, 16, h, 4, "#c9a26a", "#6b4f28", 2);
      c.fillStyle = "#a8834e"; c.fillRect(x, y + h * 0.3, w, 6); c.fillRect(x, y + h * 0.65, w, 6);
      break;
    case "fenceV":
      for (let py = y; py < y + h - 4; py += 22) box(c, x, py, w, 16, 4, "#c9a26a", "#6b4f28", 2);
      c.fillStyle = "#a8834e"; c.fillRect(x + w * 0.3, y, 6, h); c.fillRect(x + w * 0.65, y, 6, h);
      break;
    case "doghouse":
      box(c, x, y, w, h, 6, "#c24b3b", "#6b2219");
      c.fillStyle = "#8a2f24"; c.beginPath(); c.moveTo(x - 6, y + h * 0.45); c.lineTo(x + w / 2, y - 8); c.lineTo(x + w + 6, y + h * 0.45); c.closePath(); c.fill();
      c.fillStyle = "#2a1410"; c.beginPath(); c.arc(x + w / 2, y + h * 0.78, w * 0.2, Math.PI, 0); c.fill();
      break;
    case "car":
      box(c, x, y, w, h, 22, "#3f6fb3", "#1d3559");
      box(c, x + w * 0.22, y + 10, w * 0.5, h - 20, 12, "#9fc3e6", "#1d3559", 2);
      c.fillStyle = "#ffe48a"; c.fillRect(x + w - 10, y + 10, 6, 14); c.fillRect(x + w - 10, y + h - 24, 6, 14);
      break;

    // --- 3R 우주선 내부 ---
    case "crate":
      box(c, x, y, w, h, 6, "#4b5568", "#20252f");
      c.strokeStyle = "#f2c94c"; c.lineWidth = 4;
      c.beginPath(); c.moveTo(x + 8, y + 8); c.lineTo(x + w - 8, y + h - 8); c.moveTo(x + w - 8, y + 8); c.lineTo(x + 8, y + h - 8); c.stroke();
      c.strokeStyle = "#7a8496"; c.lineWidth = 2; c.strokeRect(x + 6, y + 6, w - 12, h - 12);
      break;
    case "pillar":
      c.fillStyle = "#39404e"; c.beginPath(); c.arc(x + w / 2, y + h / 2, w / 2, 0, 7); c.fill();
      c.strokeStyle = "#1c2028"; c.lineWidth = 4; c.stroke();
      c.strokeStyle = "#57f0ff"; c.lineWidth = 3; c.beginPath(); c.arc(x + w / 2, y + h / 2, w * 0.32, 0, 7); c.stroke();
      c.fillStyle = "#57f0ff"; c.beginPath(); c.arc(x + w / 2, y + h / 2, 5, 0, 7); c.fill();
      break;
    case "tube":                        // 빼앗긴 햇빛이 담긴 유리관
      c.fillStyle = "#2c3340"; c.beginPath(); c.arc(x + w / 2, y + h / 2, w / 2, 0, 7); c.fill();
      { const g = c.createRadialGradient(x + w / 2, y + h / 2, 2, x + w / 2, y + h / 2, w * 0.42);
        g.addColorStop(0, "#fff6b0"); g.addColorStop(0.5, "#ffc93c"); g.addColorStop(1, "rgba(255,170,40,0.2)");
        c.fillStyle = g; c.beginPath(); c.arc(x + w / 2, y + h / 2, w * 0.4, 0, 7); c.fill(); }
      c.strokeStyle = "rgba(200,240,255,0.7)"; c.lineWidth = 3; c.beginPath(); c.arc(x + w / 2, y + h / 2, w * 0.42, 0, 7); c.stroke();
      break;
    case "machine":
      box(c, x, y, w, h, 8, "#3a4252", "#171b23");
      for (let i = 0; i < Math.floor(w / 26); i++) {
        c.fillStyle = ["#57f0ff", "#ff5f7a", "#8cff6b"][i % 3];
        c.fillRect(x + 12 + i * 26, y + 12, 14, 8);
      }
      box(c, x + 10, y + h * 0.45, w - 20, h * 0.4, 4, "#0e1a24", "#57f0ff", 2);
      break;
    case "pipe":
      box(c, x, y, w, h, Math.min(w, h) / 2, "#5a6272", "#262b35");
      c.fillStyle = "rgba(255,255,255,0.15)";
      if (w > h) c.fillRect(x + 6, y + 4, w - 12, 4); else c.fillRect(x + 4, y + 6, 4, h - 12);
      c.fillStyle = "#262b35";
      if (w > h) for (let px = x + 40; px < x + w - 20; px += 80) c.fillRect(px, y, 8, h);
      else for (let py = y + 40; py < y + h - 20; py += 80) c.fillRect(x, py, w, 8);
      break;

    // --- 4R 조종실 ---
    case "console":
      box(c, x, y, w, h, 10, "#2a2440", "#120e20");
      box(c, x + 8, y + 8, w - 16, h - 16, 6, "#160f2a", "#a46bff", 2);
      for (let i = 0; i < 6; i++) {
        c.fillStyle = ["#a46bff", "#57f0ff", "#ff5fd2"][i % 3];
        c.beginPath(); c.arc(x + 20 + i * (w - 40) / 5, y + h - 20, 4, 0, 7); c.fill();
      }
      c.strokeStyle = "#57f0ff"; c.lineWidth = 2; c.beginPath();
      for (let i = 0; i <= 10; i++) { const px = x + 16 + i * (w - 32) / 10, py = y + 22 + Math.sin(i * 1.3) * 6; i ? c.lineTo(px, py) : c.moveTo(px, py); }
      c.stroke();
      break;
    case "chair":                       // 선노의 함장 의자
      c.fillStyle = "#3d2a66"; c.beginPath(); c.arc(x + w / 2, y + h / 2, w / 2, 0, 7); c.fill();
      c.strokeStyle = "#e0b84a"; c.lineWidth = 4; c.stroke();
      box(c, x + w * 0.2, y + h * 0.1, w * 0.6, h * 0.4, 12, "#5a3d96", "#e0b84a", 2);
      break;
    case "holo":
      c.fillStyle = "#1b1630"; c.beginPath(); c.arc(x + w / 2, y + h / 2, w / 2, 0, 7); c.fill();
      c.strokeStyle = "#57f0ff"; c.lineWidth = 3; c.stroke();
      c.strokeStyle = "rgba(87,240,255,0.5)"; c.lineWidth = 1.5;
      c.beginPath(); c.arc(x + w / 2, y + h / 2, w * 0.3, 0, 7); c.stroke();
      c.beginPath(); c.ellipse(x + w / 2, y + h / 2, w * 0.38, w * 0.12, 0.5, 0, 7); c.stroke();
      c.fillStyle = "#ffd23f"; c.beginPath(); c.arc(x + w / 2, y + h / 2, 7, 0, 7); c.fill();   // 홀로그램 속 지구의 태양
      break;
  }
}

// ---------- 바닥 그리기 ----------
function drawGround(n) {
  const c = mctx, W = WORLD_W, H = WORLD_H;
  srand(100 + n);
  if (n === 0) {                                   // 나무 마루
    c.fillStyle = "#b98a58"; c.fillRect(0, 0, W, H);
    const bh = 40;
    for (let y = 0; y < H; y += bh) {
      let off = (y / bh % 2) * 90;
      for (let x = -off; x < W; x += 180) {
        const v = Math.floor(rnd() * 22) - 11;
        c.fillStyle = `rgb(${185 + v},${138 + v},${88 + v})`;
        c.fillRect(x, y, 178, bh - 2);
        c.fillStyle = "rgba(90,55,25,0.18)";
        c.fillRect(x + 20 + rnd() * 120, y + 10 + rnd() * 18, 30, 2);
      }
    }
    // 러그 (지나갈 수 있음)
    box(c, 900, 640, 600, 420, 30, "#5b7fb8", "#3a5a8c", 6);
    box(c, 930, 670, 540, 360, 22, "rgba(255,255,255,0.08)", "#d8c37a", 3);
    box(c, 260, 1240, 360, 260, 120, "#c76f8e", "#8f4560", 5);
    // 벽 (맵 테두리)
    c.fillStyle = "#e8d9bf"; c.fillRect(0, 0, W, 50);
    c.fillStyle = "#cdb48c"; c.fillRect(0, 44, W, 8);
    for (let x = 300; x < W; x += 600) {          // 창문 (햇빛이 사라져 어두움)
      box(c, x, 6, 160, 34, 4, "#3a4a6a", "#8a6a44", 4);
      c.strokeStyle = "#8a6a44"; c.lineWidth = 3; c.beginPath(); c.moveTo(x + 80, 6); c.lineTo(x + 80, 40); c.stroke();
    }
  } else if (n === 1) {                            // 밤의 잔디밭
    c.fillStyle = "#2f4a2c"; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 2600; i++) {
      c.fillStyle = rnd() < 0.5 ? "rgba(70,110,60,0.5)" : "rgba(25,45,25,0.5)";
      const x = rnd() * W, y = rnd() * H;
      c.fillRect(x, y, 2, 6 + rnd() * 6);
    }
    // 흙길
    c.strokeStyle = "#5a4630"; c.lineWidth = 90; c.lineCap = "round";
    c.beginPath(); c.moveTo(-50, 1500); c.bezierCurveTo(600, 1300, 900, 1100, 1200, 900); c.bezierCurveTo(1500, 700, 1900, 600, 2450, 450); c.stroke();
    c.strokeStyle = "rgba(255,255,255,0.05)"; c.lineWidth = 60; c.stroke();
    c.lineCap = "butt";
  } else if (n === 2) {                            // 금속 바닥 패널
    c.fillStyle = "#262c38"; c.fillRect(0, 0, W, H);
    const P = 120;
    for (let y = 0; y < H; y += P) for (let x = 0; x < W; x += P) {
      const v = Math.floor(rnd() * 10);
      c.fillStyle = `rgb(${44 + v},${50 + v},${62 + v})`;
      c.fillRect(x + 3, y + 3, P - 6, P - 6);
      c.fillStyle = "#1a1e27";
      for (const [dx, dy] of [[10, 10], [P - 14, 10], [10, P - 14], [P - 14, P - 14]]) { c.beginPath(); c.arc(x + dx + 2, y + dy + 2, 3, 0, 7); c.fill(); }
    }
    // 빛나는 바닥 라인
    c.strokeStyle = "rgba(87,240,255,0.55)"; c.lineWidth = 4;
    c.beginPath(); c.moveTo(0, 900); c.lineTo(W, 900); c.moveTo(1200, 0); c.lineTo(1200, H); c.stroke();
    c.strokeStyle = "rgba(87,240,255,0.15)"; c.lineWidth = 16; c.stroke();
    // 경고 줄무늬
    for (const [hx, hy] of [[80, 80], [2080, 1560]]) {
      for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? "#f2c94c" : "#1a1e27"; c.fillRect(hx + i * 20, hy, 20, 30); }
    }
  } else {                                         // 조종실: 어두운 보라 바닥 + 큰 창문
    c.fillStyle = "#17122a"; c.fillRect(0, 0, W, H);
    c.strokeStyle = "rgba(164,107,255,0.12)"; c.lineWidth = 2;
    for (let r = 120; r < 1600; r += 120) { c.beginPath(); c.arc(1200, 1000, r, 0, 7); c.stroke(); }
    for (let a = 0; a < 16; a++) { c.beginPath(); c.moveTo(1200, 1000); c.lineTo(1200 + Math.cos(a / 16 * 6.283) * 1700, 1000 + Math.sin(a / 16 * 6.283) * 1700); c.stroke(); }
    // 위쪽 큰 창문: 우주와 별, 멀리 보이는 지구
    c.fillStyle = "#04030c"; c.fillRect(0, 0, W, 160);
    for (let i = 0; i < 260; i++) { c.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.7})`; c.fillRect(rnd() * W, rnd() * 150, 2, 2); }
    { const g = c.createRadialGradient(1700, 110, 10, 1700, 110, 90); g.addColorStop(0, "#6fb6ff"); g.addColorStop(1, "#1d4a8a");
      c.fillStyle = g; c.beginPath(); c.arc(1700, 120, 80, Math.PI, 0); c.fill(); }
    c.fillStyle = "#3a2f5c";
    for (let x = 0; x <= W; x += 300) c.fillRect(x - 8, 0, 16, 160);
    c.fillRect(0, 150, W, 14);
  }
}

// 가운데(1200, 900) 주변은 플레이어 시작 자리라 비워 둠
function layout(n) {
  const L = [];
  const add = (kind, x, y, w, h) => L.push({ kind, x, y, w, h });
  if (n === 0) {
    add("sofa", 980, 520, 300, 100);
    add("tv", 1030, 1150, 240, 60);
    add("table", 360, 420, 260, 150);
    add("shelf", 120, 70, 360, 40);  add("shelf", 1700, 70, 420, 40);
    add("bed", 1850, 1250, 260, 340);
    add("kitchen", 300, 1620, 420, 90);
    add("fridge", 760, 1610, 90, 120);
    add("cattower", 1600, 820, 120, 120);
    add("plant", 700, 300, 80, 80); add("plant", 2150, 500, 80, 80); add("plant", 1500, 1500, 80, 80);
    add("plant", 140, 900, 80, 80);
    add("table", 1950, 760, 180, 120);
    add("shelf", 60, 1100, 40, 300);
  } else if (n === 1) {
    const trees = [[300, 300], [700, 1600], [1900, 1300], [2150, 300], [450, 1050], [1650, 1600], [2100, 950], [1000, 250]];
    for (const [x, y] of trees) add("tree", x, y, 150, 150);
    add("rock", 1500, 1150, 110, 90); add("rock", 850, 700, 90, 80); add("rock", 1950, 650, 120, 100); add("rock", 250, 1500, 100, 90);
    add("fence", 80, 820, 300, 40); add("fence", 1400, 1700, 400, 40); add("fenceV", 2280, 1100, 40, 300);
    add("doghouse", 1500, 350, 110, 100);
    add("car", 600, 1300, 220, 110);
  } else if (n === 2) {
    const crates = [[400, 400], [470, 400], [400, 470], [1800, 380], [1870, 380], [900, 1350], [1960, 1200], [2030, 1200], [300, 1300]];
    for (const [x, y] of crates) add("crate", x, y, 70, 70);
    for (const [x, y] of [[800, 600], [1520, 600], [800, 1140], [1520, 1140]]) add("pillar", x, y, 80, 80);
    for (const [x, y] of [[1100, 240], [1240, 240], [1100, 1500], [1240, 1500]]) add("tube", x, y, 90, 90);
    add("machine", 150, 800, 120, 220); add("machine", 2120, 760, 140, 240);
    add("pipe", 600, 100, 400, 40); add("pipe", 1400, 1680, 500, 40); add("pipe", 2250, 300, 40, 300);
  } else {
    add("console", 200, 200, 420, 110); add("console", 1780, 200, 420, 110);
    add("console", 900, 210, 600, 90);
    add("chair", 1150, 1480, 100, 100);
    add("holo", 450, 1100, 160, 160); add("holo", 1790, 1100, 160, 160);
    add("console", 80, 600, 100, 360); add("console", 2220, 600, 100, 360);
    add("pillar", 700, 650, 80, 80); add("pillar", 1620, 650, 80, 80);
  }
  return L;
}

// 라운드가 시작될 때 맵을 만들고 큰 캔버스에 미리 그림
function buildMap(n) {
  obstacles = layout(n);
  drawGround(n);
  for (const o of obstacles) drawObstacle(mctx, o);
  mapOverlay = n === 1 ? drawUfoOverhead : null;
}

// 2라운드: 공중에 떠 있는 우주선과 아래로 쏘는 트랙터 빔 (캐릭터보다 위에 반투명으로)
const UFO_POS = { x: 1200, y: 170 };
function drawUfoOverhead(t) {
  const x = UFO_POS.x, y = UFO_POS.y;
  // 빔이 닿는 땅의 빛 웅덩이
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.05);
  const g = ctx.createRadialGradient(x, y + 420, 20, x, y + 420, 210);
  g.addColorStop(0, `rgba(190,255,150,${0.35 + pulse * 0.1})`); g.addColorStop(1, "rgba(190,255,150,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y + 420, 220, 120, 0, 0, 7); ctx.fill();
  // 빔 기둥
  const bg = ctx.createLinearGradient(0, y + 30, 0, y + 430);
  bg.addColorStop(0, "rgba(200,255,170,0.45)"); bg.addColorStop(1, "rgba(200,255,170,0.05)");
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(x - 60, y + 30); ctx.lineTo(x + 60, y + 30); ctx.lineTo(x + 190, y + 430); ctx.lineTo(x - 190, y + 430); ctx.closePath(); ctx.fill();
  // 빔 속을 올라가는 빛 알갱이
  ctx.fillStyle = "rgba(255,255,220,0.8)";
  for (let i = 0; i < 14; i++) {
    const k = ((t * 0.006 + i / 14) % 1), spread = 60 + (1 - k) * 120;
    ctx.beginPath(); ctx.arc(x + Math.sin(i * 7.3) * spread, y + 430 - k * 400, 3, 0, 7); ctx.fill();
  }
  // 우주선 본체
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = "#3b3150"; ctx.beginPath(); ctx.ellipse(x, y, 260, 70, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "#1c1628"; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = "#5c4c7c"; ctx.beginPath(); ctx.ellipse(x, y - 8, 200, 44, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(160,230,255,0.75)"; ctx.beginPath(); ctx.ellipse(x, y - 30, 90, 46, 0, Math.PI, 0); ctx.fill();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + t * 0.02;
    ctx.fillStyle = (i + Math.floor(t / 10)) % 2 ? "#ffe066" : "#7dff9a";
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * 225, y + Math.sin(a) * 52, 7, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- 충돌 ----------
// 원(캐릭터)이 사각형(장애물)과 겹치면 바깥으로 밀어냄
function pushOutOfObstacles(ent, r) {
  for (const o of obstacles) {
    const cx = Math.max(o.x, Math.min(o.x + o.w, ent.x));
    const cy = Math.max(o.y, Math.min(o.y + o.h, ent.y));
    let dx = ent.x - cx, dy = ent.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) continue;
    if (d2 > 0.0001) {                      // 바깥에서 닿음 → 닿은 방향으로 밀기
      const d = Math.sqrt(d2);
      ent.x += dx / d * (r - d); ent.y += dy / d * (r - d);
    } else {                                // 중심이 안에 들어옴 → 가장 가까운 변으로 꺼냄
      const l = ent.x - o.x, rt = o.x + o.w - ent.x, t = ent.y - o.y, b = o.y + o.h - ent.y;
      const m = Math.min(l, rt, t, b);
      if (m === l) ent.x = o.x - r; else if (m === rt) ent.x = o.x + o.w + r;
      else if (m === t) ent.y = o.y - r; else ent.y = o.y + o.h + r;
    }
  }
}
function insideObstacle(x, y, r) {
  return obstacles.some(o => x > o.x - r && x < o.x + o.w + r && y > o.y - r && y < o.y + o.h + r);
}

// ===== 벡터 그림 (캔버스 경로로 그리기) =====
// 픽셀을 찍는 대신 arc / ellipse / 곡선(quadraticCurveTo, bezierCurveTo)으로 그려서
// 아무리 키워도 매끈하고, 팔다리·꼬리·망토를 각도로 부드럽게 움직일 수 있음
const OUTLINE = "#4a2a12";

function ell(x, y, rx, ry, fill, stroke, lw) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

// ----- 고로캣 -----
// (x, y): 캐릭터 중심, facing: 1 오른쪽 / -1 왼쪽, phase: 걷기 진행값, moving: 걷는 중인지, s: 크기 배율
function drawGorocat(x, y, facing, phase, moving, s) {
  const swing = moving ? Math.sin(phase) : 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing * s, s);
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // 꼬리 (등 뒤, 줄무늬 + 하얀 끝, 살랑살랑)
  ctx.save();
  ctx.translate(-19, 10);
  ctx.rotate(-0.35 + Math.sin(time * 0.12) * 0.25);
  const tail = () => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-15, -4, -12, -22); };
  tail(); ctx.lineWidth = 9; ctx.strokeStyle = OUTLINE; ctx.stroke();
  tail(); ctx.lineWidth = 6; ctx.strokeStyle = SKIN.b1; ctx.stroke();
  ctx.setLineDash([3, 6]);
  tail(); ctx.strokeStyle = SKIN.tail; ctx.stroke();
  ctx.setLineDash([]);
  ell(-12, -22, 4, 4, "#fffaf2", OUTLINE, 1.5);
  ctx.restore();

  // 망토 (스카프 끝이 등 뒤로 휘날림)
  const cw = Math.sin(time * 0.1) * 3 + (moving ? 2 : 0);
  ctx.beginPath();
  ctx.moveTo(-8, 8);
  ctx.bezierCurveTo(-24, 10, -30 - cw, 22, -36 - cw, 30);
  ctx.lineTo(-22 - cw, 29);
  ctx.bezierCurveTo(-18, 24, -12, 20, -2, 16);
  ctx.closePath();
  ctx.fillStyle = SKIN.cape; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();

  // 뒷손
  ell(-24, 8 - swing * 2, 4.5, 4.5, "#fffaf2", OUTLINE, 2);

  // 다리 (주황 다리 + 하얀 발, 번갈아 앞으로)
  [[-9, 1], [9, -1]].forEach(([lx, dir]) => {
    const off = swing * dir;
    const fx = lx + off * 3, fy = 21 - Math.max(0, off) * 3;
    ell(fx, fy - 3, 5, 5, SKIN.b1, OUTLINE, 2);
    ell(fx, fy + 2, 6.5, 4.5, "#fffaf2", OUTLINE, 2);
  });

  // 귀 (뾰족한 고양이 귀, 안쪽 분홍) — 몸통보다 먼저 그려서 귀 밑동은 몸통에 가려짐
  [-1, 1].forEach(side => {
    ctx.save();
    ctx.scale(side, 1);
    ctx.beginPath();
    ctx.moveTo(-4, -19);
    ctx.quadraticCurveTo(-9, -29, -15, -37);
    ctx.quadraticCurveTo(-22, -26, -21, -12);
    ctx.closePath();
    ctx.fillStyle = SKIN.b1; ctx.fill();
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-8, -19);
    ctx.quadraticCurveTo(-11, -26, -14.5, -32);
    ctx.quadraticCurveTo(-18.5, -24, -18, -15);
    ctx.closePath();
    ctx.fillStyle = "#ffb3c1"; ctx.fill();
    ctx.restore();
  });

  // 몸통: 살짝 울퉁불퉁한 동그란 고로케 + 노릇한 그라데이션
  ctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const a = i / 48 * Math.PI * 2;
    const r = 23 * (1 + 0.035 * Math.sin(a * 7));
    const px = Math.cos(a) * r, py = Math.sin(a) * r * 0.95;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(-8, -10, 3, 0, 0, 26);
  g.addColorStop(0, SKIN.b0);
  g.addColorStop(0.6, SKIN.b1);
  g.addColorStop(1, SKIN.b2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.5; ctx.stroke();
  // 바삭한 빵가루 알갱이
  ctx.fillStyle = "rgba(150, 85, 25, 0.5)";
  [[-15,-8],[-12,-15],[-4,-18],[6,-17],[14,-12],[17,-3],[-18,2],[15,10],[-14,12],[-6,-12],[10,-9]]
    .forEach(([cx, cy]) => ell(cx, cy, 1.2, 0.8, "rgba(150, 85, 25, 0.35)"));
  [[-10,-13],[0,-16],[12,-14],[-16,-3]].forEach(([cx, cy]) => ell(cx, cy, 1.6, 1.1, "rgba(255, 238, 180, 0.7)"));

  // 얼굴
  ell(2, 6, 8.5, 5.5, "#ffe6bd");                                   // 입 주변 크림색
  [-7, 11].forEach(ex => {                                           // 눈 + 반짝임
    ell(ex, -3, 3.2, 4.2, "#2a1a14");
    ell(ex - 1, -4.6, 1.3, 1.3, "#ffffff");
  });
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.2;                    // 결의에 찬 눈썹
  ctx.beginPath(); ctx.moveTo(-11, -10.5); ctx.lineTo(-4, -8.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, -10.5); ctx.lineTo(8, -8.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(4, 2); ctx.lineTo(2, 4.5); ctx.closePath();   // 코
  ctx.fillStyle = "#ff7f98"; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5;                    // ω 입
  ctx.beginPath(); ctx.moveTo(-2, 5.5); ctx.quadraticCurveTo(0, 8, 2, 5.5); ctx.quadraticCurveTo(4, 8, 6, 5.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 7.5); ctx.quadraticCurveTo(2, 13, 4, 7.5); ctx.closePath();  // 벌린 입
  ctx.fillStyle = "#ff8a9c"; ctx.fill(); ctx.stroke();
  ell(-12, 4, 3.6, 2, "rgba(255, 130, 120, 0.55)");                  // 볼터치
  ell(16, 4, 3.6, 2, "rgba(255, 130, 120, 0.55)");
  ctx.lineWidth = 1.2;                                               // 수염
  [[-17, 1, -27, -1], [-17, 5, -27, 6], [21, 1, 30, -1], [21, 5, 30, 6]].forEach(([a, b, c, d]) => {
    ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
  });

  // 빨간 스카프 + 금색 방울
  ctx.beginPath();
  ctx.moveTo(-21, 9); ctx.quadraticCurveTo(0, 18, 21, 9);
  ctx.lineTo(20, 14); ctx.quadraticCurveTo(0, 23, -20, 14);
  ctx.closePath();
  ctx.fillStyle = SKIN.scarf; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
  ell(1, 20, 4.2, 4.2, SKIN.bell, OUTLINE, 1.5);
  ctx.beginPath(); ctx.moveTo(1, 20.5); ctx.lineTo(1, 24); ctx.stroke();
  ell(-0.5, 18.5, 1.2, 1, "#fff1b8");

  // 무기 + 앞손: 캐릭터마다 다른 무기 (검 / 총 / 방패)
  const weapon = SKIN.weapon || "sword";
  // 휘두르기·밀치기 모션은 게임 속 플레이어(크기 1)일 때만
  const inPlay = gameState === "play" && s >= 0.9;
  const sw = inPlay && swingT > 0 ? 1 - swingT / SWING_LEN : -1;     // 0→1 휘두르는 진행도
  const bash = inPlay && bashT > 0 ? Math.sin((1 - bashT / BASH_LEN) * Math.PI) : 0;
  if (weapon === "sword" && !(inPlay && uq && uq.spin > 0)) {   // 회전 검무 중에는 큰 검을 따로 그림
    // 휘두를 때: 머리 위에서 앞 아래로 크게 내려침
    ctx.save();
    ctx.translate(20, 10 - swing * 2);
    ctx.rotate(sw >= 0 ? -1.3 + sw * 3.0 : 0.45);
    const bg = ctx.createLinearGradient(-3, 0, 3, 0);
    bg.addColorStop(0, "#f4f7fb"); bg.addColorStop(1, "#aab3c0");
    ctx.beginPath();
    ctx.moveTo(-3.5, -6); ctx.lineTo(-3.5, -34); ctx.lineTo(0, -41); ctx.lineTo(3.5, -34); ctx.lineTo(3.5, -6);
    ctx.closePath();
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5; ctx.stroke();
    ell(0, -22, 1.6, 1.4, "rgba(255,255,255,0.9)");                   // 칼날의 냥발 문양
    [[-1.8, -25], [0, -26], [1.8, -25]].forEach(([cx, cy]) => ell(cx, cy, 0.7, 0.7, "rgba(255,255,255,0.9)"));
    ctx.fillStyle = "#c9902f";                                        // 가드
    ctx.beginPath(); ctx.roundRect(-8, -8, 16, 4, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#6b4425";                                        // 손잡이
    ctx.fillRect(-2, -4, 4, 9);
    ctx.restore();
  } else if (weapon === "gun") {
    // 총: 앞으로 겨눈 냥발 블래스터 (쏠 때 총구가 번쩍)
    ctx.save();
    ctx.translate(20, 11 - swing * 2);
    ctx.fillStyle = "#4a4f5c";                                        // 손잡이
    ctx.beginPath(); ctx.roundRect(-3, -1, 6, 11, 2); ctx.fill();
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5; ctx.stroke();
    const gg = ctx.createLinearGradient(0, -9, 0, 1);
    gg.addColorStop(0, "#9aa4b5"); gg.addColorStop(1, "#5d6577");
    ctx.beginPath(); ctx.roundRect(-6, -9, 22, 10, 4); ctx.fillStyle = gg; ctx.fill(); ctx.stroke();   // 몸통
    ctx.beginPath(); ctx.roundRect(15, -7, 9, 6, 2); ctx.fillStyle = "#3b404c"; ctx.fill(); ctx.stroke(); // 총열
    ctx.fillStyle = SKIN.scarf; ctx.beginPath(); ctx.roundRect(-3, -7, 10, 3, 1.5); ctx.fill();          // 색 띠
    ell(10, -4.5, 1.6, 1.6, "#ffe48a");                                                                  // 에너지 램프
    if (typeof muzzleFlash !== "undefined" && muzzleFlash > 0 && gameState === "play" && s >= 0.9) {
      const k = muzzleFlash / 5;

      ctx.beginPath(); ctx.moveTo(24, -4); ctx.lineTo(34, -9); ctx.lineTo(31, -4); ctx.lineTo(36, 1); ctx.closePath(); ctx.fill();

    ctx.save();
    ctx.translate(21 + bash * 12, 12 - swing * 1.5);   // 밀칠 때 앞으로 쭉
    ctx.beginPath();
    ctx.moveTo(0, -17); ctx.quadraticCurveTo(13, -16, 13, -8); ctx.quadraticCurveTo(13, 8, 0, 17);
    ctx.quadraticCurveTo(-13, 8, -13, -8); ctx.quadraticCurveTo(-13, -16, 0, -17); ctx.closePath();
    const sg = ctx.createLinearGradient(-13, -17, 13, 17);
    sg.addColorStop(0, SKIN.scarf); sg.addColorStop(1, SKIN.cape);
    ctx.fillStyle = sg; ctx.fill();
    ctx.strokeStyle = "#e9c25a"; ctx.lineWidth = 3; ctx.stroke();       // 금색 테두리
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.2; ctx.stroke();
    ell(0, 2, 4.2, 3.6, "#fff6e0");                                    // 냥발 문양
    [[-4.2, -3.5], [-1.4, -5.6], [1.4, -5.6], [4.2, -3.5]].forEach(([cx, cy]) => ell(cx, cy, 1.5, 1.6, "#fff6e0"));
    ell(-6, -10, 2.2, 1.2, "rgba(255,255,255,0.55)");                  // 반사광
    ctx.restore();
  }
  ell(20, 12 - swing * 2, 5, 5, "#fffaf2", OUTLINE, 2);

  ctx.restore();
}

// ----- 최종 보스 선노 -----
// ===== 타격 이펙트 =====
// 적이 맞으면 몸이 투명한 흰색으로 두 번 깜빡임 (약 0.3초)
// 방법: 적을 작은 캔버스에 한 번 더 그린 뒤 모양만 남기고 흰색으로 칠해서 위에 겹침
const HIT_FLASH_LEN = 18;                 // 흰색(6) → 원래(6) → 흰색(6)
let FLASH_PASS = false;                    // 흰색 덧칠용으로 그리는 중이면 그림자·체력바 생략
const flashCanvas = document.createElement("canvas");
flashCanvas.width = flashCanvas.height = 360;
const fctx = flashCanvas.getContext("2d");

function isFlashing(e) {
  if (e.hitAt === undefined) return false;
  const k = time - e.hitAt;
  return (k >= 0 && k < 6) || (k >= 12 && k < HIT_FLASH_LEN);   // 두 번 깜빡
}

function drawHitFlash(e, drawFn) {
  const S = flashCanvas.width, half = S / 2;
  const main = ctx;
  fctx.save();
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = "source-over";
  fctx.clearRect(0, 0, S, S);
  fctx.translate(half - e.x, half - e.y);   // 적이 작은 캔버스 가운데 오도록
  ctx = fctx; FLASH_PASS = true;
  try { drawFn(e); } finally { ctx = main; FLASH_PASS = false; }
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = "source-in"; // 그려진 모양 안쪽만 흰색으로
  fctx.fillStyle = "#ffffff";
  fctx.fillRect(0, 0, S, S);
  fctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.75;                    // 투명한 흰색
  ctx.drawImage(flashCanvas, e.x - half, e.y - half);
  ctx.restore();
}

function drawSunno(e) {
  const bob = Math.sin(time * 0.05) * 4;
  const flap = Math.sin(time * 0.08) * 4;
  const charging = e.shootTimer > e.shootEvery - 25;     // 공격 직전
  if (!FLASH_PASS) ell(e.x, e.y + 60, 42, 8, "rgba(0, 0, 0, 0.35)");       // 그림자
  ctx.save();
  ctx.translate(e.x, e.y + bob);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  const OUT = "#1a1026";
  if (charging) { ctx.shadowColor = "#b57bff"; ctx.shadowBlur = 25; }

  // 망토 (넓게 펼쳐진 보라 망토 + 금색 테두리)
  const cg = ctx.createLinearGradient(0, 10, 0, 56);
  cg.addColorStop(0, "#a47be8"); cg.addColorStop(1, "#4e2f8a");
  ctx.beginPath();
  ctx.moveTo(-16, 12);
  ctx.bezierCurveTo(-40, 22, -50 - flap, 44, -47 - flap, 54);
  ctx.quadraticCurveTo(0, 62, 47 + flap, 54);
  ctx.bezierCurveTo(50 + flap, 44, 40, 22, 16, 12);
  ctx.closePath();
  ctx.fillStyle = cg; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-45 - flap, 52); ctx.quadraticCurveTo(0, 59, 45 + flap, 52);
  ctx.strokeStyle = "#e0b04a"; ctx.lineWidth = 2.5; ctx.stroke();

  // 우주복 몸통 + 금색 테두리
  ctx.fillStyle = "#3a2d55";
  ctx.beginPath(); ctx.roundRect(-15, 12, 30, 40, 6); ctx.fill();
  ctx.strokeStyle = "#e0b04a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-13, 16); ctx.lineTo(-13, 50); ctx.moveTo(13, 16); ctx.lineTo(13, 50); ctx.stroke();
  ell(-8, 55, 6, 3.5, "#241a35", OUT, 1.5);                // 발
  ell(8, 55, 6, 3.5, "#241a35", OUT, 1.5);

  // 팔: 왼팔은 빼앗은 태양을 들어 올림, 오른손은 옆에
  ctx.strokeStyle = "#3a2d55"; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-14, 20); ctx.quadraticCurveTo(-30, 16, -36, 2); ctx.stroke();
  ell(-37, -1, 6.5, 6.5, "#241a35", OUT, 2);
  ell(22, 34, 5.5, 5.5, "#241a35", OUT, 2);

  // 옷깃 + 브로치
  ell(0, 13, 25, 6.5, "#9f74e6", "#e0b04a", 2.5);
  ell(0, 25, 6.5, 6.5, "#e0b04a", OUT, 1.5);
  ell(0, 25, 3.2, 3.2, "#2a1d40");
  ell(-1, 24, 1, 1, "#8d74c0");

  // 머리 (까만 그림자 얼굴)
  const hg = ctx.createRadialGradient(-6, -18, 2, 0, -10, 20);
  hg.addColorStop(0, "#3d3157"); hg.addColorStop(1, "#1b1329");
  ell(0, -10, 19, 18, null);
  ctx.fillStyle = hg; ctx.fill();

  // 노랗게 빛나는 눈 (두 눈 모두 오른쪽 위로 올라가는 모양)
  ctx.save();
  ctx.shadowColor = "#ffd84a"; ctx.shadowBlur = 12;
  [0, 15].forEach(dx => {
    ctx.beginPath();
    ctx.moveTo(-13 + dx, -6);
    ctx.quadraticCurveTo(-8 + dx, -10, -3 + dx, -14);
    ctx.quadraticCurveTo(-1 + dx, -9, -4 + dx, -5);
    ctx.quadraticCurveTo(-8 + dx, -3.5, -13 + dx, -6);
    ctx.closePath();
    ctx.fillStyle = "#ffe680"; ctx.fill();
  });
  ctx.restore();
  ell(-6, -8, 1.6, 1.2, "#fffbe0"); ell(9, -8, 1.6, 1.2, "#fffbe0");

  // 안테나 2개 + 은색 공
  ctx.strokeStyle = "#8f86a8"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-11, -37); ctx.lineTo(-17, -52); ctx.moveTo(11, -37); ctx.lineTo(17, -52); ctx.stroke();
  ell(-17, -53, 4, 4, "#e6e2f0", OUT, 1.5); ell(-18, -54.5, 1.2, 1.2, "#ffffff");
  ell(17, -53, 4, 4, "#e6e2f0", OUT, 1.5); ell(16, -54.5, 1.2, 1.2, "#ffffff");

  // 투명 유리 헬멧 + 반사광
  ell(0, -12, 28, 28, "rgba(214, 196, 255, 0.16)", "#c7b3f5", 2.5);
  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, -12, 22, 3.55, 4.3); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -12, 22, 4.45, 4.6); ctx.stroke();

  // 빼앗은 태양 (이글거리는 빛)
  const sx = -37, sy = -10;
  const pulse = 1 + Math.sin(time * 0.15) * 0.12;
  const glow = ctx.createRadialGradient(sx, sy, 2, sx, sy, 26 * pulse);
  glow.addColorStop(0, "rgba(255, 250, 200, 1)");
  glow.addColorStop(0.35, "rgba(255, 200, 70, 0.9)");
  glow.addColorStop(1, "rgba(255, 160, 40, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx, sy, 26 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255, 220, 110, 0.8)"; ctx.lineWidth = 2;
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4 + time * 0.03;
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(a) * 12, sy + Math.sin(a) * 12);
    ctx.lineTo(sx + Math.cos(a) * 19 * pulse, sy + Math.sin(a) * 19 * pulse);
    ctx.stroke();
  }
  ctx.restore();
}

// ===== 졸병 외계인 3종 (정훈 SVG + 적군 캐릭터 디자인 시트 기반) =====
// 슬라임형 졸병: 작지만 수가 많고, 쓰러지면 작은 슬라임 2마리로 분열
// 빛 흡수형: 바닥의 햇빛 조각을 빨아들여 강해지고, 빛을 모았다가 빛 구슬 발사
// 레이저 UFO: 거리를 두고 날아다니다가 조준선을 그린 뒤 레이저 발사
const MINION_IMG = {};          // SVG를 한 번만 래스터로 그려 둔 캔버스 (매 프레임 빠르게 그리기 위함)
for (const name in MINION_SVG) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth || 250; cv.height = img.naturalHeight || 290;
    const vb = MINION_SVG[name].match(/viewBox="([\d.\s]+)"/)[1].split(" ").map(Number);
    cv.width = vb[2]; cv.height = vb[3];
    cv.getContext("2d").drawImage(img, 0, 0, vb[2], vb[3]);
    MINION_IMG[name] = cv;
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(MINION_SVG[name]);
}

// 종류별 능력치 배율 (라운드 기본값에 곱함)
const MINION_TYPES = {
  slime:    { hpMul: 1.0, speedMul: 1.0, size: 24, draw: 34 },
  mini:     { hpMul: 0.4, speedMul: 1.3, size: 15, draw: 22 },
  absorber: { hpMul: 1.6, speedMul: 0.8, size: 30, draw: 44 },
  ufo:      { hpMul: 1.2, speedMul: 1.1, size: 32, draw: 50 }
};
// 라운드별 등장 비율
const ROUND_MIX = [
  { slime: 1 },
  { slime: 0.6, absorber: 0.4 },
  { slime: 0.45, absorber: 0.3, ufo: 0.25 },
  { slime: 0.5, absorber: 0.25, ufo: 0.25 }
];
let newEnemies = [];            // 분열로 생긴 슬라임 (프레임 끝에 추가)

function pickMinionType() {
  let mix = ROUND_MIX[round], r = Math.random();
  for (const k in mix) { if ((r -= mix[k]) < 0) return k; }
  return "slime";
}

function makeMinion(type, x, y) {
  const R = ROUNDS[round], T = MINION_TYPES[type];
  const hp = Math.max(1, Math.round(R.hp * T.hpMul * DIFF().hp));      // 난이도 체력 배율
  return { type, x, y, size: T.size, speed: R.speed * T.speedMul, hp, maxHp: hp, dmg: Math.max(1, Math.round(R.dmg * DIFF().atk)),
           dead: false, shieldCd: 0, t: Math.floor(Math.random() * 120), state: "move", stateT: 0,
           laserAng: 0, glow: 0 };
}

// 졸병 행동 (보스는 기존 방식)
function updateMinion(e) {
  e.t++;
  let dx = player.x - e.x, dy = player.y - e.y;
  let dist = Math.hypot(dx, dy) || 1;
  let ux = dx / dist, uy = dy / dist;
  if (e.glow > 0) e.glow--;

  if (e.type === "slime" || e.type === "mini") {
    // 말랑말랑 통통 튀듯 다가옴
    let hop = 0.55 + 0.45 * Math.abs(Math.sin(e.t * 0.12));
    e.x += ux * e.speed * hop;
    e.y += uy * e.speed * hop;
  } else if (e.type === "absorber") {
    // 근처 햇빛 조각을 빨아들여 체력 회복 + 최대 체력 증가
    for (let i = expOrbs.length - 1; i >= 0; i--) {
      let o = expOrbs[i];
      if (o.boss) continue;                  // 보스 보상은 빨아들이지 못함
      if (Math.hypot(o.x - e.x, o.y - e.y) < 70) {
        expOrbs.splice(i, 1);
        e.maxHp += 1; e.hp = Math.min(e.maxHp, e.hp + 2);
        e.glow = 30;
      }
    }
    if (e.state === "move") {
      e.x += ux * e.speed; e.y += uy * e.speed;
      if (++e.stateT > 200 && dist < 420) { e.state = "charge"; e.stateT = 0; }
    } else {                                   // 빛을 모으는 중 (멈춰서 반짝임)
      if (++e.stateT >= 45) {
        enemyShots.push({ x: e.x, y: e.y, vx: ux * 4, vy: uy * 4, r: 7, dmg: Math.round(e.dmg * 0.8), light: true });
        e.state = "move"; e.stateT = 0;
      }
    }
  } else if (e.type === "ufo") {
    if (e.state === "move") {
      // 220~280 거리를 유지하며 옆으로 비행
      let want = dist > 280 ? 1 : dist < 220 ? -1 : 0;
      e.x += (ux * want + -uy * 0.6) * e.speed;
      e.y += (uy * want + ux * 0.6) * e.speed;
      if (++e.stateT > 210 && dist < 500) { e.state = "aim"; e.stateT = 0; e.laserAng = Math.atan2(dy, dx); }
    } else if (e.state === "aim") {           // 조준선 (피할 시간)
      if (++e.stateT >= 45) { e.state = "fire"; e.stateT = 0; }
    } else {                                   // 레이저 발사
      let ax = Math.cos(e.laserAng), ay = Math.sin(e.laserAng);
      let px = player.x - e.x, py = player.y - e.y;
      let along = px * ax + py * ay, side = Math.abs(px * ay - py * ax);
      if (along > 0 && along < 700 && side < 14) damagePlayer(Math.round(e.dmg * 1.2));
      if (++e.stateT >= 15) { e.state = "move"; e.stateT = 0; }
    }
  }
  // 맵(벽) 밖으로 나가지 않게
  e.x = Math.max(10, Math.min(WORLD_W - 10, e.x));
  e.y = Math.max(10, Math.min(WORLD_H - 10, e.y));
}

function drawMinion(e) {
  const T = MINION_TYPES[e.type];
  const img = MINION_IMG[e.type === "mini" ? "slime" : e.type];
  const w = T.draw, h = img ? w * img.height / img.width : w;
  let sx = 1, sy = 1, bob = 0;
  if (e.type === "slime" || e.type === "mini") {      // 말랑말랑
    let q = Math.sin(e.t * 0.24) * 0.08;
    sx = 1 + q; sy = 1 - q;
  } else if (e.type === "ufo") {
    bob = Math.sin(e.t * 0.08) * 3;
  }
  // 그림자
  if (!FLASH_PASS) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
    ctx.beginPath(); ctx.ellipse(e.x, e.y + h * 0.42, w * 0.38, w * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  }

  // 빛 흡수형: 빛을 모으는 중이거나 햇빛 조각을 먹으면 노란 고리
  if (!FLASH_PASS && e.type === "absorber" && (e.state === "charge" || e.glow > 0)) {
    ctx.strokeStyle = "rgba(255, 210, 80, 0.85)"; ctx.lineWidth = 3;
    let r = w * 0.55 + Math.sin(e.t * 0.3) * 3;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, r, r * 0.4, 0.3, e.t * 0.1, e.t * 0.1 + 4.5); ctx.stroke();
  }
  // 레이저 UFO: 조준선 → 레이저
  if (!FLASH_PASS && e.type === "ufo" && e.state !== "move") {
    let ax = Math.cos(e.laserAng), ay = Math.sin(e.laserAng);
    ctx.save();
    ctx.lineCap = "round";
    if (e.state === "aim") {
      ctx.strokeStyle = "rgba(200, 150, 255, " + (0.3 + 0.4 * (e.stateT % 10 < 5)) + ")";
      ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    } else {
      ctx.strokeStyle = "rgba(210, 160, 255, 0.85)"; ctx.lineWidth = 14;
      ctx.shadowColor = "#c78bff"; ctx.shadowBlur = 16;
    }
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + ax * 700, e.y + ay * 700); ctx.stroke();
    if (e.state === "fire") {
      ctx.strokeStyle = "#f6ecff"; ctx.lineWidth = 4; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + ax * 700, e.y + ay * 700); ctx.stroke();
    }
    ctx.restore();
  }

  if (img) {
    ctx.save();
    ctx.translate(e.x, e.y + bob);
    ctx.scale(sx, sy);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  } else {                                     // SVG를 불러오기 전 잠깐
    ctx.fillStyle = "#7b4fc4";
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size / 2, 0, Math.PI * 2); ctx.fill();
  }
  if (FLASH_PASS) return;
  // 체력바
  ctx.fillStyle = "black";
  ctx.fillRect(e.x - 12, e.y - h / 2 - 6, 24, 4);
  ctx.fillStyle = "lime";
  ctx.fillRect(e.x - 12, e.y - h / 2 - 6, 24 * Math.max(0, e.hp / e.maxHp), 4);
}

// ===== 중간 보스 3종 (정훈 SVG) =====
// 1라운드: 말랑 슬라임 대왕 / 2라운드: 솔라 태양 수호자 / 3라운드: 오르빗 UFO 사령관
const MIDBOSS_KEYS = ["slimeLord", "sunGuardian", "ufoCommander"];
const MIDBOSS_IMG = {};
for (const name in MIDBOSS_SVG) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = 512; cv.height = 512;          // SVG 크기 그대로 한 번만 그려 둠
    cv.getContext("2d").drawImage(img, 0, 0, 512, 512);
    MIDBOSS_IMG[name] = cv;
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(MIDBOSS_SVG[name]);
}

function drawMidBoss(e) {
  const key = MIDBOSS_KEYS[Math.min(round, 2)];
  const img = MIDBOSS_IMG[key];
  const w = e.size * 2.3;                      // 판정 크기보다 크게 그려서 보스답게
  const bob = Math.sin(time * 0.06) * 3;
  const charging = e.shootEvery && e.shootTimer > e.shootEvery - 25;   // 공격 직전
  // 그림자
  if (!FLASH_PASS) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
    ctx.beginPath(); ctx.ellipse(e.x, e.y + w * 0.4, w * 0.34, w * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  }
  // UFO 사령관: 공격 직전 트랙터 빔
  if (!FLASH_PASS && key === "ufoCommander" && charging) {
    ctx.fillStyle = "rgba(203, 167, 255, 0.3)";
    ctx.beginPath();
    ctx.moveTo(e.x - w * 0.12, e.y + w * 0.12); ctx.lineTo(e.x + w * 0.12, e.y + w * 0.12);
    ctx.lineTo(e.x + w * 0.22, e.y + w * 0.4); ctx.lineTo(e.x - w * 0.22, e.y + w * 0.4);
    ctx.closePath(); ctx.fill();
  }
  if (img) {
    ctx.save();
    if (charging) { ctx.shadowColor = key === "sunGuardian" ? "#ffd84a" : "#b57bff"; ctx.shadowBlur = 22; }
    // 슬라임 대왕은 말랑말랑, 나머지는 둥실둥실
    let sx = 1, sy = 1;
    if (key === "slimeLord") { const q = Math.sin(time * 0.15) * 0.05; sx = 1 + q; sy = 1 - q; }
    ctx.translate(e.x, e.y + bob);
    ctx.scale(sx, sy);
    ctx.drawImage(img, -w / 2, -w / 2, w, w);
    ctx.restore();
  } else {                                     // SVG를 불러오기 전 잠깐
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x - e.size / 2, e.y - e.size / 2, e.size, e.size);
  }
}

function oilRadius()   { return 70 + (skillLv.oil - 1) * 18; }         // 70 → 142
function oilDamage()   { return 1 + (skillLv.oil - 1) * 0.75; }         // 1 → 4
function oilLifesteal(){ return 0.10 + (skillLv.oil - 1) * 0.025; }     // 10% → 20%
// 소스 레이저: 레벨이 오를수록 피해와 두께 증가
function laserDamage() { return 1 + skillLv.laser * 2; }                // 3 → 11
function laserWidth()  { return 8 + (skillLv.laser - 1) * 5; }          // 8 → 28 (그리는 두께 = 맞는 폭)
// 튀김 방패: 레벨마다 개수 +1, 회전 반경·크기·회전 속도 증가
function shieldOrbit() { return 80 + (skillLv.shield - 1) * 14; }       // 80 → 136 (예전 55)
function shieldSize()  { return 18 + (skillLv.shield - 1) * 4; }        // 18 → 34 (예전 16)
function shieldSpin()  { return 0.06 + (skillLv.shield - 1) * 0.015; }  // 0.06 → 0.12 (라디안/프레임)
let oilTick = 0, oilHealBank = 0;   // 장판 피해 간격, 회복 누적(소수점 모아서 1 이상이면 회복)

function skillCooldown(k) {
  if (k === "oil") return 0;                                    // 항상 켜져 있는 장판 (쿨타임 없음)
  if (k === "laser") return Math.max(60, 150 - (skillLv.laser - 1) * 20);
  return 0;
}

// ===== 회복 아이템: 생선 간식 =====
// 1초마다 일정 확률로 맵의 랜덤한 곳에 생성, 주우면 체력 회복
const HEAL_CHANCE = 0.07;    // 1초마다 생성될 확률 (평균 약 14초에 1개)
const HEAL_MAX = 3;          // 맵에 동시에 있을 수 있는 최대 개수
const HEAL_AMOUNT = 25;      // 회복량
const HEAL_LIFE = 60 * 30;   // 30초 동안 안 주우면 사라짐
let healItems = [];
let floatTexts = [];         // "+25" 같은 떠오르는 글자

// ===== 골드: 햇빛 조각을 주우면 경험치 + 몬스터 등급에 따른 골드 =====
// 시연용으로 보유 골드 100,000부터 시작. 이번 판에 얻은 골드는 게임이 끝나면(GAME OVER·CLEAR) 보유 골드에 더해 저장
// (일시정지 > 메인 로비로 나가면 이번 판 기록과 함께 이번 판 골드도 사라짐)
const START_GOLD = 100000;
const ORB_GOLD = { mini: 1, slime: 2, absorber: 4, ufo: 6, midBoss: 30, finalBoss: 100 };   // 조각 1개당 골드
let gold = START_GOLD, runGold = 0, goldSaved = false;
try { const g = localStorage.getItem("gorocat_gold"); if (g !== null) gold = parseInt(g, 10) || 0; } catch (e) {}
const fmtGold = n => n.toLocaleString("ko-KR");
function collectOrb(o) {            // 햇빛 조각 하나를 먹었을 때: 경험치 + 골드
  gainExp(o.value);
  const g = o.gold || 0;
  runGold += g;
  if (g >= 30) floatTexts.push({ x: player.x + (Math.random() - 0.5) * 30, y: player.y - 44, text: "+" + g + "G", color: "#ffd23f", life: 40 });
}
function saveGold() {               // 게임이 끝나면 이번 판 골드를 보유 골드에 더해 저장 (한 번만)
  if (goldSaved) return;
  goldSaved = true;
  gold += runGold;
  try { localStorage.setItem("gorocat_gold", String(gold)); } catch (e) {}
}

function updateHealItems() {
  // 생성
  if (time % 60 === 0 && healItems.length < HEAL_MAX && Math.random() < HEAL_CHANCE) {
    let hx, hy, tries = 0;
    do { hx = 60 + Math.random() * (WORLD_W - 120); hy = 60 + Math.random() * (WORLD_H - 120); }
    while (insideObstacle(hx, hy, 30) && ++tries < 30);              // 사물 위에는 안 생김
    healItems.push({ x: hx, y: hy, life: HEAL_LIFE, t: 0 });
  }
  // 줍기 / 시간 지나면 사라짐
  for (let i = healItems.length - 1; i >= 0; i--) {
    let h = healItems[i];
    h.t++; h.life--;
    if (Math.hypot(h.x - player.x, h.y - player.y) < 28) {
      let before = player.hp;
      player.hp = Math.min(player.maxHp, player.hp + HEAL_AMOUNT);
      floatTexts.push({ x: player.x, y: player.y - 30, text: "+" + Math.round(player.hp - before), color: "#5fe08a", life: 50 });
      healItems.splice(i, 1);
    } else if (h.life <= 0) {
      healItems.splice(i, 1);
    }
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    floatTexts[i].y -= 0.6;
    if (--floatTexts[i].life <= 0) floatTexts.splice(i, 1);
  }
}

// 생선 간식 그리기 (초록 빛 고리 + 통통한 생선)
function drawHealItem(h) {
  if (h.life < 60 * 5 && Math.floor(h.life / 8) % 2 === 0) return;   // 사라지기 5초 전 깜빡임
  let bob = Math.sin(h.t * 0.08) * 3;
  let x = h.x, y = h.y + bob;
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(h.x, h.y + 14, 12, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(95, 224, 138, " + (0.18 + 0.08 * Math.sin(h.t * 0.1)) + ")";
  ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.25);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#2b4a63";
  // 꼬리
  ctx.fillStyle = "#7fb6e0";
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(17, -7); ctx.lineTo(15, 0); ctx.lineTo(17, 7); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 몸통
  let g = ctx.createLinearGradient(0, -8, 0, 8);
  g.addColorStop(0, "#cfe6f7"); g.addColorStop(1, "#6fa3cf");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 눈 + 비늘 무늬
  ctx.fillStyle = "#1d2b38";
  ctx.beginPath(); ctx.arc(-6, -1.5, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(43,74,99,0.6)"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(1, 0, 4, -1.1, 1.1); ctx.stroke();
  ctx.beginPath(); ctx.arc(5, 0, 3.5, -1.1, 1.1); ctx.stroke();
  ctx.restore();
  // 작은 + 표시
  ctx.fillStyle = "#5fe08a";
  ctx.fillRect(x + 9, y - 17, 8, 3); ctx.fillRect(x + 11.5, y - 19.5, 3, 8);
}

// 화면 밖 회복 아이템 방향을 화면 가장자리 화살표로 알려줌
function drawHealArrows() {
  for (let h of healItems) {
    if (onScreen(h.x, h.y, -10)) continue;
    let sx = h.x - camera.x, sy = h.y - camera.y;
    let cx = VIEW_W / 2, cy = VIEW_H / 2;
    let ang = Math.atan2(sy - cy, sx - cx);
    let ax = Math.max(20, Math.min(VIEW_W - 20, sx));
    let ay = Math.max(70, Math.min(VIEW_H - 90, sy));
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "#5fe08a";
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -7); ctx.lineTo(-3, 0); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
// ===== 맵에 떨어지는 특수 아이템: 자석, 아이템 박스 =====
// 생선 간식처럼 1초마다 일정 확률로 맵 아무 곳에나 생기고, 맵에 종류별로 1개까지만 있음
//  자석: 맵 전체의 햇빛 조각이 한꺼번에 고로캣에게 날아옴
//  아이템 박스: 강화 카드 3장 중 1장 선택 — 이미 가진 스킬(+기본 공격)만 강화, 새 스킬은 안 나옴
const PICKUP_TYPES = {
  magnet: { chance: 0.025, life: 60 * 30, color: "#6fb6ff" },
  box:    { chance: 0.025, life: 60 * 30, color: "#ffd23f" }
};
let pickups = [];

function updatePickups() {
  if (time % 60 === 0) {
    for (const type in PICKUP_TYPES) {
      if (pickups.some(p => p.type === type) || Math.random() >= PICKUP_TYPES[type].chance) continue;
      let x, y, tries = 0;
      do { x = 60 + Math.random() * (WORLD_W - 120); y = 60 + Math.random() * (WORLD_H - 120); }
      while (insideObstacle(x, y, 30) && ++tries < 30);
      pickups.push({ type, x, y, life: PICKUP_TYPES[type].life, t: 0 });
    }
  }
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t++; p.life--;
    if (Math.hypot(p.x - player.x, p.y - player.y) < 30) {
      pickups.splice(i, 1);
      if (p.type === "magnet") useMagnet();
      else openItemBox();
    } else if (p.life <= 0) pickups.splice(i, 1);
  }
}

function useMagnet() {
  for (const o of expOrbs) { o.magnet = true; o.vel = 1 + Math.random() * 2; }
  floatTexts.push({ x: player.x, y: player.y - 34, text: "자석!", color: "#6fb6ff", life: 50 });
}

let choiceSource = "level";   // 지금 카드 화면이 레벨업("level")인지 아이템 박스("box")인지
function openItemBox() {
  const pool = buildBoxPool();
  if (!pool.length) return;
  floatTexts.push({ x: player.x, y: player.y - 34, text: "아이템 박스!", color: "#ffd23f", life: 50 });
  if (choices.length) {        // 레벨업 카드를 고르는 중이면 그 다음에 열림
    pendingBoxes++;
    return;
  }
  showBoxChoices();
}
let pendingBoxes = 0;
function showBoxChoices() {
  const pool = buildBoxPool();
  choiceSource = "box";
  choices = [];
  while (choices.length < 3 && pool.length) choices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
}

// 아이템 박스 카드: 이미 배운 공용 스킬의 강화 + 기본 공격(빵가루 탄환) 강화만
function buildBoxPool() {
  const pool = UPGRADES.filter(u => u.basic).map(u => ({ kind: "basic", name: u.name, desc: u.desc, apply: u.apply }));
  for (const k in SKILL_DEFS) {
    const d = SKILL_DEFS[k];
    if (skillLv[k] > 0 && skillLv[k] < SKILL_MAX)
      pool.push({ kind: "up", name: d.name + " Lv." + (skillLv[k] + 1), desc: d.descUp, color: d.color, apply: () => { skillLv[k]++; } });
  }
  return pool;
}

function drawPickup(p) {
  const T = PICKUP_TYPES[p.type];
  if (p.life < 60 * 5 && Math.floor(p.life / 8) % 2 === 0) return;   // 사라지기 5초 전 깜빡임
  const bob = Math.sin(p.t * 0.08) * 3, x = p.x, y = p.y + bob;
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 16, 13, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = T.color + "33";
  ctx.beginPath(); ctx.arc(x, y, 22 + Math.sin(p.t * 0.1) * 2, 0, Math.PI * 2); ctx.fill();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (p.type === "magnet") {                 // 말굽 자석 (빨강 몸통 + 은색 끝)
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(p.t * 0.05) * 0.2);
    ctx.strokeStyle = "#2a1414"; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.arc(0, -2, 9, Math.PI, 0); ctx.lineTo(9, 9); ctx.moveTo(-9, -2); ctx.lineTo(-9, 9); ctx.stroke();
    ctx.strokeStyle = "#e0443a"; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, -2, 9, Math.PI, 0); ctx.lineTo(9, 5); ctx.moveTo(-9, -2); ctx.lineTo(-9, 5); ctx.stroke();
    ctx.fillStyle = "#dfe6ee"; ctx.fillRect(-12.5, 5, 7, 6); ctx.fillRect(5.5, 5, 7, 6);
    ctx.strokeStyle = "#2a1414"; ctx.lineWidth = 1.5; ctx.strokeRect(-12.5, 5, 7, 6); ctx.strokeRect(5.5, 5, 7, 6);
    ctx.restore();
    // 끌어당기는 느낌의 작은 반짝임
    ctx.strokeStyle = "rgba(111,182,255,0.7)"; ctx.lineWidth = 2;
    const r = 16 + (p.t % 30) * 0.5;
    ctx.beginPath(); ctx.arc(x, y, r, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();
  } else {                                   // 아이템 박스 (보물 상자 + ?)
    ctx.fillStyle = "#8a4f22"; ctx.strokeStyle = "#3e200a"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(x - 13, y - 4, 26, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#a8642c";
    ctx.beginPath(); ctx.moveTo(x - 13, y - 4); ctx.quadraticCurveTo(x, y - 18, x + 13, y - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffd23f";
    ctx.fillRect(x - 2.5, y - 12, 5, 24);
    ctx.fillRect(x - 13, y - 1, 26, 3);
    ctx.fillStyle = "#fff6c0"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
    ctx.fillText("?", x, y - 20 - Math.abs(Math.sin(p.t * 0.08)) * 3);
    ctx.textAlign = "left";
  }
}

// 화면 밖 자석·아이템 박스 방향 화살표 (생선 간식 화살표와 같은 방식, 색만 다름)
function drawPickupArrows() {
  for (const p of pickups) {
    if (onScreen(p.x, p.y, -10)) continue;
    const sx = p.x - camera.x, sy = p.y - camera.y;
    const ang = Math.atan2(sy - VIEW_H / 2, sx - VIEW_W / 2);
    const ax = Math.max(20, Math.min(VIEW_W - 20, sx)), ay = Math.max(70, Math.min(VIEW_H - 90, sy));
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.globalAlpha = 0.9; ctx.fillStyle = PICKUP_TYPES[p.type].color;
    ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(-6, -8); ctx.lineTo(-3, 0); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ===== 난이도 (로비에서 선택, 브라우저에 저장) =====
// count: 한 번에 나오는 졸병 수 / cap: 동시에 있을 수 있는 졸병 수 배율 / every: 나오는 간격 배율(작을수록 빨리 나옴)
// hp: 몬스터 체력 배율 / atk: 몬스터 공격력 배율 — 졸병·보스·적 탄 모두 적용
const DIFFICULTIES = [
  { name: "쉬움",   color: "#5fd07a", count: 1, cap: 0.6, every: 1.5,  hp: 0.6, atk: 0.6 },
  { name: "보통",   color: "#ffd23f", count: 1, cap: 1.0, every: 1.0,  hp: 1.0, atk: 1.0 },
