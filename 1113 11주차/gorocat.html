];

// --- 그림 도우미 ---
function introMinion(type, x, y, s, flip) {     // 졸병 SVG를 크기·방향 바꿔서 (체력바·그림자 없이)
  ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -s : s, s);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(0, MINION_TYPES[type].draw * 0.45, MINION_TYPES[type].draw * 0.35, 5, 0, 0, Math.PI * 2); ctx.fill();
  const keep = FLASH_PASS; FLASH_PASS = true;
  drawMinion({ type, x: 0, y: Math.sin(time * 0.25 + x) * 3, t: time + x, state: "move", glow: 0, hp: 1, maxHp: 1, size: MINION_TYPES[type].size });
  FLASH_PASS = keep;
  ctx.restore();
}
function introSunno(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  drawSunno({ x: 0, y: 0, size: 60, shootTimer: 0, shootEvery: 999 });
  ctx.restore();
}
function sunShard(x, y, r) {                      // 졸병이 들고 도망가는 햇빛 조각
  const g = ctx.createRadialGradient(x, y, 1, x, y, r * 2.4);
  g.addColorStop(0, "rgba(255,240,150,0.9)"); g.addColorStop(1, "rgba(255,200,60,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd23f";
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.7, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.7, y); ctx.closePath(); ctx.fill();
}
function bigSun(x, y, r, a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = "#ffd85a"; ctx.lineWidth = 6; ctx.lineCap = "round";
  for (let i = 0; i < 12; i++) {
    const ang = i / 12 * Math.PI * 2 + time * 0.01;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(ang) * r * 1.25, y + Math.sin(ang) * r * 1.25);
    ctx.lineTo(x + Math.cos(ang) * r * 1.6, y + Math.sin(ang) * r * 1.6); ctx.stroke();
  }
  const g = ctx.createRadialGradient(x, y, 4, x, y, r);
  g.addColorStop(0, "#fff7c2"); g.addColorStop(1, "#ffb830");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function sky(top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 600);
}
function stars(n, a) {
  srand(7);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = `rgba(255,255,255,${a * (0.4 + 0.6 * Math.abs(Math.sin(time * 0.03 + i)))})`;
    ctx.fillRect(rnd() * 800, rnd() * 330, 2, 2);
  }
}
function hills(col1, col2) {                      // 언덕 + 고양이 귀 지붕 집들
  ctx.fillStyle = col1;
  ctx.beginPath(); ctx.moveTo(0, 430);
  for (let x = 0; x <= 800; x += 40) ctx.lineTo(x, 420 - Math.sin(x * 0.012) * 30 - Math.sin(x * 0.031) * 12);
  ctx.lineTo(800, 600); ctx.lineTo(0, 600); ctx.fill();
  for (const [hx, hy] of [[90, 380], [180, 392], [640, 386], [720, 376]]) {
    ctx.fillStyle = col2; ctx.fillRect(hx - 22, hy - 20, 44, 36);
    ctx.beginPath(); ctx.moveTo(hx - 28, hy - 18); ctx.lineTo(hx - 18, hy - 38); ctx.lineTo(hx, hy - 30); ctx.lineTo(hx + 18, hy - 38); ctx.lineTo(hx + 28, hy - 18); ctx.fill();
    ctx.fillStyle = "rgba(255,220,120,0.25)"; ctx.fillRect(hx - 6, hy - 10, 12, 12);
  }
  ctx.fillStyle = col2; ctx.fillRect(0, 470, 800, 130);
}
function smallUfo(x, y, s, beam) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (beam) {
    const bg = ctx.createLinearGradient(0, 10, 0, 330);
    bg.addColorStop(0, "rgba(200,255,170,0.5)"); bg.addColorStop(1, "rgba(200,255,170,0)");
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(-40, 15); ctx.lineTo(40, 15); ctx.lineTo(130, 330); ctx.lineTo(-130, 330); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#3b3150"; ctx.beginPath(); ctx.ellipse(0, 0, 120, 32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#1c1628"; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = "#5c4c7c"; ctx.beginPath(); ctx.ellipse(0, -4, 92, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(160,230,255,0.8)"; ctx.beginPath(); ctx.ellipse(0, -14, 44, 26, 0, Math.PI, 0); ctx.fill();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + time * 0.03;
    ctx.fillStyle = (i + Math.floor(time / 10)) % 2 ? "#ffe066" : "#7dff9a";
    ctx.beginPath(); ctx.arc(Math.cos(a) * 104, Math.sin(a) * 24, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function outlinedText(text, x, y, size, fill, stroke) {
  ctx.font = `bold ${size}px Arial`; ctx.textAlign = "center";
  ctx.lineJoin = "round"; ctx.lineWidth = size * 0.18; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}

// --- 타이틀 그림: 햇빛을 들고 우주선으로 도망가는 외계인들 + 쫓아가는 고로캣 ---
function drawTitle() {
  sky("#1b1640", "#5a3a6e");
  stars(70, 0.9);
  // 해가 있던 자리: 빛이 빠져나간 희미한 원
  ctx.fillStyle = "rgba(255,200,120,0.08)"; ctx.beginPath(); ctx.arc(150, 170, 70, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,200,120,0.25)"; ctx.setLineDash([6, 8]); ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
  smallUfo(650, 120 + Math.sin(time * 0.04) * 5, 1, true);
  hills("#2f2448", "#231a38");
  // 햇빛 조각 부스러기 (도망가며 흘린 빛)
  for (let i = 0; i < 14; i++) {
    const k = (time * 0.004 + i / 14) % 1;
    sunShard(160 + i * 38 + Math.sin(i * 3.1) * 10, 470 - Math.abs(Math.sin(k * Math.PI)) * 30 + (i % 3) * 8, 4);
  }
  // 선노: 빼앗은 태양을 들고 우주선 빔 쪽으로 날아감
  introSunno(600, 300 + Math.sin(time * 0.05) * 6, 1.25);
  // 졸병들: 햇빛 조각을 하나씩 들고 오른쪽으로 도망
  const run = (time * 1.2) % 40;
  introMinion("ufo", 470, 345, 1.1, false);       sunShard(470, 318, 7);
  introMinion("absorber", 400, 455, 1.15, true);  sunShard(400, 418, 8);
  introMinion("slime", 500, 470, 1.2, true);      sunShard(500, 440, 7);
  introMinion("slime", 330, 488, 1.0, true);      sunShard(330, 462, 6);
  // 고로캣: 검을 들고 달려가며 쫓아감 + 속도선
  const gx = 170 + Math.sin(time * 0.05) * 6, gy = 455;
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    const ly = gy - 40 + i * 22, lx = gx - 70 - ((time * 6 + i * 30) % 60);
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - 40, ly); ctx.stroke();
  }
  drawGorocat(gx, gy, 1, time * 0.35, true, 1.7);
  outlinedText("!", gx + 30, gy - 70 + Math.sin(time * 0.2) * 2, 34, "#ffd23f", "#3a1d0a");
  // 제목
  const pulse = 1 + Math.sin(time * 0.06) * 0.02;
  ctx.save(); ctx.translate(400, 92); ctx.scale(pulse, pulse);
  outlinedText("고로캣", 0, 0, 72, "#ffd23f", "#5a2a0a");
  ctx.restore();
  outlinedText("햇빛 탈환 작전", 400, 138, 30, "#fff3d0", "#3a1d4a");
  // 클릭 안내 (깜빡임)
  if (Math.floor(time / 30) % 2 === 0) outlinedText("화면을 클릭하세요", 400, 570, 22, "#ffffff", "#20142e");
  ctx.textAlign = "left";
}

// --- 스토리 장면 그림 ---
function drawStoryScene(scene) {
  if (scene === "sunny") {
    sky("#7ec8f2", "#e8f6ff");
    bigSun(640, 120, 55, 1);
    hills("#7cc070", "#5ea957");
    drawGorocat(400, 385, 1, 0, false, 1.8);
    for (let i = 0; i < 3; i++) outlinedText("z", 445 + i * 18, 315 - i * 18 - ((time * 0.5) % 20), 18 + i * 6, "#ffffff", "#3a5a8a");
  } else if (scene === "ufo") {
    sky("#6aa7d8", "#cfe6f5");
    bigSun(640, 120, 55, 1);
    hills("#6aaa62", "#51934c");
    smallUfo(380, 140 + Math.sin(time * 0.04) * 6, 1.3, false);
    drawGorocat(400, 395, -1, 0, false, 1.6);
    outlinedText("!?", 440, 318, 34, "#ff5f5f", "#3a0a0a");
  } else if (scene === "steal") {
    const k = (time % 240) / 240;                 // 하늘이 점점 어두워짐
    sky(k < 0.5 ? "#4a5c8a" : "#2a2a5a", "#7a6a8a");
    smallUfo(400, 110, 1.3, true);
    bigSun(400 + Math.sin(time * 0.05) * 4, 300 - k * 120, 40 - k * 10, 1);   // 해가 빔에 빨려 올라감
    hills("#3f4f5a", "#2e3a44");
    introSunno(580, 300, 1.2);
    introMinion("slime", 200, 410, 1.2, false);
    introMinion("absorber", 300, 418, 1.2, false);
  } else if (scene === "dark") {
    sky("#0a0a18", "#1a1830");
    stars(40, 0.5);
    hills("#151a24", "#0e121a");
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, 0, 800, 600);
    const g = ctx.createRadialGradient(400, 395, 10, 400, 395, 140);
    g.addColorStop(0, "rgba(255,230,180,0.25)"); g.addColorStop(1, "rgba(255,230,180,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(400, 395, 140, 0, Math.PI * 2); ctx.fill();
    drawGorocat(400, 395, 1, 0, false, 1.6);
    outlinedText("...", 445, 320, 26, "#cccccc", "#111");
  } else if (scene === "rise") {
    sky("#1b1640", "#5a3a6e");
    stars(60, 0.8);
    smallUfo(620, 110, 0.9, true);
    hills("#2f2448", "#231a38");
    introSunno(620, 270, 0.9);
    const g = ctx.createRadialGradient(300, 370, 10, 300, 370, 180);
    g.addColorStop(0, "rgba(255,200,90,0.35)"); g.addColorStop(1, "rgba(255,200,90,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(300, 370, 180, 0, Math.PI * 2); ctx.fill();
    drawGorocat(300, 375 + Math.sin(time * 0.1) * 2, 1, 0, false, 2.1);
  }
}

function drawHowTo() {
  sky("#1b1640", "#3a2a5a");
  stars(50, 0.6);
  outlinedText("조작 방법", 400, 80, 40, "#ffd23f", "#3a1d0a");
  const rows = [
    ["W A S D", "고로캣 이동"],
    ["자동 공격", "가까운 외계인에게 빵가루 탄환을 자동으로 쏴요"],

    ["아이템", "생선 간식: 체력 회복 · 자석: 조각 모두 모으기 · 상자: 스킬 강화"],
    ["라운드", "1~3라운드 끝에 중간 보스, 4라운드는 선노와 최종 결전!"],
    ["E · R 키", "캐릭터 고유 스킬 (E 기본 스킬 · R 궁극기, MP 사용)"],

  ];
  rows.forEach(([k, v], i) => {
    const y = 132 + i * 56;

    ctx.fillStyle = "#ffd23f"; ctx.font = "bold 18px Arial"; ctx.textAlign = "left"; ctx.fillText(k, 90, y + 31);
    ctx.fillStyle = "#ffffff"; ctx.font = "15px Arial"; ctx.fillText(v, 210, y + 31);
  });
  if (Math.floor(time / 30) % 2 === 0) outlinedText("클릭하면 메인 로비로!", 400, 560, 26, "#ffffff", "#20142e");

function drawStory() {
  const page = STORY[storyPage];
  if (page.scene === "howto") { drawHowTo(); return; }
  drawStoryScene(page.scene);
  // 아래쪽 이야기 상자 + 한 글자씩 나오는 글
  ctx.fillStyle = "rgba(15,10,30,0.85)"; rr(ctx, 40, 470, 720, 110, 14); ctx.fill();
  ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2; ctx.stroke();
  const shown = page.text.slice(0, Math.floor(typeT));
  ctx.fillStyle = "#ffffff"; ctx.font = "20px Arial"; ctx.textAlign = "left";
  let line = "", y = 508;
  for (const ch of shown) {                       // 상자 폭에 맞게 줄바꿈
    if (ctx.measureText(line + ch).width > 680) { ctx.fillText(line, 60, y); line = ch === " " ? "" : ch; y += 30; }
    else line += ch;
  }
  ctx.fillText(line, 60, y);
  ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "13px Arial"; ctx.textAlign = "right";
  ctx.fillText((storyPage + 1) + " / " + STORY.length + "   클릭: 다음 · ESC: 건너뛰기", 750, 570);
  if (typeT >= page.text.length && Math.floor(time / 20) % 2 === 0) { ctx.fillStyle = "#ffd23f"; ctx.fillText("▶", 750, 548); }
  ctx.textAlign = "left";
}

// 클릭·스페이스·엔터: 다음으로 / ESC: 바로 게임 시작
function advanceIntro() {
  if (gameState === "title") { gameState = "story"; storyPage = 0; typeT = 0; return; }
  if (gameState !== "story") return;
  const page = STORY[storyPage];
  if (typeT < page.text.length) { typeT = page.text.length; return; }   // 글이 다 안 나왔으면 먼저 다 보여줌
  storyPage++; typeT = 0;
  if (storyPage >= STORY.length) startGame();
}
function startGame() {            // 인트로가 끝나면 메인 로비로 (게임 시작은 로비에서)
  enterLobby();
}
canvas.addEventListener("click", () => { if (gameState === "title" || gameState === "story") advanceIntro(); });
document.addEventListener("keydown", e => {
  if (gameState !== "title" && gameState !== "story") return;
  if (e.code === "Space" || e.code === "Enter") advanceIntro();
  if (e.code === "Escape" && gameState === "story") startGame();
});

function drawIntro() {
  time++;                                          // 인트로 애니메이션용 (게임 시작 때 0으로 되돌림)
  if (gameState === "story" || gameState === "ending") typeT += 0.6;   // 초당 약 36글자
  if (gameState === "ending") endT++;
  ctx.clearRect(0, 0, 800, 600);
  if (gameState === "result") { drawResult(); return; }
  if (gameState === "ending") { drawEnding(); return; }
  if (gameState === "title") drawTitle(); else drawStory();
}

// ===== 엔딩 스토리 (선노를 물리치면: GAME CLEAR → 클릭 → 엔딩 3쪽 → 메인 로비) =====
// 외계인들이 물러나고, 고로캣들이 햇빛을 되찾는 이야기. 인트로처럼 장면 그림 + 한 글자씩 나오는 글
const ENDING = [

  { scene: "return",  text: "우주선에 갇혀 있던 햇빛이 풀려나 하늘로 돌아왔어요. 깜깜하던 고양이 마을에 다시 따뜻한 햇살이 쏟아졌어요!" },
  { scene: "together", text: "감자·카레·크림 고로캣들은 다 함께 햇볕 아래 모였어요. 오늘은 마음 놓고 늘어지게 낮잠을 자도 되겠죠?" }
];
let endPage = 0, endT = 0;            // 엔딩 쪽 번호, 그 쪽이 시작된 뒤 지난 프레임 (애니메이션은 한 번 재생하고 멈춤)
let gameClearAt = 0;                  // 선노를 물리친 시각 (보스를 잡자마자 누른 클릭이 화면을 넘겨버리지 않게)
let clearStats = null;                // 클리어 기록 (엔딩 마지막 쪽에 표시)

function startEnding() {
  if (!clearStats) clearStats = { sec: Math.floor(time / 60), kills, lv: player.level, gold: runGold, dmg: Math.round(totalDamage) };
  gameState = "ending"; endPage = 0; endT = 0; typeT = 0;
}

// ===== 결과 화면 (GAME CLEAR → 결과 → 엔딩 스토리) =====
// 처치 수 · 걸린 시간 · 준 데미지 · 획득 골드를 숫자가 차르르 올라가며 보여줌
let resultT = 0;
const RESULT_ROWS = [
  { key: "kills", label: "처치한 외계인", icon: "👾", fmt: v => fmtGold(v) + " 마리",  color: "#ff8a8a" },
  { key: "sec",   label: "걸린 시간",     icon: "⏱",  fmt: v => Math.floor(v / 60) + "분 " + String(v % 60).padStart(2, "0") + "초", color: "#8fd0ff" },
  { key: "dmg",   label: "준 데미지",     icon: "⚔",  fmt: v => fmtGold(v),              color: "#ffb44a" },
  { key: "gold",  label: "획득 골드",     icon: "G",  fmt: v => "+" + fmtGold(v) + " G", color: "#ffd23f" }
];
const RESULT_STEP = 40, RESULT_COUNT = 50;          // 줄마다 0.67초 간격으로 등장, 숫자는 0.83초 동안 올라감
const resultDoneT = () => RESULT_STEP * (RESULT_ROWS.length - 1) + RESULT_COUNT + 10;
function startResult() {
  clearStats = { sec: Math.floor(time / 60), kills, lv: player.level, gold: runGold, dmg: Math.round(totalDamage) };
  gameState = "result"; resultT = 0;
  playSfx("death");
}
function drawResult() {
  resultT++;
  // 배경: 햇빛을 되찾은 아침 하늘
  sky("#7ec8f2", "#fff1c9");
  bigSun(690, 95, 50 + Math.sin(time * 0.05) * 3, 1);
  hills("#7cc070", "#5ea957");
  // 패널
  ctx.fillStyle = "#231a44"; rr(ctx, 170, 70, 460, 460, 22); ctx.fill();
  ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 3; ctx.stroke();
  outlinedText("결과", 400, 122, 40, "#ffd23f", "#3a1d0a");
  ctx.textAlign = "center"; ctx.fillStyle = "#e9e2ff"; ctx.font = "15px Arial";
  ctx.fillText(CHARACTERS[selectedChar].name + " · Lv." + clearStats.lv + " · " + DIFF().name + " · 선노 격파!", 400, 150);
  RESULT_ROWS.forEach((row, i) => {
    const t0 = i * RESULT_STEP, t = resultT - t0;
    if (t < 0) return;
    const appear = Math.min(1, t / 12);
    const k = Math.min(1, t / RESULT_COUNT), eased = 1 - Math.pow(1 - k, 3);
    const v = Math.round(clearStats[row.key] * eased);
    const y = 172 + i * 76;
    ctx.save(); ctx.globalAlpha = appear; ctx.translate((1 - appear) * -30, 0);
    ctx.fillStyle = "rgba(255,255,255,0.08)"; rr(ctx, 200, y, 400, 64, 14); ctx.fill();
    ctx.fillStyle = row.color; ctx.beginPath(); ctx.arc(234, y + 32, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a1030"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center"; ctx.fillText(row.icon, 234, y + 39);
    ctx.textAlign = "left"; ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px Arial"; ctx.fillText(row.label, 268, y + 38);
    ctx.textAlign = "right"; ctx.fillStyle = row.color; ctx.font = "bold 26px Arial"; ctx.fillText(row.fmt(v), 580, y + 42);
    ctx.restore();
  });
  ctx.textAlign = "center";
  if (resultT >= resultDoneT()) {
    if (Math.floor(time / 25) % 2 === 0) { ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px Arial"; ctx.fillText("클릭 또는 Enter: 엔딩 보기 ▶", 400, 500); }
  } else { ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "13px Arial"; ctx.fillText("클릭하면 바로 모두 보기", 400, 500); }
  ctx.textAlign = "left";
}
function advanceResult() {
  if (resultT < resultDoneT()) { resultT = resultDoneT(); return; }   // 숫자가 다 안 올라갔으면 먼저 다 보여줌
  startEnding();
}
canvas.addEventListener("click", () => { if (gameState === "result") advanceResult(); });
document.addEventListener("keydown", e => {
  if (gameState === "result" && (e.code === "Space" || e.code === "Enter")) advanceResult();
});

// 색 두 개 사이를 k(0~1)만큼 섞기 — 밤하늘이 아침 하늘로 바뀌는 장면용
function lerpColor(a, b, k) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * k).toString(16).padStart(2, "0")).join("");
}
const ease = k => k * k * (3 - 2 * k);
function withSkin(i, fn) {            // 다른 고로캣 색으로 잠깐 바꿔 그리기
  const keep = SKIN; SKIN = CHARACTERS[i].skin; fn(); SKIN = keep;
}
function speech(text, x, y) {         // 말풍선
  ctx.font = "bold 16px Arial";
  const w = ctx.measureText(text).width + 24;
  ctx.fillStyle = "#ffffff"; rr(ctx, x - w / 2, y - 22, w, 34, 12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 8, y + 11); ctx.lineTo(x + 6, y + 11); ctx.lineTo(x - 4, y + 24); ctx.fill();
  ctx.strokeStyle = "#3a1d4a"; ctx.lineWidth = 2; rr(ctx, x - w / 2, y - 22, w, 34, 12); ctx.stroke();
  ctx.fillStyle = "#3a1d4a"; ctx.textAlign = "center"; ctx.fillText(text, x, y);
  ctx.textAlign = "left";
}

function drawEndingScene(scene) {
  if (scene === "retreat") {
    // 1쪽: 우주선이 졸병들을 빨아들이며 오른쪽 위로 도망 / 언덕 위 고로캣이 검을 들고 서 있음
    const k = ease(Math.min(1, endT / 260));
    sky("#1b1640", lerpColor("#5a3a6e", "#7a4a6e", k));
    stars(60, 0.8);
    const ux = 400 + k * 280, uy = 150 - k * 90, us = 1.1 - k * 0.55;
    smallUfo(ux, uy + Math.sin(time * 0.15) * 3, us, k < 0.85);     // 거의 다 도망가면 빔을 거둠
    // 졸병들이 빔을 타고 우주선으로 쏙쏙 빨려 올라감
    const kinds = ["slime", "absorber", "ufo", "slime"];
    kinds.forEach((t, i) => {
      const p = Math.min(1, Math.max(0, (endT - i * 35) / 110));
      if (p >= 1) return;
      const sx = 330 + i * 70, sy = 440;
      introMinion(t, sx + (ux - sx) * p, sy + (uy + 20 - sy) * p, (0.9 - p * 0.6) * us * 1.1, i % 2 === 0);
    });
    hills("#2f2448", "#231a38");
    // 선노: 우주선 옆에서 허둥지둥 + 말풍선
    const sxp = ux - 120 * us, syp = uy + 70 * us;
    introSunno(sxp, syp + Math.sin(time * 0.3) * 4, 0.9 * us + 0.15);
    if (endT > 40 && k < 0.95) speech("기억해라, 고로캣!", sxp - 30, syp - 70 * us);
    // 고로캣: 검을 들고 승리 포즈
    drawGorocat(190, 420 + Math.sin(time * 0.12) * 2, 1, 0, false, 1.9);
    if (endT > 140) outlinedText("흥!", 235, 335, 26, "#ffd23f", "#3a1d0a");
  } else if (scene === "return") {
    // 2쪽: 햇빛이 돌아와 하늘이 밤 → 아침으로, 언덕도 초록으로 물듦, 햇빛 조각이 마을에 쏟아짐
    const k = ease(Math.min(1, endT / 300));
    sky(lerpColor("#1b1640", "#7ec8f2", k), lerpColor("#5a3a6e", "#fff1c9", k));
    stars(60, 0.8 * (1 - k));
    const sunY = 420 - k * 280;
    const glow = ctx.createRadialGradient(400, sunY, 10, 400, sunY, 260);
    glow.addColorStop(0, `rgba(255,230,140,${0.55 * k + 0.2})`); glow.addColorStop(1, "rgba(255,230,140,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, 800, 600);
    bigSun(400, sunY, 30 + k * 28, 1);
    hills(lerpColor("#2f2448", "#7cc070", k), lerpColor("#231a38", "#5ea957", k));
    // 햇빛 조각 비가 마을로 쏟아짐
    srand(11);
    for (let i = 0; i < 26; i++) {
      const sx = 40 + rnd() * 720, sp = 1.2 + rnd() * 1.4, off = rnd() * 500;
      const y = ((endT * sp + off) % 520) - 40;
      if (endT * sp + off < 40) continue;
      sunShard(sx, y, 4 + rnd() * 3);
    }
    drawGorocat(400, 430, -1, 0, false, 1.7);
    if (endT > 120) outlinedText("와아!", 450, 350, 28, "#ffd23f", "#3a1d0a");
  } else if (scene === "together") {
    // 3쪽: 맑은 하늘 아래 감자·카레·크림 고로캣이 함께 — 카레는 신나서 폴짝, 감자는 낮잠, 크림은 해바라기
    sky("#7ec8f2", "#e8f6ff");
    bigSun(650, 115, 52, 1);
    hills("#7cc070", "#5ea957");
    // 반짝이는 햇살 알갱이
    srand(5);
    for (let i = 0; i < 14; i++) {
      const x = rnd() * 800, y = 180 + rnd() * 220;
      ctx.fillStyle = `rgba(255,240,170,${0.4 + 0.4 * Math.sin(time * 0.08 + i)})`;
      ctx.beginPath(); ctx.arc(x, y + Math.sin(time * 0.04 + i) * 6, 3, 0, Math.PI * 2); ctx.fill();
    }
    withSkin(1, () => drawGorocat(240, 425 - Math.abs(Math.sin(time * 0.12)) * 26, 1, time * 0.3, true, 1.6));   // 카레: 폴짝폴짝
    withSkin(0, () => drawGorocat(400, 432, 1, 0, false, 1.75));                                                  // 감자: 쿨쿨
    withSkin(2, () => drawGorocat(560, 428, -1, 0, false, 1.65));                                                 // 크림: 햇볕 쬐기
    for (let i = 0; i < 3; i++) outlinedText("z", 440 + i * 16, 360 - i * 16 - ((time * 0.5) % 20), 16 + i * 5, "#ffffff", "#3a5a8a");
    outlinedText("♪", 270 + Math.sin(time * 0.1) * 6, 345, 26, "#ff8a3d", "#5a2a0a");
    outlinedText("~", 600, 352, 26, "#5b8fd9", "#ffffff");
    // THE END + 클리어 기록 (글이 다 나오면 나타남)
    const a = Math.min(1, Math.max(0, (endT - 90) / 60));
    ctx.save(); ctx.globalAlpha = a;
    outlinedText("THE END", 400, 110, 64, "#ffd23f", "#5a2a0a");
    if (clearStats) outlinedText("클리어 " + clearStats.sec + "초 · 처치 " + clearStats.kills + " · Lv." + clearStats.lv + " · 골드 +" + fmtGold(clearStats.gold), 400, 152, 20, "#ffffff", "#3a5a8a");
    ctx.restore();
  }
}

function drawEnding() {
  const page = ENDING[endPage];
  drawEndingScene(page.scene);
  ctx.fillStyle = "rgba(15,10,30,0.85)"; rr(ctx, 40, 470, 720, 110, 14); ctx.fill();
  ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2; ctx.stroke();
  const shown = page.text.slice(0, Math.floor(typeT));
  ctx.fillStyle = "#ffffff"; ctx.font = "20px Arial"; ctx.textAlign = "left";
  let line = "", y = 508;
  for (const ch of shown) {
    if (ctx.measureText(line + ch).width > 680) { ctx.fillText(line, 60, y); line = ch === " " ? "" : ch; y += 30; }
    else line += ch;
  }
  ctx.fillText(line, 60, y);
  const last = endPage === ENDING.length - 1;
  ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "13px Arial"; ctx.textAlign = "right";
  ctx.fillText("엔딩 " + (endPage + 1) + " / " + ENDING.length + (last ? "   클릭: 메인 로비로" : "   클릭: 다음 · ESC: 건너뛰기"), 750, 570);
  if (typeT >= page.text.length && Math.floor(time / 20) % 2 === 0) { ctx.fillStyle = "#ffd23f"; ctx.fillText("▶", 750, 548); }
  ctx.textAlign = "left";
}

function advanceEnding() {
  if (endT < 5) return;                                                 // 결과 화면에서 넘어온 그 클릭은 무시
  const page = ENDING[endPage];
  if (typeT < page.text.length) { typeT = page.text.length; return; }   // 글이 다 안 나왔으면 먼저 다 보여줌
  if (endPage >= ENDING.length - 1) { backToLobby(); return; }         // 마지막 쪽 다음 → 메인 로비
  endPage++; endT = 0; typeT = 0;
}
canvas.addEventListener("click", () => { if (gameState === "ending") advanceEnding(); });
document.addEventListener("keydown", e => {
  if (gameState !== "ending") return;
  if (e.code === "Space" || e.code === "Enter") advanceEnding();
  if (e.code === "Escape") backToLobby();
});

function enterLobby() { gameState = "lobby"; lobbyEnteredAt = performance.now(); }
// ===== 상점: 보유 골드로 패시브 강화 (모든 캐릭터에 적용, 항목마다 최대 5번, 살 때마다 가격 상승) =====
const SHOP_MAX = 5;
const SHOP_ITEMS = [
  { id: "hp",  name: "든든한 튀김옷",   what: "기본 체력",          per: 15,  unit: "",  base: 1000, color: "#e85a5a", icon: "♥" },
  { id: "atk", name: "날카로운 빵가루", what: "기본 공격력",        per: 1,   unit: "",  base: 1500, color: "#f0a830", icon: "⚔" },
  { id: "cd",  name: "바삭한 집중력",   what: "고유 스킬 쿨타임",  per: 8,   unit: "%", base: 2000, color: "#6fb6ff", icon: "⏱" }
];
let shopLv = { hp: 0, atk: 0, cd: 0 };
try { const v = JSON.parse(localStorage.getItem("gorocat_shop") || "null"); if (v) shopLv = Object.assign(shopLv, v); } catch (e) {}
let shopMsg = "", shopMsgT = 0, shopMsgOk = true;
const shopPrice = it => it.base * (shopLv[it.id] + 1);          // 1000 → 2000 → 3000 … (살 때마다 증가)
const shopBonus = id => { const it = SHOP_ITEMS.find(t => t.id === id); return it.per * shopLv[id]; };
// 고유 스킬 쿨타임 배율 (고유 스킬이 추가되면 이 값을 곱해서 사용 — 지금은 강화 단계만 저장·표시)
const uniqueCooldownMul = () => 1 - shopBonus("cd") / 100;
function buyShopItem(i) {
  const it = SHOP_ITEMS[i]; if (!it) return;
  if (shopLv[it.id] >= SHOP_MAX) { shopMsg = it.name + "은(는) 이미 최대 단계예요"; shopMsgOk = false; shopMsgT = 90; return; }
  const price = shopPrice(it);
  if (gold < price) { shopMsg = "골드가 부족해요 (" + fmtGold(price - gold) + " 골드 더 필요)"; shopMsgOk = false; shopMsgT = 90; return; }
  gold -= price; shopLv[it.id]++;
  try { localStorage.setItem("gorocat_gold", String(gold)); localStorage.setItem("gorocat_shop", JSON.stringify(shopLv)); } catch (e) {}
  shopMsg = it.name + " 구매! " + it.what + " +" + shopBonus(it.id) + it.unit + (it.id === "cd" ? " 감소" : ""); shopMsgOk = true; shopMsgT = 90;
  if (typeof playSfx === "function") playSfx("death");     // 구매 "뿅"
}
const SHOP_ROW = i => ({ x: 140, y: 168 + i * 92, w: 520, h: 80 });
const SHOP_BUY = i => ({ x: 540, y: 168 + i * 92 + 20, w: 104, h: 40 });

function backToLobby() {                 // 게임이 끝나면: 상태를 깨끗이 초기화하려고 페이지를 다시 불러 로비부터

// 로비: 마우스가 고유 스킬 칸 위에 있으면 "E"/"R"
let lobbyMouse = { x: -1, y: -1 };

  lobbyMouse.x = (e.clientX - r.left) * (canvas.width / r.width);

});
function lobbyHoverSkill() {
  if (shopOpen || lobbyMouse.y < 444 || lobbyMouse.y > 484) return null;
  if (lobbyMouse.x >= 440 && lobbyMouse.x <= 580) return "E";
  if (lobbyMouse.x >= 590 && lobbyMouse.x <= 730) return "R";
  return null;
}

function startWithCharacter() {

  player.maxHp = player.hp = s.hp + shopBonus("hp");     // 상점 패시브: 모든 캐릭터에 적용

}

canvas.addEventListener("click", ev => {
  const rct = canvas.getBoundingClientRect();
  const mx = (ev.clientX - rct.left) * (canvas.width / rct.width), my = (ev.clientY - rct.top) * (canvas.height / rct.height);
  if (gameState === "play" && gameClear) { if (performance.now() - gameClearAt > 1200) startResult(); return; }   // 선노를 물리치면 → 결과 화면 → 엔딩 스토리
  if (gameState === "play" && gameOver) { backToLobby(); return; }
  if (gameState !== "lobby" || performance.now() - lobbyEnteredAt < 250) return;   // 로비로 넘어온 그 클릭은 무시
  if (shopOpen) {
    if (inRect(mx, my, BTN_SHOP_CLOSE)) shopOpen = false;
    for (let i = 0; i < SHOP_ITEMS.length; i++) if (inRect(mx, my, SHOP_BUY(i))) buyShopItem(i);
    return;
  }
  for (let i = 0; i < 3; i++) if (inRect(mx, my, LOBBY_CARD(i))) selectChar(i);
  for (let i = 0; i < 3; i++) if (inRect(mx, my, BTN_DIFF(i))) setDifficulty(i);
  if (inRect(mx, my, BTN_SHOP)) shopOpen = true;
  if (inRect(mx, my, BTN_START)) startWithCharacter();
});
document.addEventListener("keydown", e => {
  if (gameState === "play" && gameClear && (e.code === "Enter" || e.code === "Space")) { if (performance.now() - gameClearAt > 1200) startResult(); return; }
  if (gameState === "play" && gameOver && (e.code === "Enter" || e.code === "Space")) { backToLobby(); return; }
  if (gameState !== "lobby" || performance.now() - lobbyEnteredAt < 250) return;
  if (shopOpen) {
    if (e.code === "Escape" || e.code === "KeyS") shopOpen = false;
    if (e.code === "Digit1" || e.code === "Digit2" || e.code === "Digit3") buyShopItem(+e.code.slice(5) - 1);
    return;
  }
  if (e.code === "Digit1" || e.code === "Digit2" || e.code === "Digit3") selectChar(+e.code.slice(5) - 1);
  if (e.code === "ArrowLeft") selectChar((selectedChar + 2) % 3);
  if (e.code === "ArrowRight") selectChar((selectedChar + 1) % 3);
  if (e.code === "ArrowUp") setDifficulty(difficulty - 1);
  if (e.code === "ArrowDown") setDifficulty(difficulty + 1);
  if (e.code === "KeyS") shopOpen = true;
  if (e.code === "Enter") startWithCharacter();
});

  // 슬라이드바: 회색 막대 + 채워진 노란 부분 + 동그란 손잡이
  const sx = VOL_SLIDER.x, sy = VOL_SLIDER.y, sw = VOL_SLIDER.w, kx = sx + sw * masterVol;
  rr(ctx, sx, sy - 5, sw, 10, 5); ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fill();
  if (masterVol > 0) { rr(ctx, sx, sy - 5, Math.max(10, sw * masterVol), 10, 5); ctx.fillStyle = "#ffd23f"; ctx.fill(); }
  ctx.beginPath(); ctx.arc(kx, sy, draggingVol ? 13 : 11, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.strokeStyle = "#e0642a"; ctx.lineWidth = 3; ctx.stroke();
  // 스피커 아이콘 (양 끝: 작게 / 크게)
  ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "12px Arial";
  ctx.textAlign = "left"; ctx.fillText("0", sx - 14, sy + 4);
  ctx.textAlign = "right"; ctx.fillText("100", sx + sw + 30, sy + 4);
  // 배경음악 켜기/끄기 버튼
  drawMenuButton(BTN_BGM, bgmOn ? "배경음악: 켬" : "배경음악: 끔", bgmOn ? "#2f9e5b" : "#7a3a3a");
  // 뒤로
  drawMenuButton(BTN_VOL_BACK, "뒤로", "#5a5470");
  ctx.textAlign = "center"; ctx.font = "13px Arial"; ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fillText("슬라이드바를 끌거나 ← → 키로 조절 · ESC: 뒤로", 400, 460);
  ctx.textAlign = "left";
}

function canvasXY(ev) {
  const rct = canvas.getBoundingClientRect();
  return [(ev.clientX - rct.left) * (canvas.width / rct.width), (ev.clientY - rct.top) * (canvas.height / rct.height)];
}

canvas.addEventListener("mousedown", ev => {             // 슬라이드바 잡기
  if (!paused || pausePage !== "volume") return;
  const [mx, my] = canvasXY(ev);
  if (inRect(mx, my, VOL_HIT)) { draggingVol = true; setVolFromMouse(mx); }
});
window.addEventListener("mousemove", ev => {             // 잡은 채로 움직이면 볼륨이 따라 바뀜 (캔버스 밖으로 나가도 계속)
  if (!draggingVol) return;
  setVolFromMouse(canvasXY(ev)[0]);
});
window.addEventListener("mouseup", () => {
  if (!draggingVol) return;
  draggingVol = false;
  saveAudioSettings();
  playSfx("hit");                                            // 놓으면 "틱" 소리로 지금 크기를 바로 들려줌
});

canvas.addEventListener("click", ev => {
  if (!canPause()) return;
  const [mx, my] = canvasXY(ev);
  if (inRect(mx, my, BTN_PAUSE)) { togglePause(); return; }
  if (!paused) return;
  if (pausePage === "volume") {
    if (inRect(mx, my, BTN_BGM)) { bgmOn = !bgmOn; saveAudioSettings(); }
    if (inRect(mx, my, BTN_VOL_BACK)) pausePage = "menu";
    return;
  }
  for (const b of PAUSE_BTNS) {
    if (!inRect(mx, my, btnRect(b.y))) continue;
    if (b.id === "resume") setPaused(false);
    if (b.id === "volume") pausePage = "volume";
    if (b.id === "lobby") quitToLobby();
  }
});
document.addEventListener("keydown", e => {
  if (paused && pausePage === "volume") {                // 볼륨 창: ESC는 뒤로, ← → 는 5%씩
    if (e.code === "Escape") { pausePage = "menu"; return; }
    if (e.code === "ArrowLeft" || e.code === "ArrowRight") {
      masterVol = Math.min(1, Math.max(0, Math.round((masterVol + (e.code === "ArrowRight" ? 0.05 : -0.05)) * 100) / 100));
      applyVolume(); saveAudioSettings(); playSfx("hit");
      return;
    }
  }
  if (e.code === "KeyP" || (e.code === "Escape" && gameState === "play")) togglePause();
});
window.addEventListener("blur", () => { if (canPause() && !paused) setPaused(true); });   // 다른 창으로 가면 자동 일시정지

startRound(0);
loadLobbyMemory();                   // 게임을 끝내고 돌아온 거면 인트로 없이 로비부터

function loop() {
  if (gameState === "lobby") { drawLobby(); requestAnimationFrame(loop); return; }
  if (gameState !== "play") {        // 인트로(타이틀·스토리) 중에는 게임을 멈추고 인트로만 그림
    drawIntro();
    requestAnimationFrame(loop);
    return;
  }
  if (!paused) update();            // 일시정지 중에는 게임 시간이 멈춤
  if (gameOver || gameClear) saveGold();   // 게임이 끝나면 이번 판 골드를 보유 골드에 저장
  draw();
  if (paused) drawPauseMenu();
  if (canPause()) drawPauseButton();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
