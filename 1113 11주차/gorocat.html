];
let difficulty = 1;
try { const v = +localStorage.getItem("gorocat_diff"); if (v >= 0 && v <= 2 && localStorage.getItem("gorocat_diff") !== null) difficulty = v; } catch (e) {}
const DIFF = () => DIFFICULTIES[difficulty];
const maxEnemies = () => Math.round(MAX_ENEMIES * DIFF().cap);
const spawnEveryNow = () => Math.max(6, Math.round(ROUNDS[round].spawnEvery * DIFF().every));
function setDifficulty(i) {
  difficulty = (i + 3) % 3;
  try { localStorage.setItem("gorocat_diff", String(difficulty)); } catch (e) {}
}

function showBanner(text, frames) { bannerText = text; bannerTimer = frames; }

function startRound(n) {
  round = n;
  roundTime = 0;
  bossSpawned = false;
  // 새 맵으로 이동: 남은 햇빛 조각은 자동으로 흡수, 남은 적·탄·장판·회복 아이템은 정리, 고로캣은 맵 가운데로
  for (let o of expOrbs) gainExp(o.value);
  expOrbs = [];
  enemies = []; enemyShots = []; newEnemies = [];
  if (typeof oilPools !== "undefined") oilPools = [];
  if (typeof oilTick !== "undefined") { oilTick = 0; oilHealBank = 0; }
  if (typeof cannonballs !== "undefined") { cannonballs = []; fireZones = []; uqFx = []; }
  healItems = []; floatTexts = []; pickups = [];
  buildMap(n);
  player.x = WORLD_W / 2; player.y = WORLD_H / 2;
  updateCamera();
  if (ROUNDS[n].boss.final) {
    spawnBoss();             // 4라운드는 시작하자마자 최종 보스
  } else {
    showBanner("ROUND " + (n + 1) + " · " + MAP_INFO[n].name, 140);
  }
}

function spawnBoss() {
  let b = ROUNDS[round].boss;
  bossSpawned = true;
  const bhp = Math.round(b.hp * DIFF().hp);                // 난이도 체력·공격력 배율은 보스에도 적용
  enemies.push({ x: camera.x + VIEW_W / 2, y: Math.max(20, camera.y - 40), size: b.size, speed: b.speed, hp: bhp, maxHp: bhp,
                 dmg: Math.round(b.dmg * DIFF().atk), dead: false, shieldCd: 0, isBoss: true, name: b.name,
                 color: b.color, shootEvery: b.shootEvery, shootTimer: 0, final: !!b.final });
  showBanner((b.final ? "FINAL BOSS  " : "BOSS  ") + b.name, 150);
}

function bossShoot(e) {
  if (!e.shootEvery) return;
  e.shootTimer++;
  if (e.shootTimer < e.shootEvery) return;
  e.shootTimer = 0;
  if (e.final) {
    // 최종 보스: 사방으로 12발 + 부하 소환
    for (let k = 0; k < 12; k++) {
      let a = k * Math.PI * 2 / 12 + time * 0.01;
      enemyShots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 7, dmg: Math.round(12 * DIFF().atk), sunno: true });
    }
    spawnEnemy();
  } else {
    // 중간 보스: 플레이어를 향해 3갈래 탄
    let base = Math.atan2(player.y - e.y, player.x - e.x);
    for (let k = -1; k <= 1; k++) {
      let a = base + k * 0.25;
      // 태양 수호자는 황금빛 구슬, 나머지는 보라빛 구슬
      enemyShots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 3.5, vy: Math.sin(a) * 3.5, r: 6, dmg: Math.round((10 + round * 3) * DIFF().atk),
                        light: round === 1, sunno: round !== 1 });
    }
  }
}

// 플레이어 피해 (맞은 뒤 0.75초 무적)
// 화면 흔들림: 맞으면 잠깐 화면 전체가 흔들림 (세게 맞을수록 조금 더 크게)
let shakeTime = 0, shakePower = 0;
const SHAKE_LEN = 14;                       // 약 0.23초

function damagePlayer(dmg) {
  if (player.inv > 0) return false;         // 무적 시간에는 안 맞음
  if (uniqueInvulnerable()) return false;   // 고유 스킬: 돌진 중·황금 수호 중 무적
  dmg = uniqueDamageFilter(dmg);            // 고유 스킬: 철벽 태세 중 80% 감소
  dmg = Math.max(1, Math.round(dmg * (1 - (player.def || 0) / 100)));   // 방어력만큼 피해 감소 (방패 고로캣 30%)
  player.hp = Math.max(0, player.hp - dmg);
  player.inv = 45;                          // 맞은 뒤 0.75초 무적 (깜빡임)
  shakeTime = SHAKE_LEN;
  playSfx("hurt");
  shakePower = Math.min(10, 4 + dmg * 0.15);
  if (player.hp <= 0) gameOver = true;
  return true;
}

// 난이도에 따라 한 번에 1~2마리
function spawnWave() { for (let k = 0; k < DIFF().count; k++) spawnEnemy(); }

function spawnEnemy() {
  if (enemies.filter(e => !e.isBoss).length >= maxEnemies()) return;
  // 지금 보이는 화면 바로 바깥(가장자리)에서 생성 → 맵 밖이면 맵 안으로 당김
  let x, y, m = 30;
  if (Math.random() < 0.5) {
    x = Math.random() < 0.5 ? camera.x - m : camera.x + VIEW_W + m;
    y = camera.y + Math.random() * VIEW_H;
  } else {
    x = camera.x + Math.random() * VIEW_W;
    y = Math.random() < 0.5 ? camera.y - m : camera.y + VIEW_H + m;
  }
  x = Math.max(10, Math.min(WORLD_W - 10, x));
  y = Math.max(10, Math.min(WORLD_H - 10, y));
  let spot = { x, y }; pushOutOfObstacles(spot, 20); x = spot.x; y = spot.y;   // 사물 안에서 나오지 않게
  // 라운드가 올라갈수록 체력·속도·공격력이 강해짐
  enemies.push(makeMinion(pickMinionType(), x, y));   // 라운드별 비율로 졸병 종류 결정
}

// 외계인에게 피해 주기 (탄환, 스킬 모두 이 함수 사용)

// ===== 효과음 (Web Audio API로 코드에서 직접 만든 소리, 음원 파일 없음) =====
// 타격 "틱" / 고로캣 피격 "쿵" / 몹 사망 "뿅"
// 여러 마리가 한꺼번에 맞거나 죽어도 소리가 겹쳐 시끄럽지 않도록,
// 같은 종류의 소리는 정해진 간격 안에 한 번만 재생 (그 사이에 들어온 소리는 건너뜀)
let audioCtx = null, masterGain = null, soundOn = true;
let masterVol = 0.8, bgmOn = true;                 // 전체 볼륨(0~1, 일시정지 > 볼륨 조절의 슬라이드바), 배경음악 켬/끔
try {                                              // 로비로 돌아가거나 새로 열어도 볼륨 설정은 기억
  const v = localStorage.getItem("gorocat_vol");
  if (v !== null) masterVol = Math.min(1, Math.max(0, parseFloat(v)));
  if (localStorage.getItem("gorocat_bgm") === "0") bgmOn = false;
} catch (e) {}
function saveAudioSettings() {
  try { localStorage.setItem("gorocat_vol", String(masterVol)); localStorage.setItem("gorocat_bgm", bgmOn ? "1" : "0"); } catch (e) {}
}
function applyVolume() {                           // 슬라이드바 0~100% → 실제 음량 (100% = 예전 기본 음량 0.5)
  if (masterGain) masterGain.gain.setTargetAtTime(0.5 * masterVol, audioCtx.currentTime, 0.02);
}
const SFX_GAP = { hit: 0.07, death: 0.09, hurt: 0.15, boss: 0.3 };   // 초 단위 최소 간격
const sfxLast = {};
const sfxStats = { played: {}, skipped: {} };     // 테스트용 집계

// 브라우저는 사용자가 키를 누르거나 클릭한 뒤에만 소리를 낼 수 있음 → 첫 조작 때 오디오 시작
function unlockAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5 * masterVol;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}
document.addEventListener("keydown", unlockAudio);
document.addEventListener("mousedown", unlockAudio);
document.addEventListener("keydown", e => {        // M 키: 소리 켜기/끄기
  if (e.code === "KeyM") soundOn = !soundOn;
});

// 음 하나: 파형, 시작 주파수 → 끝 주파수, 길이, 볼륨
function tone(type, f0, f1, dur, vol, delay) {
  const t = audioCtx.currentTime + (delay || 0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.02);
}
// 짧은 잡음 (타격감·충격음용)
function noise(dur, vol, freq) {
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = audioCtx.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}

function playSfx(name) {
  const now = performance.now() / 1000;
  if (sfxLast[name] !== undefined && now - sfxLast[name] < SFX_GAP[name]) {
    sfxStats.skipped[name] = (sfxStats.skipped[name] || 0) + 1;   // 너무 붙어 있으면 건너뜀
    return;
  }
  sfxLast[name] = now;
  sfxStats.played[name] = (sfxStats.played[name] || 0) + 1;
  if (!soundOn || !audioCtx || audioCtx.state !== "running") return;
  const v = 0.9 + Math.random() * 0.2;            // 매번 살짝 다른 높이 (같은 소리 반복 피로 줄이기)
  if (name === "hit") {                           // 틱: 짧고 높은 소리
    tone("square", 900 * v, 500 * v, 0.045, 0.06);
    noise(0.03, 0.08, 3000);
  } else if (name === "death") {                  // 뿅: 위로 튀는 귀여운 소리
    tone("triangle", 420 * v, 1100 * v, 0.09, 0.16);
    tone("square", 840 * v, 1600 * v, 0.06, 0.04, 0.03);
  } else if (name === "boss") {                   // 보스 쓰러짐: 낮고 긴 폭발음 + 상승음
    noise(0.5, 0.35, 900);
    tone("sawtooth", 160, 40, 0.5, 0.18);
    tone("triangle", 400, 1400, 0.35, 0.12, 0.2);
  } else if (name === "hurt") {                   // 쿵: 고로캣이 맞았을 때 낮고 묵직한 소리
    tone("sawtooth", 230, 70, 0.2, 0.2);
    noise(0.15, 0.25, 600);
  }
}

// ===== 배경음악 (Web Audio API로 직접 만든 곡, 음원 파일 없음) =====
// 1R 잔잔한 오르골 느낌 → 2R 신비로운 우주 분위기 → 3R 우주선으로 진격하는 행진곡 → 4R 웅장하고 빠른 보스전
// 모든 멜로디는 이 게임을 위해 새로 만든 곡 (다른 게임 음악을 베끼지 않음)
// 곡은 4마디 반복. 마디가 끝나기 조금 전에 다음 마디의 음들을 미리 예약해서 끊김 없이 재생

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);      // 음 번호 → 주파수 (60 = 가운데 도)
const _ = null;                                           // 쉼표

const TRACKS = {
  // 1라운드 "고로캣의 집": 느리고 부드러운 오르골 + 은은한 화음, 드럼 없음
  home: {
    bpm: 84, vol: 0.9,
    chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]],          // C  Am  F  G
    melody: [
      72, _, 76, _, 74, 72, _, _,   69, _, 72, _, 76, _, 74, _,
      72, _, 69, _, 65, _, 67, 69,  71, _, 74, _, 72, _, _, _ ],
    lead: "triangle", leadVol: 0.12, pad: 0.05, bass: "beat13", arp: null, drums: null
  },
  // 2라운드 "외계인 우주선 아래": 반짝이는 아르페지오 + 낮은 베이스 + 가벼운 하이햇
  ufo: {
    bpm: 104, vol: 0.85,
    chords: [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]],          // Am  F  C  G
    melody: [
      76, _, _, _, 74, _, 72, _,    77, _, _, _, 76, _, 72, _,
      79, _, _, _, 76, _, 74, 72,   74, _, _, _, 71, _, _, _ ],
    lead: "square", leadVol: 0.05, pad: 0.03, bass: "eighth", arp: { type: "square", vol: 0.025, oct: 12 },
    drums: { hat: "off8" }
  },
  // 3라운드 "우주선 내부": 우주선으로 쳐들어가는 행진 — 옥타브 베이스, 킥·스네어, 빠른 아르페지오
  ship: {
    bpm: 124, vol: 0.85,
    chords: [[62, 65, 69], [58, 62, 65], [60, 64, 67], [57, 61, 64]],          // Dm  Bb  C  A
    melody: [
      74, _, 77, _, 81, _, 79, 77,  77, _, _, 74, _, _, 70, _,
      72, _, 76, _, 79, _, 77, 76,  73, _, 76, _, 81, _, _, _ ],
    lead: "square", leadVol: 0.055, pad: 0.025, bass: "octave", arp: { type: "sawtooth", vol: 0.018, oct: 12 },
    drums: { kick: [0, 8], snare: [4, 12], hat: "8th" }
  },
  // 4라운드 선노 보스전: 웅장하고 빠르게 — 톱니파 베이스, 금관 같은 화음 찌르기, 매 박 킥
  boss: {
    bpm: 150, vol: 0.9,
    chords: [[64, 67, 71], [60, 64, 67], [62, 66, 69], [59, 63, 66]],          // Em  C  D  B
    melody: [
      76, _, 79, _, 83, _, 81, 79,  79, _, _, _, 76, _, 72, _,
      74, _, 78, _, 81, _, 79, 78,  75, _, 78, _, 83, _, _, _ ],
    lead: "sawtooth", leadVol: 0.05, pad: 0, bass: "saw8", arp: { type: "square", vol: 0.022, oct: 24 },
    stabs: true, drums: { kick: [0, 4, 8, 12], snare: [4, 12], hat: "16th" }
  }
};

let musicGain = null, trackGain = null;
let curTrack = null, nextBarTime = 0, barIndex = 0, musicTimer = null, musicEnding = null;

// ---- 악기 ----
function mNote(c, dest, type, freq, t, dur, vol, attack, release) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  const a = attack || 0.01, r = release || 0.08;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  g.gain.setValueAtTime(vol, t + Math.max(a, dur - r));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
}
function mNoise(c, dest, t, dur, vol, hp) {
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  const g = c.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(dest); s.start(t);
}
function mKick(c, dest, t, vol) {
  const o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.2);
}

// ---- 한 마디(16칸 = 16분음표 16개) 예약 ----
function scheduleBar(c, dest, T, bar, t0) {
  const step = 60 / T.bpm / 4;                         // 16분음표 길이(초)
  const chord = T.chords[bar % 4];
  const root = chord[0] - 24;
  // 화음 (은은하게 깔리는 소리)
  if (T.pad) for (const n of chord) mNote(c, dest, "triangle", mtof(n), t0, step * 16, T.pad, 0.25, 0.4);
  // 금관 같은 화음 찌르기 (보스전)
  if (T.stabs) for (const s of [0, 6, 10]) for (const n of chord) mNote(c, dest, "sawtooth", mtof(n), t0 + s * step, step * 2.2, 0.03, 0.005, 0.1);
  for (let i = 0; i < 16; i++) {
    const t = t0 + i * step;
    // 멜로디 (8분음표 단위: 짝수 칸에서만)
    if (i % 2 === 0) {
      const m = T.melody[(bar % 4) * 8 + i / 2];
      if (m !== null) {
        let len = 1; while (len < 8 - i / 2 && T.melody[(bar % 4) * 8 + i / 2 + len] === null) len++;   // 뒤 쉼표만큼 길게
        mNote(c, dest, T.lead, mtof(m), t, step * 2 * len * 0.95, T.leadVol, 0.01, 0.12);
      }
    }
    // 아르페지오 (화음을 빠르게 하나씩)
    if (T.arp) {
      const pat = [0, 1, 2, 1];
      mNote(c, dest, T.arp.type, mtof(chord[pat[i % 4]] + T.arp.oct), t, step * 0.9, T.arp.vol, 0.003, 0.05);
    }
    // 베이스
    if (T.bass === "beat13" && (i === 0 || i === 8)) mNote(c, dest, "sine", mtof(root + 12), t, step * 7, 0.12, 0.02, 0.3);
    if (T.bass === "eighth" && i % 2 === 0) mNote(c, dest, "triangle", mtof(root + 12), t, step * 1.8, 0.11, 0.005, 0.05);
    if (T.bass === "octave" && i % 2 === 0) mNote(c, dest, "triangle", mtof(root + (i % 4 === 0 ? 12 : 24)), t, step * 1.7, 0.12, 0.005, 0.05);
    if (T.bass === "saw8" && i % 2 === 0) mNote(c, dest, "sawtooth", mtof(root + 12), t, step * 1.6, 0.06, 0.005, 0.05);
    // 드럼
    if (T.drums) {
      if (T.drums.kick && T.drums.kick.includes(i)) mKick(c, dest, t, 0.35);
      if (T.drums.snare && T.drums.snare.includes(i)) mNoise(c, dest, t, 0.12, 0.12, 1500);
      const h = T.drums.hat;
      if ((h === "off8" && i % 4 === 2) || (h === "8th" && i % 2 === 0) || h === "16th")
        mNoise(c, dest, t, 0.03, h === "16th" ? 0.025 : 0.04, 7000);
    }
  }
  return step * 16;                                     // 마디 길이
}

// 라운드 → 곡
function wantedTrack() {
  if (typeof gameState !== "undefined" && gameState !== "play") return "home";   // 인트로에서는 잔잔한 1라운드 곡
  if (gameClear || gameOver) return null;
  return ["home", "ufo", "ship", "boss"][round];
}

// 곡 바꾸기: 이전 곡은 0.6초 동안 작아지며 사라지고 새 곡이 바로 시작
function switchTrack(name) {
  if (trackGain) {
    const old = trackGain, t = audioCtx.currentTime;
    old.gain.setValueAtTime(old.gain.value, t);
    old.gain.linearRampToValueAtTime(0.0001, t + 0.6);
    setTimeout(() => old.disconnect(), 1500);
  }
  curTrack = name;
  trackGain = null;
  if (!name) return;
  trackGain = audioCtx.createGain();
  trackGain.gain.value = TRACKS[name].vol;
  trackGain.connect(musicGain);
  barIndex = 0;
  nextBarTime = audioCtx.currentTime + 0.08;
}

// 짧은 연주: 클리어 팡파르 / 게임 오버
function playJingle(kind) {
  const c = audioCtx, t = c.currentTime + 0.05, g = c.createGain();
  g.gain.value = 0.9; g.connect(musicGain);
  if (kind === "clear") {
    [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => mNote(c, g, "square", mtof(n), t + i * 0.09, 0.2, 0.06));
    for (const n of [72, 76, 79, 84]) mNote(c, g, "triangle", mtof(n), t + 0.7, 1.4, 0.07, 0.02, 0.6);
    mKick(c, g, t + 0.7, 0.3);
  } else {
    [67, 64, 60, 55].forEach((n, i) => mNote(c, g, "triangle", mtof(n), t + i * 0.28, 0.35, 0.1, 0.01, 0.2));
  }
}

// 매 프레임 확인: 지금 라운드에 맞는 곡이 나오는지, 다음 마디를 예약할 때가 됐는지
function updateMusic() {
  if (!audioCtx || audioCtx.state !== "running") return;
  if (!musicGain) {
    musicGain = audioCtx.createGain();
    musicGain.connect(masterGain);
  }
  musicGain.gain.setTargetAtTime(soundOn && bgmOn ? (paused ? 0.1 : 0.3) : 0, audioCtx.currentTime, 0.05);   // 일시정지 중에는 작게   // 효과음보다 작게 깔리도록
  const want = wantedTrack();
  if (want !== curTrack) {
    switchTrack(want);
    if (!want && musicEnding === null) { musicEnding = gameClear ? "clear" : "over"; playJingle(musicEnding); }
  }
  if (!curTrack) return;
  while (nextBarTime < audioCtx.currentTime + 0.35) {          // 0.35초 앞까지 미리 예약
    nextBarTime += scheduleBar(audioCtx, trackGain, TRACKS[curTrack], barIndex++, nextBarTime);
  }
}
// 게임이 멈춰 있어도(레벨업 카드 화면 등) 음악은 계속 흘러가도록 따로 타이머로 확인
setInterval(updateMusic, 50);

let totalDamage = 0;          // 이번 판에 적에게 준 데미지 합계 (결과 화면용)
function damageEnemy(e, dmg) {
  if (e.dead) return 0;
  const dealt = Math.min(dmg, Math.max(0, e.hp));    // 실제로 깎은 체력
  totalDamage += dealt;                              // 남은 체력보다 더 들어간 부분(오버킬)은 빼고 셈
  e.hp -= dmg;
  // 타격 이펙트: 깜빡임이 끝난 뒤에 다시 맞으면 새로 시작 (연사에 계속 하얗게 남지 않도록)
  if (e.hitAt === undefined || time - e.hitAt >= HIT_FLASH_LEN) e.hitAt = time;
  if (e.hp > 0) playSfx("hit");                    // 맞았지만 살아 있으면 타격음
  if (e.hp <= 0) {
    e.dead = true;            // 실제 삭제는 프레임 끝에서 한 번에
    kills++;
    playSfx(e.isBoss ? "boss" : "death");           // 쓰러지면 사망음 (보스는 따로)
    if (e.isBoss) {
      // 보스: 햇빛 조각을 잔뜩 뿌리고 라운드 클리어
      // 보스 몸에서 사방으로 튀어나가 바닥에 깔림 (튀는 동안은 줍기 불가, 빛 흡수형도 못 먹음)
      for (let k = 0; k < 12; k++) {
        let a = k * Math.PI * 2 / 12 + Math.random() * 0.3;
        let d = 90 + Math.random() * 70;
        expOrbs.push({ x: e.x, y: e.y, sx: e.x, sy: e.y,
                       tx: Math.max(20, Math.min(WORLD_W - 20, e.x + Math.cos(a) * d)),
                       ty: Math.max(20, Math.min(WORLD_H - 20, e.y + Math.sin(a) * d)),
                       pop: 45, value: 2, t: 0, boss: true, gold: e.final ? ORB_GOLD.finalBoss : ORB_GOLD.midBoss });
        let o = expOrbs[expOrbs.length - 1], tgt = { x: o.tx, y: o.ty };
        pushOutOfObstacles(tgt, 16); o.tx = tgt.x; o.ty = tgt.y;      // 사물 위로 떨어지면 옆으로
      }
      if (e.final) {
        gameClear = true;
        gameClearAt = performance.now();
      } else {
        roundClearTimer = 1;
        clearPhase = 1;
        showBanner("ROUND " + (round + 1) + " CLEAR!", 100);
        // 남은 졸병과 탄은 사라짐 (보상 없음) → 흡수하는 동안 맞지 않음
        for (let other of enemies) if (other !== e) other.dead = true;
        enemyShots = [];
      }
    } else {
      // 쓰러진 자리에 햇빛 조각 떨어뜨리기
      expOrbs.push({ x: e.x, y: e.y, value: 1, t: 0, gold: ORB_GOLD[e.type] || 1 });   // 등급별 골드
      // 슬라임형 졸병은 작은 슬라임 2마리로 분열
      if (e.type === "slime" && enemies.length + newEnemies.length < maxEnemies() + 10) {
        newEnemies.push(makeMinion("mini", e.x - 12, e.y), makeMinion("mini", e.x + 12, e.y));
      }
    }
  }
  return dealt;
}

// 공용 스킬: 쿨타임만 차면 바로 발동 (MP 소모 없음)
function canCast(k, hasTarget) {
  if (skillLv[k] <= 0) return false;
  if (k === "laser" && !hasTarget) return false;   // 쏠 적이 없으면 대기
  return skillTimer[k] >= skillCooldown(k);
}

// 배운 스킬 자동 사용
function updateSkills() {
  let hasTarget = !!findNearestEnemy();
  // 뜨거운 기름 장판: 고로캣을 중심으로 따라다니는 원, 0.5초마다 안에 있는 모든 적에게 피해
  //   준 피해의 일부(10%~20%)만큼 체력 회복 — 소수점은 모아 뒀다가 1 이상이면 회복
  if (skillLv.oil > 0) {
    if (++oilTick >= 30) {
      oilTick = 0;
      let r = oilRadius(), dealt = 0;
      for (let e of enemies) {
        if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < r + e.size / 2 - 8) dealt += damageEnemy(e, oilDamage());
      }
      oilHealBank += dealt * oilLifesteal();
      const whole = Math.floor(oilHealBank + 1e-9);          // 0.1을 10번 더해도 0.999…가 되는 소수 오차 보정
      if (whole >= 1 && player.hp < player.maxHp) {
        let heal = Math.min(whole, player.maxHp - player.hp);
        player.hp += heal;
        oilHealBank = Math.max(0, oilHealBank - whole);
        floatTexts.push({ x: player.x + 18, y: player.y - 36, text: "+" + heal, color: "#5fe08a", life: 35 });
      } else if (player.hp >= player.maxHp) oilHealBank = 0;   // 체력이 가득이면 쌓아 두지 않음
    }
  }

  // 소스 레이저: 가장 가까운 적 방향으로 길게 관통
  if (skillLv.laser > 0) {
    skillTimer.laser++;
    let target = findNearestEnemy();
    if (target && canCast("laser", hasTarget)) {
      skillTimer.laser = 0;
      let ang = Math.atan2(target.y - player.y, target.x - player.x);
      let len = 420;
      let w = laserWidth();
      lasers.push({ x: player.x, y: player.y, ang: ang, len: len, life: 12, w: w });
      let ux = Math.cos(ang), uy = Math.sin(ang);
      for (let e of enemies) {
        let dx = e.x - player.x, dy = e.y - player.y;
        let along = dx * ux + dy * uy;            // 레이저 방향으로 얼마나 떨어졌는지
        let side = Math.abs(dx * uy - dy * ux);   // 레이저 선에서 옆으로 얼마나 떨어졌는지
        if (along > 0 && along < len && side < w / 2 + e.size / 2) damageEnemy(e, laserDamage());
      }
    }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    if (--lasers[i].life <= 0) lasers.splice(i, 1);
  }

  // 튀김 방패: 레벨만큼 방패가 몸 주위를 돌며 닿는 적에게 피해 (적마다 0.5초 간격)
  for (let e of enemies) if (e.shieldCd > 0) e.shieldCd--;
  if (skillLv.shield > 0) {
    shieldAngle += shieldSpin();
    for (let s of getShields()) {
      for (let e of enemies) {
        if (e.shieldCd <= 0 && Math.hypot(e.x - s.x, e.y - s.y) < s.size / 2 + e.size / 2) {
          damageEnemy(e, 1);
          e.shieldCd = 30;
        }
      }
    }
  }
}

function getShields() {
  let list = [];
  for (let k = 0; k < skillLv.shield; k++) {
    let a = shieldAngle + k * Math.PI * 2 / skillLv.shield;
    let R = shieldOrbit();
    list.push({ x: player.x + Math.cos(a) * R, y: player.y + Math.sin(a) * R, size: shieldSize(), ang: a });
  }
  return list;
}

// 끓는 기름 장판 그리기: 주황 원 + 피해 줄 때마다 바깥으로 퍼지는 고리 + 보글보글 기포
function drawOilAura() {
  const r = oilRadius(), x = player.x, y = player.y;
  const pulse = oilTick / 30;                 // 0 → 1 (다음 피해까지)
  let g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
  g.addColorStop(0, "rgba(255, 190, 70, 0.10)");
  g.addColorStop(0.75, "rgba(240, 150, 40, 0.24)");
  g.addColorStop(1, "rgba(220, 110, 20, 0.38)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255, 170, 50, 0.7)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  if (pulse < 0.4) {                          // 방금 피해를 줌: 고리가 바깥으로 퍼짐
    ctx.strokeStyle = "rgba(255, 220, 120, " + (0.6 * (1 - pulse / 0.4)) + ")"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, r * (0.55 + pulse * 1.1), 0, Math.PI * 2); ctx.stroke();
  }
  const n = 6 + skillLv.oil * 2;              // 기포 수도 레벨만큼 늘어남
  for (let k = 0; k < n; k++) {
    let ph = (time * 0.03 + k * 1.7) % 1;     // 기포가 부풀었다 터짐
    let a = k * 2.399 + time * 0.004, d = r * (0.25 + ((k * 37) % 70) / 100);
    ctx.strokeStyle = "rgba(255, 235, 170, " + (0.7 * (1 - ph)) + ")"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 2 + ph * 4, 0, Math.PI * 2); ctx.stroke();
  }
}

// 튀김 방패 하나 그리기: 노릇한 둥근 튀김 + 빵가루 점, 회전 방향으로 돌아감
function drawFriedShield(s) {
  const h = s.size / 2;
  ctx.save();
  ctx.translate(s.x, s.y); ctx.rotate(s.ang + Math.PI / 2);
  let g = ctx.createRadialGradient(-h * 0.3, -h * 0.4, h * 0.1, 0, 0, h);
  g.addColorStop(0, "#f6cf7a"); g.addColorStop(0.6, "#d8953f"); g.addColorStop(1, "#9c5e22");
  ctx.fillStyle = g; ctx.strokeStyle = "#6e4317"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 14; k++) {              // 울퉁불퉁한 튀김옷 테두리
    let a = k * Math.PI * 2 / 14, rr = h * (k % 2 ? 0.9 : 1);
    k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255, 240, 190, 0.8)";
  for (let k = 0; k < 6; k++) { let a = k * 1.05, d = h * 0.5; ctx.fillRect(Math.cos(a) * d - 1, Math.sin(a) * d - 1, 2, 2); }
  ctx.restore();
}

// 가장 가까운 외계인 찾기
function findNearestEnemy(maxRange) {
  let nearest = null;
  let minDist = maxRange ? maxRange * maxRange : Infinity;   // 사정거리를 주면 그 안의 적만
  for (let e of enemies) {
    if (!onScreen(e.x, e.y, 0)) continue;   // 화면에 보이는 적만 조준
    let dx = e.x - player.x;
    let dy = e.y - player.y;
    let d = dx * dx + dy * dy;
    if (d < minDist) { minDist = d; nearest = e; }
  }
  return nearest;
}

// 가장 가까운 외계인 방향으로 빵가루 탄환 발사
// 개틀링건: 쿨타임이 차면 BURST_COUNT발을 BURST_GAP 간격으로 연달아 발사
// ===== 근접 공격 (검 / 방패) =====
// 검·방패 고로캣은 빵가루를 쏘지 않고 가까이서 공격. 사정거리는 칼을 든 것처럼 짧음
const MELEE_BASE = 95;                         // 근접 기본 사정거리 (총·빵가루 240의 약 40%)
const isMelee = () => SKIN.weapon === "sword" || SKIN.weapon === "shield";
// 사정거리 카드(+50)는 근접에선 +15로 반영
const attackRange = () => isMelee() ? MELEE_BASE + (BULLET_RANGE - 240) * 0.3 : BULLET_RANGE;
let meleeFx = [];                              // 검 궤적·충격파 이펙트
let swingT = 0, bashT = 0;                     // 검 휘두르기 / 방패 밀치기 모션 남은 프레임
const SWING_LEN = 16, BASH_LEN = 14;

function meleeAttack() {
  const target = findNearestEnemy(attackRange() + 40);
  if (!target) return false;
  const ang = Math.atan2(target.y - player.y, target.x - player.x);
  player.facing = Math.cos(ang) >= 0 ? 1 : -1;
  player.aimHold = 20;
  const range = attackRange();
  const shield = SKIN.weapon === "shield";
  const cone = shield ? 0.85 : 1.15;          // 반각(라디안): 검 약 130°, 방패 약 100° 부채꼴
  // 한 번에 연사 탄환 수만큼의 위력 (총열 추가 카드도 그대로 반영), 범위 안 모든 적에게
  const dmg = BULLET_DAMAGE * BURST_COUNT * (shield ? 0.6 : 0.75);
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > range + (e.size || 10)) continue;
    let da = Math.atan2(dy, dx) - ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) > cone && d > (e.size || 10) + 14) continue;   // 몸에 딱 붙은 적은 방향 상관없이 맞음
    damageEnemy(e, dmg);
    if (shield && !e.isBoss) {                 // 방패 충격파: 적을 뒤로 밀어냄
      const push = 26;
      e.x += (dx / (d || 1)) * push; e.y += (dy / (d || 1)) * push;
      if (typeof pushOutOfObstacles === "function" && e.type !== "ufo") pushOutOfObstacles(e, e.size || 10);
    }
  }
  if (shield) { bashT = BASH_LEN; meleeFx.push({ kind: "wave", ang, range, cone, t: 0, life: 16 }); }
  else { swingT = SWING_LEN; meleeFx.push({ kind: "slash", ang, range, cone, t: 0, life: 12 }); }
  return true;
}

function updateMeleeFx() {
  if (swingT > 0) swingT--;
  if (bashT > 0) bashT--;
  for (let i = meleeFx.length - 1; i >= 0; i--) { meleeFx[i].t++; if (meleeFx[i].t >= meleeFx[i].life) meleeFx.splice(i, 1); }
}

function drawMeleeFx() {
  for (const f of meleeFx) {
    const k = f.t / f.life;
    ctx.save();
    ctx.translate(player.x, player.y);           // 고로캣을 따라다님
    if (f.kind === "slash") {
      // 검 궤적: 위에서 아래로 쓸고 지나가는 하얀 초승달
      const sweep = Math.min(1, k * 2.2);
      const dir = player.facing;
      const s0 = dir > 0 ? f.ang - f.cone : f.ang + f.cone;
      const s1 = dir > 0 ? f.ang - f.cone + f.cone * 2 * sweep : f.ang + f.cone - f.cone * 2 * sweep;
      ctx.globalAlpha = 1 - k;
      ctx.beginPath();
      ctx.arc(0, 0, f.range, s0, s1, dir < 0);
      ctx.arc(0, 0, f.range * 0.55, s1, s0, dir > 0);
      ctx.closePath();
      const g = ctx.createRadialGradient(0, 0, f.range * 0.5, 0, 0, f.range);
      g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.7, "rgba(230,240,255,0.55)"); g.addColorStop(1, "rgba(255,255,255,0.95)");
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, f.range, s0, s1, dir < 0); ctx.stroke();
    } else {
      // 방패 충격파: 앞으로 퍼져 나가는 푸른 반원 물결 2겹
      for (let j = 0; j < 2; j++) {
        const kk = Math.max(0, k - j * 0.18);
        if (kk <= 0) continue;
        const r = 18 + (f.range - 18) * Math.min(1, kk * 1.3);
        ctx.globalAlpha = (1 - kk) * (j ? 0.6 : 1);
        ctx.strokeStyle = j ? "rgba(255,240,180,0.9)" : "rgba(150,210,255,0.95)";
        ctx.lineWidth = 10 - j * 4;
        ctx.beginPath(); ctx.arc(0, 0, r, f.ang - f.cone, f.ang + f.cone); ctx.stroke();
      }
      ctx.globalAlpha = (1 - k) * 0.25;
      ctx.fillStyle = "#9fd0ff";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 18 + (f.range - 18) * Math.min(1, k * 1.3), f.ang - f.cone, f.ang + f.cone); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function autoFire() {
  updateMeleeFx();
  if (isMelee()) {                              // 검·방패: 쿨타임마다 한 번 휘두르기 / 밀치기
    burstLeft = 0;
    fireTimer++;
    if (fireTimer < FIRE_DELAY) return;
    if (meleeAttack()) fireTimer = 0;
    return;
  }
  // 연사 중이면 다음 탄환 발사
  if (burstLeft > 0) {
    burstTimer++;
    if (burstTimer >= BURST_GAP) {
      burstTimer = 0;
      if (fireOneBullet()) burstLeft--;
      else burstLeft = 0;        // 쏠 적이 없어지면 연사 중단
    }
    return;
  }
  fireTimer++;
  if (fireTimer < FIRE_DELAY) return;
  if (!findNearestEnemy(BULLET_RANGE)) return;   // 사정거리 안에 적이 없으면 쏘지 않음
  fireTimer = 0;
  burstLeft = BURST_COUNT - 1;       // 첫 발은 바로, 나머지는 연달아
  burstTimer = 0;
  fireOneBullet();
}

let muzzleFlash = 0;   // 총 고로캣이 쏠 때 총구가 번쩍이는 시간
// 탄환 한 발: 매번 가장 가까운 적을 다시 조준하고, 살짝 흔들려서 개틀링 느낌
function fireOneBullet() {
  let target = findNearestEnemy(BULLET_RANGE);
  if (!target) return false;
  let ang = Math.atan2(target.y - player.y, target.x - player.x);
  ang += (Math.random() - 0.5) * 0.15;     // 탄 퍼짐
  bullets.push({
    x: player.x, y: player.y,
    vx: Math.cos(ang) * BULLET_SPEED,
    vy: Math.sin(ang) * BULLET_SPEED,
    r: 4,
    dist: 0,             // 지금까지 날아간 거리
    hit: new Set()       // 이미 맞은 적 (관통하면서 같은 적을 두 번 때리지 않게)
  });
  if (SKIN.weapon === "gun") {
    muzzleFlash = 5;
    // 총은 쏘는 쪽을 바라봄 (총구가 적을 향하도록)
    player.facing = Math.cos(ang) >= 0 ? 1 : -1;
    player.aimHold = 20;
  }
  return true;
}

function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.dist += BULLET_SPEED;

    // 사정거리만큼 날아갔거나 화면 밖으로 나가면 삭제
    if (b.dist >= BULLET_RANGE || !onScreen(b.x, b.y, 0)) {
      bullets.splice(i, 1);
      continue;
    }

    // 관통: 외계인에 맞아도 탄환은 계속 날아가고, 지나가는 적마다 한 번씩 데미지
    for (let e of enemies) {
      if (b.hit.has(e)) continue;
      let dx = b.x - e.x, dy = b.y - e.y;
      let reach = b.r + e.size / 2;
      if (dx * dx + dy * dy < reach * reach) {
        b.hit.add(e);
        damageEnemy(e, BULLET_DAMAGE);
        if (b.splash) splashHit(b, e);      // 폭풍 난사 탄: 주변에도 폭발 피해
      }
    }
  }
}

// ===== 캐릭터 고유 스킬 (E: 기본 스킬 · 쿨타임 짧음 / R: 궁극기 · 쿨타임 김) =====
// MP를 쓰고, 상점 "바삭한 집중력"만큼 쿨타임이 줄어듦 (uniqueCooldownMul)
// cd·len 단위는 프레임 (60 = 1초)
const UNIQUE_SKILLS = {
  sword: {
    E: { name: "돌진 베기", cd: 300, mp: 12, color: "#e8eef8", desc: "움직이는 방향으로 돌진하며 지나가는 적을 벰" },
    R: { name: "회전 검무", cd: 1200, mp: 35, color: "#ffd23f", desc: "검이 점점 커지며 3초 동안 회전, 주위 적에게 피해" }
  },
  gun: {
    E: { name: "폭풍 난사", cd: 360, mp: 15, color: "#ffcf4a", desc: "2초 동안 아주 빠르게 난사, 맞은 적 주변에도 폭발 피해" },
    R: { name: "카레 대포", cd: 1200, mp: 35, color: "#ff6a2a", desc: "대포알이 첫 적에게 큰 피해 + 맞은 자리에 불타는 장판" }
  },
  shield: {
    E: { name: "철벽 태세", cd: 420, mp: 15, color: "#7fc8ff", desc: "3초 동안 받는 피해 80% 감소, 끝나면 주변에 충격파" },
    R: { name: "황금 수호", cd: 1500, mp: 40, color: "#ffe27a", desc: "4초 동안 완전 무적" }
  }
};
const DASH_LEN = 12, DASH_SPEED = 14;     // 돌진: 0.2초 동안 약 170px
const SPIN_LEN = 180;                     // 회전 검무: 3초
const BARRAGE_LEN = 120;                  // 폭풍 난사: 2초
const GUARD_LEN = 180, GUARD_CUT = 0.8;   // 철벽 태세: 3초, 피해 80% 감소
const AEGIS_LEN = 240;                    // 황금 수호: 4초 무적

let uq = null;                 // 고유 스킬 상태 (게임 시작 때 초기화)
let uqPress = { E: false, R: false };
let uqFx = [];                 // 폭발·충격파·잔상 같은 효과
let cannonballs = [];          // 카레 대포알
let fireZones = [];            // 대포가 남긴 불타는 장판
function resetUnique() {
  uq = { cdE: 0, cdR: 0, dash: 0, dashX: 0, dashY: 0, dashHit: new Set(), spin: 0, spinAng: 0,
         barrage: 0, guard: 0, guardBlocked: 0, aegis: 0, msg: "", msgT: 0 };
  uqPress = { E: false, R: false }; uqFx = []; cannonballs = []; fireZones = [];
}
resetUnique();
const uqDefs = () => UNIQUE_SKILLS[SKIN.weapon || "sword"];
const uqCdLen = k => Math.round(uqDefs()[k].cd * uniqueCooldownMul());
// 고유 스킬 위력은 기본 공격력(BULLET_DAMAGE)을 따라 커짐 (상점 공격력 강화·카드도 반영)
const uqPow = (base, mul) => base + BULLET_DAMAGE * mul;
// 무적 판정: 돌진 중·황금 수호 중에는 피해를 받지 않음
const uniqueInvulnerable = () => uq && (uq.dash > 0 || uq.aegis > 0);

document.addEventListener("keydown", e => {
  if (gameState !== "play" || e.repeat || gameOver || gameClear || choices.length > 0) return;
  if (typeof paused !== "undefined" && paused) return;    // 일시정지·카드 선택 중 누른 키는 무시
  if (e.code === "KeyE") uqPress.E = true;
  if (e.code === "KeyR") uqPress.R = true;
});

function uqMessage(t) { uq.msg = t; uq.msgT = 50; }

function castUnique(k) {
  const d = uqDefs()[k];
  if ((k === "E" ? uq.cdE : uq.cdR) > 0) return false;
  if (player.mp < d.mp) { uqMessage("MP가 부족해요"); return false; }
  const w = SKIN.weapon || "sword";
  if (w === "gun" && k === "R" && !findNearestEnemy(520)) { uqMessage("쏠 적이 없어요"); return false; }
  player.mp -= d.mp;
  if (k === "E") uq.cdE = uqCdLen("E"); else uq.cdR = uqCdLen("R");
  floatTexts.push({ x: player.x, y: player.y - 46, text: d.name + "!", color: d.color, life: 40 });
  playSfx("death");
  if (w === "sword" && k === "E") {          // 돌진 베기: 누르고 있는 방향(없으면 바라보는 방향)
    let dx = (keys["KeyD"] ? 1 : 0) - (keys["KeyA"] ? 1 : 0), dy = (keys["KeyS"] ? 1 : 0) - (keys["KeyW"] ? 1 : 0);
    if (!dx && !dy) dx = player.facing || 1;
    const l = Math.hypot(dx, dy); uq.dashX = dx / l; uq.dashY = dy / l;
    if (dx) player.facing = dx > 0 ? 1 : -1;
    uq.dash = DASH_LEN; uq.dashHit = new Set();
  }
  if (w === "sword" && k === "R") { uq.spin = SPIN_LEN; uq.spinAng = 0; }
  if (w === "gun" && k === "E") uq.barrage = BARRAGE_LEN;
  if (w === "gun" && k === "R") {
    const t = findNearestEnemy(520), ang = Math.atan2(t.y - player.y, t.x - player.x);
    cannonballs.push({ x: player.x, y: player.y, vx: Math.cos(ang) * 9, vy: Math.sin(ang) * 9, dist: 0, ang });
    player.facing = Math.cos(ang) >= 0 ? 1 : -1; player.aimHold = 30; muzzleFlash = 10;
    shakeTime = 10; shakePower = 5;
  }
  if (w === "shield" && k === "E") { uq.guard = GUARD_LEN; uq.guardBlocked = 0; }
  if (w === "shield" && k === "R") uq.aegis = AEGIS_LEN;
  return true;
}

// 원 안의 적 모두에게 피해 (보스 포함)
function hitCircle(x, y, r, dmg, except) {
  let n = 0;
  for (let e of enemies) {
    if (e.dead || e === except) continue;
    if (Math.hypot(e.x - x, e.y - y) < r + e.size / 2) { damageEnemy(e, dmg); n++; }
  }
  return n;
}

function updateUnique() {
  if (!uq) return;
  // 키 입력은 게임이 진행 중일 때만 처리 (카드 선택·일시정지 중 누른 것은 버림)
  if (uqPress.E) castUnique("E");
  if (uqPress.R) castUnique("R");
  uqPress.E = uqPress.R = false;
  if (uq.cdE > 0) uq.cdE--;
  if (uq.cdR > 0) uq.cdR--;
  if (uq.msgT > 0) uq.msgT--;

  // 검 E: 돌진 — 지나가는 길의 적마다 한 번씩 피해, 돌진 중 무적
  if (uq.dash > 0) {
    uq.dash--;
    uqFx.push({ kind: "ghost", x: player.x, y: player.y, facing: player.facing, t: 0, life: 14 });
    for (let s = 0; s < 2; s++) {           // 빠르게 움직여도 벽·적을 건너뛰지 않게 반씩 나눠 이동
      player.x = Math.max(30, Math.min(WORLD_W - 30, player.x + uq.dashX * DASH_SPEED / 2));
      player.y = Math.max(35, Math.min(WORLD_H - 35, player.y + uq.dashY * DASH_SPEED / 2));
      pushOutOfObstacles(player, 16);
      for (let e of enemies) {
        if (e.dead || uq.dashHit.has(e)) continue;
        if (Math.hypot(e.x - player.x, e.y - player.y) < 30 + e.size / 2) {
          uq.dashHit.add(e); damageEnemy(e, uqPow(6, 3));
          uqFx.push({ kind: "spark", x: e.x, y: e.y, t: 0, life: 12, color: "#ffffff" });
        }
      }
    }
    updateCamera();
    if (uq.dash === 0) { swingT = SWING_LEN; }
  }

  // 검 R: 회전 검무 — 0.5초 동안 검이 커지고, 3초 동안 돌며 0.25초마다 주위 적에게 피해
  if (uq.spin > 0) {
    uq.spin--;
    uq.spinAng += 0.32;
    if ((SPIN_LEN - uq.spin) % 15 === 0) hitCircle(player.x, player.y, spinRadius(), uqPow(3, 2));
  }

  // 총 E: 폭풍 난사 — 3프레임마다 한 발, 맞으면 주변 50px에 폭발 피해
  if (uq.barrage > 0) {
    uq.barrage--;
    if (uq.barrage % 3 === 0) {
      let t = findNearestEnemy(BULLET_RANGE + 60);
      if (t) {
        let ang = Math.atan2(t.y - player.y, t.x - player.x) + (Math.random() - 0.5) * 0.35;
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(ang) * BULLET_SPEED * 1.3, vy: Math.sin(ang) * BULLET_SPEED * 1.3,
                       r: 4, dist: 0, hit: new Set(), splash: true });
        muzzleFlash = 3; player.facing = Math.cos(ang) >= 0 ? 1 : -1; player.aimHold = 20;
      }
    }
  }

  // 총 R: 대포알 — 첫 적에 닿거나 520px 날아가면 폭발 → 불타는 장판
  for (let i = cannonballs.length - 1; i >= 0; i--) {
    let c = cannonballs[i];
    c.x += c.vx; c.y += c.vy; c.dist += 9;
    let first = enemies.find(e => !e.dead && Math.hypot(e.x - c.x, e.y - c.y) < 12 + e.size / 2);
    if (first || c.dist >= 520) {
      if (first) damageEnemy(first, uqPow(25, 8));             // 처음 맞은 적: 큰 피해
      hitCircle(c.x, c.y, 70, uqPow(5, 2), first);              // 폭발 주변
      fireZones.push({ x: c.x, y: c.y, r: 95, life: 300, tick: 0 });   // 5초 동안 불타는 장판
      uqFx.push({ kind: "boom", x: c.x, y: c.y, t: 0, life: 24, r: 90 });
      shakeTime = 12; shakePower = 7; playSfx("boss");
      cannonballs.splice(i, 1);
    }
  }
  for (let i = fireZones.length - 1; i >= 0; i--) {
    let z = fireZones[i];
    z.life--;
    if (++z.tick % 20 === 0) hitCircle(z.x, z.y, z.r - 10, uqPow(2, 1));   // 1/3초마다 지속 피해
    if (z.life <= 0) fireZones.splice(i, 1);
  }

  // 방패 E: 철벽 태세 — 끝나는 순간 주변 150px 충격파 (막은 피해만큼 위력 추가)
  if (uq.guard > 0 && --uq.guard === 0) {
    hitCircle(player.x, player.y, 150, uqPow(6, 3) + Math.round(uq.guardBlocked));
    uqFx.push({ kind: "ring", x: player.x, y: player.y, t: 0, life: 22, r: 150, color: "127,200,255" });
    bashT = BASH_LEN; shakeTime = 10; shakePower = 6; playSfx("boss");
  }
  // 방패 R: 황금 수호
  if (uq.aegis > 0) uq.aegis--;

  for (let i = uqFx.length - 1; i >= 0; i--) if (++uqFx[i].t >= uqFx[i].life) uqFx.splice(i, 1);
}
const spinRadius = () => 60 + 70 * Math.min(1, (SPIN_LEN - uq.spin) / 30);   // 60 → 130 으로 커짐

// 받는 피해 조절 (damagePlayer 에서 호출): 철벽 태세면 80% 감소, 막은 양은 충격파 위력으로
function uniqueDamageFilter(dmg) {
  if (uq && uq.guard > 0) { uq.guardBlocked += dmg * GUARD_CUT; return dmg * (1 - GUARD_CUT); }
  return dmg;
}

// 폭풍 난사 탄이 적에 맞았을 때: 주변 50px 적에게 추가 피해
function splashHit(b, e) {
  hitCircle(e.x, e.y, 50, Math.max(1, Math.round(BULLET_DAMAGE * 0.6)), e);
  uqFx.push({ kind: "spark", x: e.x, y: e.y, t: 0, life: 12, color: "#ffcf4a", r: 50 });
}

// ----- 그리기 -----
function drawUniqueGround() {          // 바닥에 깔리는 것 (불타는 장판)
  for (let z of fireZones) {
    const a = Math.min(1, z.life / 40);
    let g = ctx.createRadialGradient(z.x, z.y, 10, z.x, z.y, z.r);
    g.addColorStop(0, "rgba(255,230,120," + 0.45 * a + ")");
    g.addColorStop(0.6, "rgba(255,110,30," + 0.35 * a + ")");
    g.addColorStop(1, "rgba(160,40,10," + 0.15 * a + ")");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 9; k++) {      // 일렁이는 불꽃
      const ang = k * 0.7 + z.tick * 0.02, d = z.r * (0.2 + (k % 4) * 0.2);
      const fx = z.x + Math.cos(ang) * d, fy = z.y + Math.sin(ang) * d * 0.7, h = 8 + Math.sin(z.tick * 0.3 + k) * 4;
      ctx.fillStyle = "rgba(255," + (150 + k * 10) + ",40," + 0.8 * a + ")";
      ctx.beginPath(); ctx.moveTo(fx - 5, fy); ctx.quadraticCurveTo(fx, fy - h * 2, fx + 5, fy); ctx.fill();
    }
  }
}

function drawUniqueUnder() {            // 고로캣 뒤에 그리는 것 (잔상, 방어막 뒤쪽)
  for (let f of uqFx) if (f.kind === "ghost") {
    ctx.globalAlpha = 0.35 * (1 - f.t / f.life);
    drawGorocat(f.x, f.y, f.facing, 0, false, 1);
    ctx.globalAlpha = 1;
  }
}

function drawUniqueOver() {             // 고로캣 위에 그리는 것
  const px = player.x, py = player.y;
  // 회전 검무: 커다란 검이 고로캣 주위를 돌고, 원형 궤적이 남음
  if (uq.spin > 0) {
    const R = spinRadius();
    ctx.strokeStyle = "rgba(255,240,180,0.35)"; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(px, py, R * 0.8, uq.spinAng - 2.4, uq.spinAng); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(px, py, R, uq.spinAng - 1.6, uq.spinAng); ctx.stroke();
    ctx.save(); ctx.translate(px, py); ctx.rotate(uq.spinAng);
    const L = R;                          // 칼날 길이 = 회전 반경 (점점 커짐)
    let bg = ctx.createLinearGradient(0, -8, 0, 8); bg.addColorStop(0, "#ffffff"); bg.addColorStop(1, "#9aa6b8");
    ctx.fillStyle = bg; ctx.strokeStyle = "#3b2a1a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(14, -6); ctx.lineTo(L - 10, -6); ctx.lineTo(L + 6, 0); ctx.lineTo(L - 10, 6); ctx.lineTo(14, 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#f2c14e"; ctx.fillRect(8, -12, 6, 24); ctx.strokeRect(8, -12, 6, 24);   // 금색 가드
    ctx.fillStyle = "#7a4a22"; ctx.fillRect(-4, -4, 12, 8);                                   // 손잡이
    ctx.restore();
  }
  // 대포알
  for (let c of cannonballs) {
    ctx.strokeStyle = "rgba(255,120,40,0.5)"; ctx.lineWidth = 10; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(c.x - c.vx * 3, c.y - c.vy * 3); ctx.lineTo(c.x, c.y); ctx.stroke(); ctx.lineCap = "butt";
    let g = ctx.createRadialGradient(c.x - 3, c.y - 3, 2, c.x, c.y, 12);
    g.addColorStop(0, "#fff0b0"); g.addColorStop(0.5, "#ff8a2a"); g.addColorStop(1, "#8a2a0a");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI * 2); ctx.fill();
  }
  // 철벽 태세: 파란 방어막 (깜빡이며 끝나감을 알림)
  if (uq.guard > 0) {
    const end = uq.guard < 40 && Math.floor(uq.guard / 5) % 2 === 0;
    ctx.fillStyle = "rgba(127,200,255," + (end ? 0.12 : 0.22) + ")";
    ctx.strokeStyle = "rgba(180,225,255,0.9)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px, py, 44, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    for (let k = 0; k < 6; k++) {         // 육각 무늬
      const a = k * Math.PI / 3 + time * 0.02;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 44, py + Math.sin(a) * 44);
      ctx.strokeStyle = "rgba(180,225,255,0.25)"; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  // 황금 수호: 금빛 기둥 + 회전하는 빛
  if (uq.aegis > 0) {
    const a = Math.min(1, uq.aegis / 30);
    let g = ctx.createRadialGradient(px, py, 10, px, py, 60);
    g.addColorStop(0, "rgba(255,240,150," + 0.35 * a + ")"); g.addColorStop(1, "rgba(255,200,60,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, 60, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,226,122," + 0.9 * a + ")"; ctx.lineWidth = 3;
    for (let k = 0; k < 3; k++) {
      const s = time * 0.08 + k * 2.09;
      ctx.beginPath(); ctx.arc(px, py, 50, s, s + 1.1); ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,240,170," + 0.9 * a + ")";
    for (let k = 0; k < 5; k++) {         // 위로 올라가는 반짝이
      const ph = (time * 0.02 + k * 0.2) % 1;
      ctx.fillRect(px - 30 + k * 15, py + 20 - ph * 70, 3, 3);
    }
  }
  // 폭발·충격파·불꽃
  for (let f of uqFx) {
    const p = f.t / f.life;
    if (f.kind === "boom") {
      ctx.fillStyle = "rgba(255,200,80," + 0.6 * (1 - p) + ")";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.3 + p * 0.7), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,120,40," + (1 - p) + ")"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.5 + p * 0.8), 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === "ring") {
      ctx.strokeStyle = "rgba(" + f.color + "," + (1 - p) + ")"; ctx.lineWidth = 8 * (1 - p) + 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.2 + p * 0.8), 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === "spark") {
      ctx.strokeStyle = f.color; ctx.globalAlpha = 1 - p; ctx.lineWidth = 2;
      const r = (f.r || 20) * (0.3 + p * 0.7);
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

// ===== 미니맵 (오른쪽 아래, 하단 HUD와 같은 높이 · 맵 비율 4:3) =====
// (HUD_SCALE은 아래쪽에서 정의되므로 크기는 처음 그릴 때 계산)
let MINI_H, MINI_W, MINI_X, MINI_Y;
function miniSize() {
  MINI_H = Math.round(96 * HUD_SCALE);                    // HUD 패널 높이와 같게 (약 67px)
  MINI_W = Math.round(MINI_H * WORLD_W / WORLD_H);        // 맵 비율 2400:1800 = 4:3 → 약 90px
  MINI_X = 800 - MINI_W - 6; MINI_Y = 600 - MINI_H - 6;
}
let miniBg = null, miniBgRound = -1;                       // 장애물 배경은 라운드마다 한 번만 그려 둠
function buildMiniBg() {
  miniBg = document.createElement("canvas"); miniBg.width = MINI_W; miniBg.height = MINI_H;
  const m = miniBg.getContext("2d"), k = MINI_W / WORLD_W;
  m.fillStyle = "rgba(15,15,28,0.88)"; m.fillRect(0, 0, MINI_W, MINI_H);
  m.fillStyle = "rgba(255,255,255,0.22)";                  // 장애물(가구·바위·기계)
  for (const o of obstacles) m.fillRect(o.x * k, o.y * k, Math.max(1, o.w * k), Math.max(1, o.h * k));
  miniBgRound = round;
}
function drawMinimap() {
  if (!MINI_W) miniSize();
  if (miniBgRound !== round || !miniBg) buildMiniBg();
  const k = MINI_W / WORLD_W, X = MINI_X, Y = MINI_Y;
  const px = v => X + v.x * k, py = v => Y + v.y * k;
  ctx.save();
  ctx.drawImage(miniBg, X, Y);
  ctx.beginPath(); ctx.rect(X, Y, MINI_W, MINI_H); ctx.clip();
  // 햇빛 조각 (작은 노란 점)
  ctx.fillStyle = "rgba(255,220,90,0.7)";
  for (const o of expOrbs) ctx.fillRect(px(o) - 0.5, py(o) - 0.5, 1.5, 1.5);
  // 적: 졸병 빨간 점, 보스는 크게 깜빡임
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.isBoss) {
      ctx.fillStyle = Math.floor(time / 10) % 2 ? "#ff3b6b" : "#ffffff";
      ctx.beginPath(); ctx.arc(px(e), py(e), 3.5, 0, Math.PI * 2); ctx.fill();
    } else { ctx.fillStyle = "#ff5a5a"; ctx.fillRect(px(e) - 1, py(e) - 1, 2, 2); }
  }
  // 아이템: 생선 간식(초록 +), 자석(파랑), 아이템 박스(노랑) — 잘 보이게 크게 + 테두리
  const item = (x, y, color) => {
    ctx.fillStyle = color; ctx.strokeStyle = "#101018"; ctx.lineWidth = 1;
    ctx.fillRect(x - 2.5, y - 2.5, 5, 5); ctx.strokeRect(x - 2.5, y - 2.5, 5, 5);
  };
  for (const h of healItems) item(px(h), py(h), "#5fe08a");
  for (const it of pickups) item(px(it), py(it), PICKUP_TYPES[it.type].color);
  // 지금 화면에 보이는 범위 (흰 사각형)
  ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 1;
  ctx.strokeRect(X + camera.x * k + 0.5, Y + camera.y * k + 0.5, VIEW_W * k, VIEW_H * k);
  // 고로캣 (캐릭터 색 점 + 흰 테두리)
  ctx.fillStyle = (SKIN && SKIN.b1) || "#e0a95b"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(px(player), py(player), 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = "#e0a95b"; ctx.lineWidth = 2; ctx.strokeRect(X, Y, MINI_W, MINI_H);   // HUD와 같은 테두리
}

// HUD 오른쪽에 E·R 고유 스킬 칸
function drawUniqueHUD() {
  const defs = uqDefs(), panelR = (800 + 480 * HUD_SCALE) / 2;
  const y = 600 - 96 * HUD_SCALE - 6;
  ["E", "R"].forEach((k, i) => {
    const d = defs[k], x = panelR + 8 + i * 52, s = 46;
    const cd = k === "E" ? uq.cdE : uq.cdR, full = uqCdLen(k);
    const active = k === "E" ? (uq.dash > 0 || uq.barrage > 0 || uq.guard > 0) : (uq.spin > 0 || uq.aegis > 0 || cannonballs.length > 0);
    ctx.fillStyle = "rgba(20,20,30,0.85)"; ctx.fillRect(x, y, s, s + 18);
    ctx.strokeStyle = active ? "#ffffff" : (k === "R" ? "#ffd23f" : "#e0a95b"); ctx.lineWidth = active ? 3 : 2;
    ctx.strokeRect(x, y, s, s + 18);
    // 아이콘
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, k === "R" ? 13 : 10, 0, Math.PI * 2); ctx.fill();
    if (k === "R") { ctx.strokeStyle = "#fff6c0"; ctx.lineWidth = 2; ctx.stroke(); }
    // 쿨타임: 남은 비율만큼 어둡게 + 남은 초
    if (cd > 0) {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x + 1, y + 1, s - 2, (s - 2) * cd / full);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px Arial"; ctx.textAlign = "center";
      ctx.fillText(Math.ceil(cd / 60), x + s / 2, y + s / 2 + 5);
    } else if (player.mp < d.mp) {
      ctx.fillStyle = "rgba(30,60,140,0.55)"; ctx.fillRect(x + 1, y + 1, s - 2, s - 2);
    }
    ctx.fillStyle = "#ffd23f"; ctx.font = "bold 13px Arial"; ctx.textAlign = "left"; ctx.fillText(k, x + 4, y + 14);
    ctx.fillStyle = player.mp < d.mp ? "#ff8080" : "#8fb8ff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
    ctx.fillText("MP " + d.mp, x + s / 2, y + s + 13);
  });
  if (uq.msgT > 0) {
    ctx.globalAlpha = Math.min(1, uq.msgT / 15);
    ctx.fillStyle = "#ff8080"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
    ctx.fillText(uq.msg, panelR + 56, y - 8);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "left";
}

// ===== 레벨업 카드 =====
// 능력치 카드
const UPGRADES = [
  { name: "바삭한 빵가루",  desc: "탄환 데미지 +1",       apply: () => BULLET_DAMAGE += 1, basic: true },
  { name: "멀리 던지기",    desc: "기본 공격 사정거리 증가", apply: () => BULLET_RANGE = Math.min(600, BULLET_RANGE + 50), basic: true },
  { name: "빠른 손놀림",    desc: "공격 속도 20% 증가",   apply: () => FIRE_DELAY = Math.max(6, Math.floor(FIRE_DELAY * 0.8)), basic: true },
  { name: "날렵한 발걸음",  desc: "이동 속도 +0.5",       apply: () => player.speed += 0.5 },
  { name: "든든한 속재료",  desc: "최대 체력 +20, 체력 20 회복", apply: () => { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 20); } },
  { name: "고양이 수염",    desc: "햇빛 조각 줍는 범위 +15", apply: () => PICKUP_RANGE += 15 },
  { name: "총열 추가",      desc: "연사 탄환 수 +1 (검·방패는 위력 증가)",      apply: () => BULLET_COUNT_UP(), basic: true },
  { name: "따끈한 낮잠",    desc: "체력 모두 회복",       apply: () => player.hp = player.maxHp }
];
let pendingLevelUps = 0;   // 아직 고르지 않은 레벨업 횟수
let choices = [];          // 지금 화면에 보이는 강화 3개
let levelUpFlash = 0;      // "LEVEL UP!" 글자 표시 시간

function BULLET_COUNT_UP() { BURST_COUNT = Math.min(8, BURST_COUNT + 1); }

// 이번에 나올 수 있는 카드 전부 모으기: 능력치 카드 + 스킬 카드(새로 배우기 / 강화)
function buildCardPool() {
  let pool = UPGRADES.map(u => ({ kind: "stat", name: u.name, desc: u.desc, apply: u.apply }));
  for (let k in SKILL_DEFS) {
    let d = SKILL_DEFS[k];
    if (skillLv[k] === 0) {
      pool.push({ kind: "new", name: d.name, desc: d.desc1, color: d.color,
                  apply: () => { skillLv[k] = 1; learnOrder.push(k); } });
    } else if (skillLv[k] < SKILL_MAX) {
      pool.push({ kind: "up", name: d.name + " Lv." + (skillLv[k] + 1), desc: d.descUp, color: d.color,
                  apply: () => { skillLv[k]++; } });
    }
  }
  return pool;
}

// 카드 풀에서 겹치지 않게 3장 뽑기 (능력치 카드와 스킬 카드가 랜덤으로 섞임)
function rollChoices() {
  let pool = buildCardPool();
  choices = [];
  for (let i = 0; i < 3; i++) {
    let k = Math.floor(Math.random() * pool.length);
    choices.push(pool.splice(k, 1)[0]);
  }
}

// 경험치 획득 (햇빛 조각을 주웠을 때 호출)
function gainExp(amount) {
  player.exp += amount;
  while (player.exp >= player.nextExp) {
    player.exp -= player.nextExp;
    player.level++;
    player.nextExp += 3;
    pendingLevelUps++;
    levelUpFlash = 60;
  }
  if (pendingLevelUps > 0 && choices.length === 0) { choiceSource = "level"; rollChoices(); }
}

// 강화 선택 (1, 2, 3번 키 또는 클릭)
function pickUpgrade(index) {
  if (choices.length === 0 || !choices[index]) return;
  choices[index].apply();
  if (choiceSource === "box") choiceSource = "level";   // 아이템 박스 카드는 레벨업 횟수를 쓰지 않음
  else pendingLevelUps--;
  choices = [];
  if (pendingLevelUps > 0) rollChoices();   // 한 번에 여러 레벨이 올랐으면 연속으로 선택
  else if (pendingBoxes > 0) { pendingBoxes--; showBoxChoices(); }   // 기다리던 아이템 박스
}

document.addEventListener("keydown", e => {
  if (typeof paused !== "undefined" && paused) return;   // 일시정지 중에는 카드 선택 막기
  if (e.code === "Digit1") pickUpgrade(0);
  if (e.code === "Digit2") pickUpgrade(1);
  if (e.code === "Digit3") pickUpgrade(2);
});

// 카드 위치 (그리기와 클릭 판정에 같이 사용)
function cardRect(i) {
  return { x: 130 + i * 190, y: 200, w: 160, h: 170 };
}
canvas.addEventListener("click", e => {
  if (choices.length === 0 || (typeof paused !== "undefined" && paused)) return;
  let r = canvas.getBoundingClientRect();
  let mx = (e.clientX - r.left) * (canvas.width / r.width);
  let my = (e.clientY - r.top) * (canvas.height / r.height);
  for (let i = 0; i < choices.length; i++) {
    let c = cardRect(i);
    if (mx > c.x && mx < c.x + c.w && my > c.y && my < c.y + c.h) pickUpgrade(i);
  }
});

// 카드 폭에 맞게 글자 줄바꿈
function wrapText(text, cx, y, maxW, lineH) {
  let line = "";
  for (let ch of text) {
    if (ctx.measureText(line + ch).width > maxW && line) {
      ctx.fillText(line, cx, y);
      line = ch === " " ? "" : ch;
      y += lineH;
    } else line += ch;
  }
  ctx.fillText(line, cx, y);
}

function drawLevelUpChoices() {
  // 게임 화면을 어둡게
  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.fillRect(0, 0, 800, 600);

  ctx.fillStyle = "#ffd23f";
  ctx.font = "bold 40px Arial";
  ctx.textAlign = "center";
  if (choiceSource === "box") {
    ctx.fillText("아이템 박스!", 400, 140);
    ctx.fillStyle = "white"; ctx.font = "18px Arial";
    ctx.fillText("가지고 있는 스킬 중 하나를 강화하세요 (1 / 2 / 3 키 또는 클릭)", 400, 175);
  } else {
    ctx.fillText("LEVEL UP!  Lv." + (player.level - pendingLevelUps + 1), 400, 140);
    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("강화를 하나 고르세요 (1 / 2 / 3 키 또는 클릭)", 400, 175);
  }

  for (let i = 0; i < choices.length; i++) {
    let c = cardRect(i), card = choices[i];
    let isSkill = card.kind === "new" || card.kind === "up";
    // 카드 종류별 색: 능력치 = 주황 테두리, 스킬 = 하늘색 테두리
    ctx.fillStyle = isSkill ? "#1f2a3a" : "#2a2a3a";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = isSkill ? "#6fd3ff" : "#e0a95b";
    ctx.lineWidth = 3;
    ctx.strokeRect(c.x, c.y, c.w, c.h);

    // 번호
    ctx.textAlign = "left";
    ctx.fillStyle = isSkill ? "#6fd3ff" : "#e0a95b";
    ctx.font = "bold 18px Arial";
    ctx.fillText(String(i + 1), c.x + 10, c.y + 24);

    // 종류 표시
    ctx.textAlign = "center";
    ctx.font = "bold 13px Arial";
    ctx.fillText(card.kind === "stat" ? "능력치" : card.kind === "basic" ? "기본 공격 강화" : card.kind === "new" ? "공용 스킬" : "공용 스킬 강화", c.x + c.w / 2, c.y + 24);

    // 스킬 카드는 아이콘 원
    if (isSkill) {
      ctx.fillStyle = card.color;
      ctx.beginPath();
      ctx.arc(c.x + c.w / 2, c.y + 55, 14, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "white";
    ctx.font = "bold 15px Arial";
    ctx.fillText(card.name, c.x + c.w / 2, c.y + 95);
    ctx.fillStyle = "#ccc";
    ctx.font = "12px Arial";
    wrapText(card.desc, c.x + c.w / 2, c.y + 122, c.w - 20, 16);
  }
  ctx.textAlign = "left";
}

// 햇빛 조각 줍기: 플레이어가 가까이 가면 사라지면서 경험치 증가
function updateExpOrbs() {
  for (let i = expOrbs.length - 1; i >= 0; i--) {
    let o = expOrbs[i];
    o.t++;
    if (o.pop > 0) {                       // 보스 보상: 튀어나가는 중
      o.pop--;
      let k = 1 - o.pop / 45, ease = 1 - (1 - k) * (1 - k);
      o.x = o.sx + (o.tx - o.sx) * ease;
      o.y = o.sy + (o.ty - o.sy) * ease;
      o.hop = Math.sin(k * Math.PI) * 30;  // 포물선처럼 위로 떴다가 떨어짐
      continue;
    }
    o.hop = 0;
    if (o.magnet) {                         // 라운드 클리어: 점점 빨라지며 고로캣에게 날아감 (사물도 통과)
      o.vel = Math.min(24, o.vel + 0.5);
      let mx = player.x - o.x, my = player.y - o.y, md = Math.hypot(mx, my) || 1;
      if (md <= o.vel + 8) { collectOrb(o); expOrbs.splice(i, 1); continue; }
      o.x += mx / md * o.vel; o.y += my / md * o.vel;
      continue;
    }
    let dx = o.x - player.x;
    let dy = o.y - player.y;
    if (Math.sqrt(dx * dx + dy * dy) < PICKUP_RANGE) {
      collectOrb(o);
      expOrbs.splice(i, 1);
    }
  }
}

// 졸병끼리 한 점에 겹치지 않도록 살짝 밀어내기
function separateEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    let a = enemies[i];
    if (a.isBoss) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      let b = enemies[j];
      if (b.isBoss) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      let minD = (a.size + b.size) * 0.4;      // 이 거리보다 가까우면 밀어냄
      let d2 = dx * dx + dy * dy;
      if (d2 >= minD * minD) continue;
      let d = Math.sqrt(d2);
      if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy); }
      let push = (minD - d) * 0.25 / d;        // 한 프레임에 조금씩만
      a.x -= dx * push; a.y -= dy * push;
      b.x += dx * push; b.y += dy * push;
    }
  }
  for (let e of enemies) if (!e.isBoss && e.type !== "ufo") pushOutOfObstacles(e, e.size * 0.4);
}

function update() {
  // 게임이 끝났거나 카드를 고르는 동안에는 화면 흔들림도 바로 멈춤 (남은 흔들림을 지움)
  if (gameOver || gameClear) { shakeTime = 0; return; }
  if (choices.length > 0) { shakeTime = 0; return; }   // 강화를 고르는 동안 게임 멈춤
  time++;
  if (levelUpFlash > 0) levelUpFlash--;
  if (bannerTimer > 0) bannerTimer--;
  if (player.inv > 0) player.inv--;
  if (shakeTime > 0) shakeTime--;

  // 마나 자동 회복
  player.mp = Math.min(player.maxMp, player.mp + 0.08);   // 초당 약 4.8 회복 (고유 스킬 E·R에 사용)

  const dashing = uq && uq.dash > 0;         // 돌진 중에는 WASD 이동 대신 돌진 방향으로
  if (keys["KeyW"] && !dashing) player.y -= player.speed;
  if (keys["KeyS"] && !dashing) player.y += player.speed;
  if (player.aimHold > 0) player.aimHold--;
  if (muzzleFlash > 0) muzzleFlash--;
  const aiming = player.aimHold > 0;          // 총 고로캣이 막 쐈으면 적 쪽을 계속 바라봄
  if (keys["KeyA"] && !dashing) { player.x -= player.speed; if (!aiming) player.facing = -1; }
  if (keys["KeyD"] && !dashing) { player.x += player.speed; if (!aiming) player.facing = 1; }
  // 맵 끝(벽) 밖으로는 못 나감
  player.x = Math.max(30, Math.min(WORLD_W - 30, player.x));
  player.y = Math.max(35, Math.min(WORLD_H - 35, player.y));
  pushOutOfObstacles(player, 16);          // 가구·나무 같은 사물은 통과 못 함
  updateCamera();
  player.moving = keys["KeyW"] || keys["KeyA"] || keys["KeyS"] || keys["KeyD"];
  if (player.moving) player.walkTime++;

  // 라운드 진행
  let R = ROUNDS[round];
  if (roundClearTimer > 0) {
    if (clearPhase === 1 && !expOrbs.some(o => o.pop > 0)) {
      // 보상이 다 떨어졌으면 → 맵에 있는 햇빛 조각 전부 고로캣에게 끌려옴
      clearPhase = 2;
      for (let o of expOrbs) { o.magnet = true; o.vel = 1 + Math.random() * 2; }
    } else if (clearPhase === 2 && expOrbs.length === 0) {
      clearPhase = 3; clearWait = 50;               // 다 모았으면 잠깐 쉬고
    } else if (clearPhase === 3 && --clearWait <= 0) {
      roundClearTimer = 0; clearPhase = 0;
      startRound(round + 1);                         // 다음 라운드
    }
  } else {
    roundTime++;
    // 일반 외계인: 1~3라운드는 보스 전까지, 4라운드는 보스와 함께 조금씩
    if ((!bossSpawned || R.boss.final) && roundTime % spawnEveryNow() === 0) spawnWave();   // 난이도별 간격·마리 수
    // 시간이 다 되면 보스 등장
    if (!bossSpawned && roundTime >= R.duration * 60) spawnBoss();
  }

  autoFire();
  updateBullets();
  updateSkills();
  updateUnique();
  enemies = enemies.filter(e => !e.dead);   // 쓰러진 외계인 정리
  if (newEnemies.length) { enemies.push(...newEnemies); newEnemies = []; }
  updateExpOrbs();
  updateHealItems();
  updatePickups();

  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    // 플레이어 쪽으로 이동
    if (e.isBoss) {
      let dx = player.x - e.x;
      let dy = player.y - e.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      e.x += dx / dist * e.speed;
      e.y += dy / dist * e.speed;
      bossShoot(e);
    } else {
      updateMinion(e);      // 졸병은 종류별 행동
      if (e.type !== "ufo") pushOutOfObstacles(e, e.size * 0.4);   // 걸어다니는 졸병은 사물에 막힘
    }

    // 부딪히면 체력 감소 (일반 외계인은 부딪히면 사라지고, 보스는 남음)
    let reach = 10 + e.size / 2;
    if (Math.abs(e.x - player.x) < reach && Math.abs(e.y - player.y) < reach) {
      if (damagePlayer(e.dmg) && !e.isBoss) enemies.splice(i, 1);
    }
  }

  separateEnemies();

  // 보스 탄 이동 & 플레이어 충돌
  for (let i = enemyShots.length - 1; i >= 0; i--) {
    let b = enemyShots[i];
    b.x += b.vx;
    b.y += b.vy;
    if (!onScreen(b.x, b.y, 60)) { enemyShots.splice(i, 1); continue; }
    if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + 10) {
      if (damagePlayer(b.dmg)) enemyShots.splice(i, 1);
    }
  }
}

// 바닥: 라운드마다 미리 그려 둔 맵 캔버스에서 지금 보이는 부분만 복사
function drawFloor() {
  ctx.fillStyle = "#111";                  // 맵 밖(벽 너머)
  ctx.fillRect(camera.x, camera.y, VIEW_W, VIEW_H);
  const sx = Math.max(0, Math.floor(camera.x)), sy = Math.max(0, Math.floor(camera.y));
  const sw = Math.min(WORLD_W, Math.ceil(camera.x + VIEW_W)) - sx, sh = Math.min(WORLD_H, Math.ceil(camera.y + VIEW_H)) - sy;
  if (sw > 0 && sh > 0) ctx.drawImage(mapCanvas, sx, sy, sw, sh, sx, sy, sw, sh);
  ctx.strokeStyle = "#ffd23f";             // 맵 경계(벽)
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
}

// ===== 어둠과 시야 =====
// 햇빛을 빼앗겨 세상이 어두움. 라운드가 거듭될수록(햇빛에 가까워질수록) 밝아지고 시야가 넓어짐
// 1라운드: 아주 어둡고 시야 좁음 → 4라운드: 꽤 밝고 시야 넓음 → 선노를 물리치면 어둠이 완전히 걷힘
const LIGHT = [
  { radius: 210, dark: 0.92 },
  { radius: 260, dark: 0.82 },
  { radius: 320, dark: 0.68 },
  { radius: 420, dark: 0.5 }
];
let curRadius = LIGHT[0].radius, curDark = LIGHT[0].dark;   // 라운드가 바뀌면 이 값이 목표까지 천천히 따라감
const darkCanvas = document.createElement("canvas");
darkCanvas.width = VIEW_W; darkCanvas.height = VIEW_H;
const dctx = darkCanvas.getContext("2d");

// (x, y) 화면 좌표에 반지름 r만큼 어둠을 지워 빛을 냄
function lightHole(x, y, r, strength) {
  const g = dctx.createRadialGradient(x, y, r * 0.25, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${strength})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  dctx.fillStyle = g;
  dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
}

// UFO 조준선과 레이저는 어둠 속에서도 보이도록 어둠 위에 한 번 더 그림 (피할 수 있게)
function drawUfoAimLines() {
  if (curDark < 0.05) return;
  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
  ctx.lineCap = "round";
  for (const e of enemies) {
    if (e.type !== "ufo" || e.state === "move") continue;
    let ax = Math.cos(e.laserAng), ay = Math.sin(e.laserAng);
    if (e.state === "aim") {
      ctx.strokeStyle = "rgba(200, 150, 255, " + (0.3 + 0.4 * (e.stateT % 10 < 5)) + ")";
      ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    } else {
      ctx.strokeStyle = "rgba(210, 160, 255, 0.7)"; ctx.lineWidth = 10; ctx.setLineDash([]);
    }
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + ax * 700, e.y + ay * 700); ctx.stroke();
  }
  ctx.restore();
}

function drawDarkness() {
  const target = gameClear ? { radius: 2000, dark: 0 } : LIGHT[round];
  curRadius += (target.radius - curRadius) * 0.03;
  curDark += (target.dark - curDark) * 0.03;
  if (curDark < 0.01) return;

  dctx.globalCompositeOperation = "source-over";
  dctx.clearRect(0, 0, VIEW_W, VIEW_H);
  dctx.fillStyle = `rgba(6, 6, 22, ${curDark})`;
  dctx.fillRect(0, 0, VIEW_W, VIEW_H);
  dctx.globalCompositeOperation = "destination-out";

  const sx = x => x - camera.x, sy = y => y - camera.y;
  // 고로캣 주변 시야 (살짝 숨쉬듯 흔들림)
  lightHole(sx(player.x), sy(player.y), curRadius * (1 + Math.sin(time * 0.05) * 0.015), 1);
  // 스스로 빛나는 것들: 햇빛 조각, 생선 간식, 적의 탄(피할 수 있게), 조준 중인 UFO, 2라운드 트랙터 빔
  for (const o of expOrbs) if (onScreen(o.x, o.y, 40)) lightHole(sx(o.x), sy(o.y), o.boss ? 46 : 30, 0.7);
  for (const h of healItems) if (onScreen(h.x, h.y, 40)) lightHole(sx(h.x), sy(h.y), 40, 0.7);
  for (const q of pickups) if (onScreen(q.x, q.y, 40)) lightHole(sx(q.x), sy(q.y), 44, 0.75);
  for (const b of enemyShots) if (onScreen(b.x, b.y, 40)) lightHole(sx(b.x), sy(b.y), 26, 0.8);
  for (const e of enemies) {
    if (!onScreen(e.x, e.y, 60)) continue;
    if (e.isBoss) lightHole(sx(e.x), sy(e.y), e.size * 1.6, 0.55);                 // 보스는 존재감 있게
    else if (e.type === "ufo" && e.state !== "move") lightHole(sx(e.x), sy(e.y), 40, 0.8);
    else if (e.type === "absorber" && e.state === "charge") lightHole(sx(e.x), sy(e.y), 36, 0.8);
  }
  // 고유 스킬 빛: 불타는 장판·대포알·폭발은 어둠 속에서도 보이게
  if (typeof fireZones !== "undefined") {
    for (const z of fireZones) if (onScreen(z.x, z.y, 120)) lightHole(sx(z.x), sy(z.y), z.r * 1.25, 0.75 * Math.min(1, z.life / 40));
    for (const c of cannonballs) lightHole(sx(c.x), sy(c.y), 50, 0.8);
    for (const f of uqFx) if (f.kind === "boom") lightHole(sx(f.x), sy(f.y), f.r * 1.4, 0.8 * (1 - f.t / f.life));
  }
  if (round === 1) lightHole(sx(UFO_POS.x), sy(UFO_POS.y + 420), 230, 0.75);
  if (round === 1) lightHole(sx(UFO_POS.x), sy(UFO_POS.y), 280, 0.6);
  dctx.globalCompositeOperation = "source-over";

  ctx.drawImage(darkCanvas, 0, 0);
}

function draw() {
  // 화면 흔들림: 전체 그림을 무작위로 조금씩 밀어서 그림 (점점 약해짐)
  let ox = 0, oy = 0;
  const playing = !gameOver && !gameClear && choices.length === 0 && !(typeof paused !== "undefined" && paused);
  if (shakeTime > 0 && playing) {             // 카드 선택·게임 오버·클리어·일시정지 중에는 흔들지 않음
    const k = shakeTime / SHAKE_LEN;
    ox = (Math.random() * 2 - 1) * shakePower * k;
    oy = (Math.random() * 2 - 1) * shakePower * k;
  }
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);        // 밀린 가장자리가 비어 보이지 않게
  ctx.save();
  ctx.translate(Math.round(ox), Math.round(oy));
  drawScene();
  ctx.restore();
}

function drawScene() {
  ctx.clearRect(0, 0, 800, 600);
  updateCamera();

  // ----- 여기부터는 맵 좌표: 카메라만큼 밀어서 그림 -----
  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
  drawFloor();

  // 기름 장판 (바닥에 깔리니까 먼저 그림) — 고로캣 발밑을 따라다니는 끓는 기름 원
  if (skillLv.oil > 0 && !gameOver) drawOilAura();
  drawUniqueGround();                       // 카레 대포의 불타는 장판

  // 회복 아이템 (생선 간식)
  for (let h of healItems) drawHealItem(h);
  for (let p of pickups) drawPickup(p);   // 자석, 아이템 박스

  // 햇빛 조각 (반짝이는 노란 마름모)
  for (let o of expOrbs) {
    let glow = 4 + Math.sin(o.t * 0.15) * 2;   // 크기가 살짝 커졌다 작아졌다
    let s = o.boss ? 1.5 : 1;                  // 보스 보상은 1.5배 크고 경험치 2
    let y = o.y - (o.hop || 0);
    if (o.magnet) {                            // 끌려가는 중: 뒤로 빛 꼬리
      let mx = player.x - o.x, my = player.y - o.y, md = Math.hypot(mx, my) || 1;
      ctx.strokeStyle = "rgba(255, 220, 80, 0.45)";
      ctx.lineWidth = 4 * s;
      ctx.beginPath(); ctx.moveTo(o.x, y); ctx.lineTo(o.x - mx / md * o.vel * 3, y - my / md * o.vel * 3); ctx.stroke();
    }
    ctx.fillStyle = o.boss ? "rgba(255, 170, 40, 0.35)" : "rgba(255, 220, 80, 0.3)";
    ctx.beginPath();
    ctx.arc(o.x, y, (9 + glow) * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = o.boss ? "#ffb02e" : "#ffd23f";
    ctx.beginPath();
    ctx.moveTo(o.x, y - 7 * s);
    ctx.lineTo(o.x + 5 * s, y);
    ctx.lineTo(o.x, y + 7 * s);
    ctx.lineTo(o.x - 5 * s, y);
    ctx.closePath();
    ctx.fill();
  }

  // 기본 공격 사정거리 (아주 옅은 점선 원)
  ctx.save();
  ctx.strokeStyle = "rgba(255, 240, 200, 0.3)";
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 10]);
  ctx.beginPath(); ctx.arc(player.x, player.y, attackRange(), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // 플레이어 (맞은 직후 무적 시간에는 깜빡임)
  if (player.inv === 0 || Math.floor(player.inv / 4) % 2 === 0) {
    // 걸을 때는 0→1→2→3 프레임 반복, 멈춰 있으면 0번 프레임 + 살짝 숨쉬기
    let bob = player.moving ? -Math.abs(Math.sin(player.walkTime * 0.2)) * 2 : Math.sin(time * 0.08);
    // 그림자
    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + 26, 17, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    drawGorocat(player.x, player.y + bob, player.facing, player.walkTime * 0.2, player.moving, 1);
    drawMeleeFx();
    drawUniqueOver();
  }

  for (let e of enemies) {
    const fn = e.isBoss ? (e.final ? drawSunno : drawMidBoss) : drawMinion;   // 선노 / 중간 보스 / 졸병
    fn(e);
    if (isFlashing(e)) drawHitFlash(e, fn);   // 맞은 직후: 투명한 흰색으로 깜빡
  }

  // 보스 탄 (선노의 탄은 보라빛 에너지 구슬)
  for (let b of enemyShots) {
    if (b.light) {         // 빛 흡수형의 빛 구슬
      ctx.fillStyle = "rgba(255, 200, 70, 0.35)";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffe16b";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff9c5";
      ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (b.sunno) {
      ctx.fillStyle = "rgba(170, 110, 255, 0.35)";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#b98cff";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f3eaff";
      ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "#ff5af0";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 소스 레이저 — 레벨이 오를수록 두꺼워짐 (바깥 빨강 + 안쪽 밝은 심)
  for (let l of lasers) {
    const a = l.life / 12, w = l.w || 10;
    const ex = l.x + Math.cos(l.ang) * l.len, ey = l.y + Math.sin(l.ang) * l.len;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(214, 52, 47, " + a + ")"; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = "rgba(255, 170, 140, " + a + ")"; ctx.lineWidth = Math.max(2, w * 0.35);
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.lineCap = "butt";
  }

  // 튀김 방패
  for (let s of getShields()) drawFriedShield(s);

  // 탄환 — 사정거리 끝에 가까워지면 흐려짐
  // 검·방패 고로캣: 빵가루 탄환(노릇한 갈색 원) / 총 고로캣: 노란 에너지탄(빛 꼬리)
  const gunShots = SKIN.weapon === "gun";
  for (let b of bullets) {
    ctx.globalAlpha = Math.min(1, (BULLET_RANGE - b.dist) / 60);
    if (gunShots) {
      ctx.strokeStyle = "rgba(255,200,60,0.75)"; ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * 1.6, b.y - b.vy * 1.6); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = "#fff4c2";
      ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "#e0a95b";
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // 레벨업 순간 플레이어 머리 위 글자 (맵 좌표)
  if (levelUpFlash > 0 && choices.length === 0) {
    ctx.fillStyle = "#ffd23f";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText("LEVEL UP!", player.x, player.y - 20 - (60 - levelUpFlash) * 0.3);
    ctx.textAlign = "left";
  }

  // 맵 위에 겹쳐 그리는 것 (2라운드 공중의 우주선 + 트랙터 빔)
  if (mapOverlay) mapOverlay(time);

  // 떠오르는 글자 (+25 회복 등)
  ctx.textAlign = "center";
  ctx.font = "bold 18px Arial";
  for (let f of floatTexts) {
    ctx.globalAlpha = Math.min(1, f.life / 20);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  ctx.restore();
  // ----- 여기부터는 화면 고정 (HUD) -----
  drawDarkness();
  drawUfoAimLines();
  drawHealArrows();
  drawPickupArrows();

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Time: " + Math.floor(time / 60), 10, 25);
  ctx.fillText("Kills: " + kills, 10, 50);
  ctx.save(); ctx.fillStyle = "#ffd23f"; ctx.fillText("Gold: " + fmtGold(gold + (goldSaved ? 0 : runGold)) + "  (+" + fmtGold(runGold) + ")", 10, 75);
  ctx.fillStyle = DIFF().color; ctx.font = "bold 15px Arial"; ctx.fillText("난이도: " + DIFF().name, 10, 98); ctx.restore();
  // 소리 상태 (오른쪽 위)
  ctx.textAlign = "right";
  ctx.font = "13px Arial";
  ctx.fillStyle = soundOn ? "rgba(255,255,255,0.75)" : "rgba(255,120,120,0.85)";
  ctx.fillText(soundOn ? "소리·음악 켬 (M)" : "소리·음악 끔 (M)", 744, 31);
  ctx.textAlign = "left";

  drawRoundInfo();
  drawHUD();
  if (gameState === "play") { drawUniqueHUD(); drawMinimap(); }

  // 가운데 큰 안내 글자 (ROUND 1, BOSS 등장, ROUND CLEAR)
  if (bannerTimer > 0 && choices.length === 0 && !gameClear && !gameOver) {   // 게임이 끝나면 안내 문구는 숨김
    ctx.globalAlpha = Math.min(1, bannerTimer / 20);
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 230, 800, 70);
    ctx.fillStyle = bannerText.includes("BOSS") ? "#ff6b5a" : "#ffd23f";
    ctx.font = "bold 36px Arial";
    ctx.textAlign = "center";
    ctx.fillText(bannerText, 400, 278);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  if (choices.length > 0) drawLevelUpChoices();

  if (gameClear) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, 800, 600);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd23f";
    ctx.font = "bold 50px Arial";
    ctx.fillText("GAME CLEAR!", 400, 250);
    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.fillText("고로캣이 외계인을 물리치고 햇빛을 되찾았다!", 400, 300);
    ctx.fillText("클리어 시간 " + Math.floor(time / 60) + "초 · 처치 " + kills + " · Lv." + player.level + " · 골드 +" + fmtGold(runGold), 400, 340);
    { ctx.fillStyle = "#ffd23f"; ctx.font = "bold 18px Arial"; ctx.fillText("클릭 또는 Enter: 결과 보기", 400, 400); }
    ctx.textAlign = "left";
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = "white";
    ctx.font = "bold 50px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 400, 280);
    ctx.font = "20px Arial";
    ctx.fillText("생존 " + Math.floor(time / 60) + "초 · 처치 " + kills + " · Lv." + player.level + " · 골드 +" + fmtGold(runGold), 400, 325);
    ctx.fillStyle = "#ffd23f"; ctx.font = "bold 18px Arial";
    ctx.fillText("클릭 또는 Enter: 메인 로비로", 400, 375);
    ctx.textAlign = "left";
  }
}

// 위쪽 가운데: 라운드, 남은 시간 / 보스 체력바
function drawRoundInfo() {
  let R = ROUNDS[round];
  let boss = enemies.find(e => e.isBoss);
  ctx.textAlign = "center";
  ctx.fillStyle = "white";
  ctx.font = "bold 18px Arial";
  let label = "ROUND " + (round + 1) + " / 4";
  if (boss) {
    ctx.fillText(label + "  ·  " + boss.name, 400, 24);
    ctx.fillStyle = "#111";
    ctx.fillRect(250, 32, 300, 14);
    ctx.fillStyle = "#e0402b";
    ctx.fillRect(250, 32, 300 * Math.max(0, boss.hp / boss.maxHp), 14);
    ctx.strokeStyle = "#ffd23f";
    ctx.lineWidth = 1;
    ctx.strokeRect(250, 32, 300, 14);
  } else if (roundClearTimer > 0 || gameClear) {
    ctx.fillText(label + "  ·  CLEAR", 400, 24);
  } else {
    let left = Math.max(0, Math.ceil(R.duration - roundTime / 60));
    ctx.fillText(label + "  ·  보스까지 " + left + "초", 400, 24);
  }
  ctx.textAlign = "left";
}

// 막대 그리기 도우미
function drawBar(x, y, w, h, ratio, color, label) {
  ctx.fillStyle = "#111";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, ratio)), h);
  ctx.strokeStyle = "#888";
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = "white";
  ctx.font = "bold 13px Arial";   // 줄어든 뒤에도 읽히도록 조금 크게
  ctx.textAlign = "center";
  ctx.fillText(label, x + w / 2, y + h - 3);
}

// 하단 중앙 플레이어 인터페이스
const HUD_SCALE = 0.7;   // 인터페이스 크기 비율 (1이면 원래 크기)

function drawHUD() {
  const W = 480, H = 96;
  // 줄어든 크기 기준으로 하단 중앙에 배치
  ctx.save();
  ctx.translate((800 - W * HUD_SCALE) / 2, 600 - H * HUD_SCALE - 6);
  ctx.scale(HUD_SCALE, HUD_SCALE);
  const x = 0, y = 0;   // 이 아래는 원래 크기 좌표로 그리고 scale로 한 번에 줄임

  // 패널 배경
  ctx.fillStyle = "rgba(20, 20, 30, 0.85)";
  ctx.fillRect(x, y, W, H);
  ctx.strokeStyle = "#e0a95b";
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, W, H);

  // 초상화: 고로캣
  ctx.fillStyle = "#333";
  ctx.fillRect(x + 10, y + 10, 64, 64);
  drawGorocat(x + 42, y + 47, 1, 0, false, 0.68);
  ctx.strokeStyle = "#aaa";
  ctx.strokeRect(x + 10, y + 10, 64, 64);
  // 레벨 표시
  ctx.fillStyle = "white";
  ctx.font = "bold 14px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Lv." + player.level, x + 42, y + 89);

  // 체력, 마나
  drawBar(x + 86, y + 12, 200, 18, player.hp / player.maxHp, "#d33", "HP " + Math.ceil(player.hp) + " / " + player.maxHp);
  drawBar(x + 86, y + 36, 200, 18, player.mp / player.maxMp, "#36c", "MP " + Math.floor(player.mp) + " / " + player.maxMp);

  // 보유 스킬 슬롯: 첫 칸은 빵가루 탄환, 나머지는 배운 순서대로
  let slots = [{ color: "#e0a95b", cool: burstLeft > 0 ? 0 : 1 - fireTimer / FIRE_DELAY, lv: 0, burst: BURST_COUNT }];
  for (let k of learnOrder) {
    let cd = skillCooldown(k);
    slots.push({ color: SKILL_DEFS[k].color, cool: cd ? 1 - skillTimer[k] / cd : 0, lv: skillLv[k] });
  }
  for (let i = 0; i < 4; i++) {
    let sx = x + 298 + i * 44, sy = y + 12;
    let sk = slots[i];
    ctx.fillStyle = "#222";
    ctx.fillRect(sx, sy, 40, 40);
    ctx.strokeStyle = sk ? "#e0a95b" : "#555";
    ctx.strokeRect(sx, sy, 40, 40);
    if (sk) {
      ctx.fillStyle = sk.color;
      ctx.beginPath();
      ctx.arc(sx + 20, sy + 20, 8, 0, Math.PI * 2);
      ctx.fill();
      // 쿨타임 표시 (어둡게 덮기)
      if (sk.cool > 0) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(sx, sy, 40, 40 * Math.min(1, sk.cool));
      }
      // 기본 무기는 연사 탄환 수 표시
      if (sk.burst) {
        ctx.fillStyle = "white";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "right";
        ctx.fillText("x" + sk.burst, sx + 38, sy + 38);
      }
      // 스킬 레벨
      if (sk.lv > 0) {
        ctx.fillStyle = "white";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "right";
        ctx.fillText("Lv" + sk.lv, sx + 38, sy + 38);
      }
    } else {
      ctx.fillStyle = "#555";
      ctx.font = "16px Arial";
      ctx.textAlign = "center";
      ctx.fillText("-", sx + 20, sy + 26);
    }
  }

  // 경험치
  drawBar(x + 86, y + 66, 384, 14, player.exp / player.nextExp, "#ffd23f", "EXP " + player.exp + " / " + player.nextExp);

  ctx.restore();
}


// ===== 인트로: 타이틀 그림 → (클릭) → 스토리 → (클릭) → 게임 시작 =====
// 타이틀 그림과 스토리 장면은 게임 속 캐릭터(정훈 디자인 고로캣·선노·졸병 SVG)를 그대로 써서 코드로 그림
let gameState = "title";        // "title" → "story" → "play"
let storyPage = 0, typeT = 0;   // 스토리 쪽 번호, 글자가 한 글자씩 나오는 진행도

const STORY = [
  { scene: "sunny",  text: "고양이 마을의 고로캣은 따뜻한 햇볕 아래에서 낮잠 자는 걸 세상에서 제일 좋아했어요." },
  { scene: "ufo",    text: "그러던 어느 날, 하늘에 커다란 우주선이 나타났어요." },
  { scene: "steal",  text: "외계인 대장 선노가 트랙터 빔으로 햇빛을 몽땅 빨아들여 훔쳐 가 버렸어요!" },
  { scene: "dark",   text: "세상은 깜깜해지고, 고로캣의 소중한 낮잠 시간도 사라졌어요." },
  { scene: "rise",   text: "고로캣은 검을 들고 일어섰어요. \"내 햇빛 돌려줘!\"  외계인을 무찌르고 햇빛을 되찾으러 출발!" },
